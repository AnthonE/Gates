# The shard's public reads, for the game.elopros.com HTTPS server (the
# vhost on 443 that already fronts /gates/watch/). The shard's status thread
# binds loopback 8431 (`shard-public.toml` `status_addr`) and answers one
# request per connection, serially; nginx is the buffer between it and the
# internet.
#
#   sudo cp ops/game-elopros-status.nginx.conf /etc/nginx/snippets/gates-status.conf
#   # inside game.elopros.com's `server { listen 443 … }`, replacing any
#   # `location = /gates/status.json` already there (nginx refuses two):
#   include snippets/gates-status.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
#   curl -s https://game.elopros.com/gates/status.json      # players, agents, …
#   curl -s https://game.elopros.com/gates/standings.json   # boards, deeds, hall
#   curl -s https://game.elopros.com/gates/payout/1.json     # what wipe 1 owes (404: nothing)
#   curl -s https://game.elopros.com/gates/rent.json         # rented buddies, spend
#
# The status thread speaks GET only, so HEAD goes upstream as GET and nginx
# drops the body. CORS: the shard sends no `Access-Control-Allow-Origin` on
# status.json, so nginx adds the platform's; it already sends `*` on
# standings.json, so nginx adds none there (two headers and a browser
# refuses both).

location = /gates/status.json {
    limit_except GET { deny all; }
    proxy_method GET;
    proxy_pass http://127.0.0.1:8431/status.json;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    add_header Access-Control-Allow-Origin "https://elopros.com" always;
}

location = /gates/standings.json {
    limit_except GET { deny all; }
    proxy_method GET;
    proxy_pass http://127.0.0.1:8431/standings.json;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
}

# A closed wipe's payout file, which the platform's cashier polls and pays
# (scry-forge `meter/gamepay.py`). The shard only answers a bare wipe number.
location ^~ /gates/payout/ {
    limit_except GET { deny all; }
    proxy_method GET;
    proxy_pass http://127.0.0.1:8431/payout/;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
}

# What each rented buddy has spent, written by `ops/buddy/rent.py`
# (`ops/gates-rent.service`) and read by the platform (scry-forge
# `meter/rent.py`). A file, not the shard: nothing here reaches 8431.
location = /gates/rent.json {
    limit_except GET { deny all; }
    alias /var/lib/gates-rent/public/rent.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}
