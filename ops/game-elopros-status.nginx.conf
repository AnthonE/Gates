# The shard's public reads, for the game.elopros.com HTTPS server (the
# vhost on 443 that already fronts /gates/watch/). The shard's status thread
# binds loopback 8431 (`shard-public.toml` `status_addr`) and answers one
# request per connection, serially; nginx is the buffer between it and the
# internet.
#
#   sudo cp ops/game-elopros-status.nginx.conf /etc/nginx/snippets/gates-status.conf
#   # inside game.elopros.com's `server { listen 443 … }`, replacing any
#   # `location = /gates/status.json` already there (nginx refuses two):
#   include snippets/gates-status.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
#   curl -s https://game.elopros.com/gates/status.json      # players, agents, …
#   curl -s https://game.elopros.com/gates/standings.json   # boards, deeds, hall
#   curl -s https://game.elopros.com/gates/payout/1.json     # what wipe 1 owes (404: nothing)
#   curl -s https://game.elopros.com/gates/online.json       # who is on, for Elo Pros playtime
#   curl -s https://game.elopros.com/gates/achievements.json # every wallet's achievements
#   curl -s https://game.elopros.com/gates/rent.json         # buddies: spend, state
#   curl -s -X POST https://game.elopros.com/gates/mind/<id> \
#       -H "Authorization: Bearer <token>" -H 'Content-Type: application/json' \
#       -d '{"jsonrpc":"2.0","id":1,"method":"ping"}'          # an own-brain agent
#
# The status thread speaks GET only, so HEAD goes upstream as GET and nginx
# drops the body. CORS: the shard sends no `Access-Control-Allow-Origin` on
# status.json, so nginx adds the platform's; it already sends `*` on
# standings.json, so nginx adds none there (two headers and a browser
# refuses both).

location = /gates/status.json {
    limit_except GET { deny all; }
    proxy_method GET;
    proxy_pass http://127.0.0.1:8431/status.json;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    add_header Access-Control-Allow-Origin "https://elopros.com" always;
}

location = /gates/standings.json {
    limit_except GET { deny all; }
    proxy_method GET;
    proxy_pass http://127.0.0.1:8431/standings.json;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
}

# A closed wipe's payout file, which the platform's cashier polls and pays
# (scry-forge `meter/gamepay.py`). The shard only answers a bare wipe number.
location ^~ /gates/payout/ {
    limit_except GET { deny all; }
    proxy_method GET;
    proxy_pass http://127.0.0.1:8431/payout/;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
}

# What each buddy has spent and is doing, written by `ops/buddy/runner.py`
# (`ops/gates-buddies.service`) and read by the platform (scry-forge
# `meter/buddy.py`). A file, not the shard: nothing here reaches 8431.
location = /gates/rent.json {
    limit_except GET { deny all; }
    alias /var/lib/gates-buddies/public/rent.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

# An owner's own harness playing its agent (MCP over streamable HTTP), bridged
# to that agent's `jev-bot --mcp` by `ops/buddy/mind_bridge.py` in the
# buddies runner. A `look` waits up to 25 s for a decision, and a call may
# first wait for the body to come onto the island, so reads run long; no
# buffering, so an answer goes out the moment it comes back. The bridge
# checks the bearer token and the rate; nginx only caps the body.
location ^~ /gates/mind/ {
    limit_except POST GET DELETE { deny all; }
    # An app that takes a connector by URL alone carries the agent's token
    # in the path (`mind_bridge.py`): never written to the access log.
    access_log off;
    proxy_pass http://127.0.0.1:8433;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    client_max_body_size 64k;
    proxy_connect_timeout 2s;
    proxy_read_timeout 90s;
    proxy_send_timeout 10s;
    add_header Cache-Control "no-store" always;
}

# The buddies' highlight clips (`ops/buddy/clips.py publish`), played on
# elopros.com/buddy.html: plain files, cached a day (a clip's name never
# changes; a new clip is a new name).
location ^~ /gates/clips/ {
    limit_except GET { deny all; }
    alias /var/lib/gates-buddies/public/clips/;
    types { video/mp4 mp4; application/json json; }
    add_header Cache-Control "public, max-age=86400" always;
    add_header Access-Control-Allow-Origin "https://elopros.com" always;
}

# Who is on right now, for the platform (Elo Pros `playtime.py` polls it once a
# minute). Read server-side by the meter, so no CORS header.
location = /gates/online.json {
    limit_except GET { deny all; }
    proxy_method GET;
    proxy_pass http://127.0.0.1:8431/online.json;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
}

# Every wallet's achievements, for the platform (scry-forge
# `meter/achievements.py` reads it beside status.json and draws profiles and
# the store page from it). Read server-side, and the shard already sends `*`,
# so no CORS header here. Up to 8 MiB (`achievements::JSON_CAP`).
location = /gates/achievements.json {
    limit_except GET { deny all; }
    proxy_method GET;
    proxy_pass http://127.0.0.1:8431/achievements.json;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}
