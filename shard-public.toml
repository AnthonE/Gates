# The PUBLIC Gates shard — `cargo run -p server --bin shard -- shard-public.toml`
#
# Differences from shard.toml (the local dev one) and why each matters:
#   bind      0.0.0.0, not loopback — reachable from outside this box.
#   port 61234 — and the choice is NOT free-port arithmetic. This box sits
#             behind a Hetzner CLOUD firewall as well as ufw, and the cloud
#             one is outside the VM: opening a port in ufw does nothing for
#             it. Measured 2026-08-03 by probing from morr while tcpdumping
#             here — 4434 arrived 3/3, 4466 arrived 0/3 with ufw allowing
#             both. The range 49152-65535/udp IS open at the cloud firewall
#             (opened for WebRTC DataChannels; 50000/55000/60000 all arrived),
#             so the shard lives there. 4433/4434/4455 are taken by thrml-ws,
#             the live MMO game-server and its wt-gateway.
#   cert_pem  a REAL Let's Encrypt chain that MUST COVER `domain` below —
#             `game.elopros.com`, an A record onto this box, DNS-only (a
#             Cloudflare-proxied name cannot carry WebTransport, which is
#             QUIC over UDP). With a trusted chain a validating client needs
#             no `serverCertificateHashes` pinning — that is the dev flow,
#             and it requires a short-lived cert.
#             certbot renews these; the shard reads them at boot, so a
#             renewal needs a restart to take. `ops/certbot-deploy-hook.sh`
#             is that restart, and it now REFUSES to install a chain that
#             does not cover the name below rather than serving one that
#             cannot answer for it.
#             ⚠ **The lineage is expanded, not replaced.** Ask for both
#             names — `certbot certonly --expand -d game.moreright.xyz -d
#             game.elopros.com` — so the lineage keeps its path on disk (the
#             hook copies from `/etc/letsencrypt/live/<lineage>`, and a
#             rename is a delete-and-reissue with a window where this shard
#             has no cert at all). A lineage named for the retired brand is
#             a fact about the filesystem, never a label.
#   NO dev_spawn — a public shard must not land every joiner on one point
#             (config.rs says so). The welcome's dev bit tracks this key,
#             and bot_smoke's `test_welcome_dev_bit_tracks_dev_spawn` pins
#             it: a public shard reporting dev=true would offer a dev
#             surface to every player.
#   PERSISTENCE IS ON (operator, 2026-08-07). The island, the bases and the
#             bodies survive a restart, and players keep what they were
#             carrying. require_auth is on with them because a save is filed
#             under the identity the handshake proves, and a guest has none.
#   domain    must match the host players dial — it is in what they sign,
#             and it is a SINGLE name, so it is a cutover and not a SAN.

bind = "0.0.0.0:61234"

# ⚠ **CHANGING THIS SEED IS A WIPE** — the island is regenerated, so every base
# standing on it is gone (the player store is keyed by identity and survives;
# `world_file` no longer describes the same island). Never changed. It was
# proposed on 2026-08-14 and **withdrawn on the re-measurement**: the report
# that called this island the flattest of forty had swept a quarter of it, and
# over the whole square it is upper-third for relief and granite.
# `shard.toml.example` carries the numbers.
seed = 20260731
cert_pem = "/home/master/gates-certs/fullchain.pem"
key_pem = "/home/master/gates-certs/privkey.pem"

# Persistence, when it is armed. Both keys, and require_auth with them.
#
#   world_file  bases, boxes, bags, fuses, stumps — and the BODIES standing
#               in the world. Without it a restart deletes every sleeper on
#               the shard and a player raided while offline comes back from
#               their store record with everything the raid took.
#   save_file   the player-keyed store: how you come back when the world has
#               NOT got you (a wipe, an eviction, a fresh shard).
#
# Separate keys because a wipe deletes one and keeps the other. A clean
# `systemctl stop` flushes both; a crash costs at most
# world_save_interval_ticks of the world (60 s by default).
#
require_auth = true
save_file = "/home/master/gates-data/players.save"
world_file = "/home/master/gates-data/island.world"

# Identity is SIWE (2026-08-07). A joiner signs a nonce this shard chose
# with the key behind the address they claim, and the shard recovers the
# signer — so `require_auth = true` now means what it says. The player key is
# the lowercase 0x address, which is stable across sessions; the session
# token it replaced was not, and would have handed every returning player a
# new character.
#
# `domain` is what goes in the signed message and it MUST be the host players
# dial — that is the whole of the domain binding, and a mismatch refuses
# every login rather than failing quietly.
#
# ⚠ **ONE NAME, SO IT IS A CUTOVER.** The client signs the host it DIALLED
# and never anything the server said (`client/src/lib.rs` — letting the
# server name itself would hand the binding away), and the shard rebuilds
# the text from this key. There is no second name to accept during a move:
# the instant `shards.toml` publishes a name, this key has to be it, and the
# certificate above has to cover it. Moved to `game.elopros.com` 2026-08-23,
# behind the platform's 2026-08-20 move (`DECISIONS.md`).
domain = "game.elopros.com"

# The status endpoint (crates/server/src/status.rs): GET /status.json,
# integers only, read off the shard's counters and never touching the sim.
# It is what lights the `players` column in the shard list.
#
# **LOOPBACK, AND FRONTED BY NGINX** (operator, 2026-08-11). The published
# url is `https://game.elopros.com/gates/status.json`, which is a
# `location` in the vhost this box already serves on 443. Three reasons this
# beat binding it publicly, and the first is the one that decided it:
#
#   1. **No firewall act.** The `DECISIONS.md` 2026-08-03 measurement is
#      that a Hetzner CLOUD firewall sits outside this VM and ufw buys
#      nothing against it; the range the shard's own port lives in was
#      opened for **udp**. A public TCP port here is unproven and would need
#      a rule added in a web console — an operator act with no gate on it.
#      443 is already open, already serving, and already proven.
#   2. **https, like every other url we publish.** A bare bind would be
#      plain http, so the one number the client polls would be the one thing
#      it fetches unauthenticated over cleartext.
#   3. The status thread answers connections SERIALLY on one thread by
#      design (bounded, wall 4's spirit). nginx in front of it is a buffer
#      between that and the open internet.
#
# 8431 rather than the example's 8080: 8080 is taken on this box by another
# service, and a bind failure REFUSES THE BOOT (config.rs says why — a shard
# whose config names an endpoint it silently does not serve is the defect
# the parser refuses everywhere else).
status_addr = "127.0.0.1:8431"

# ── the ticket door ──────────────────────────────────────────────────────────
#
# **COMMENTED OUT, AND THAT IS THE LIVE STATE: this shard checks no ticket.**
# `entitle::Config::off()` is the shipping default (`config.rs`), so with this
# key absent every joiner is admitted and the sweep never runs.
#
# Correct today — gates has no ticket contract, so there is no licence to
# enforce and `POST /api/ticket/gates/check` answers
# `every_wallet_entitled: true` to anyone who asks. Uncommenting now would add
# a network round trip per join to learn nothing.
#
# ⚠ **THE DAY THE TICKET IS ARMED, THIS LINE IS THE WHOLE ENFORCEMENT.** The
# depot gate is off by default and deliberately so — elo's `tickets.py` says
# it in its own words, *"downloads ship open — the servers are the wall"*,
# because the game is open source and the bytes were never the secret. So the
# official servers are not one enforcement point among several; they are the
# only one, and this key is how one exists. elo's `TICKET.md` §8b step 8 is
# the same instruction from the other side, and
# `deploy/launch_preflight.py --shard-config <this file>` grades it.
#
# `entitle_slug` defaults to `crate::ENTITLE_SLUG` ("gates") and the timeout
# and sweep to 6s / 120s, so the one line below is the whole arming. The sweep
# window is how long a sold copy can linger — a posted knob, not a hole.
#
# Order it AFTER `SCRY_TICKET_GATES` is set on the origin: pointed at an
# unticketed title this admits everyone anyway, which proves nothing.
#
# The kick rule is in `entitle.rs` and does not bend: kick on a definite
# on-chain zero, NEVER on a failed read. An RPC outage that booted every
# paying player would be the never-raises trap with a boot on. Watch
# `entitle_unknown` in the stats — armed and climbing means the door is open
# and nobody can see it.
#
# entitle_origin = "https://elopros.com"   # scry.moreright.xyz retired 2026-08-20 (410)
