# The asset store packs: our models, re-packed for any engine and listed on
# elopros.com/assets.html by the house. `ci/store_pack.py` builds each pack's
# folder (GLBs with PNG textures, elo-asset.json, the preview); the meter's
# `asset_house.py publish <folder>` pins and lists it.
#
# What is in here is Meshy paid-plan output (MANIFEST.md, the deploy/ rail):
# ours to licence. The Founder's skins (the alpha gift) and Rust's own item
# designs stay out. The order here is the order they are published, which is
# the order the store shows them in.

version = "1.0.0"
license = "CC-BY-4.0"
engines = ["any"]

[[pack]]
id = "gates-triple-t"
name = "Triple T"
about = """Triple T, the body every Gates player starts as: one rigged character, 1.8 m tall at scale 1, 54 joints, with 55 animation clips: walk, jog, sprint, crouch, jump, swim, roll, sit, greet, dance, punch, sword, archery, pistol and rifle, hit reactions and a death. Arms and body are separate meshes, for a first-person view. GLB with a PNG texture, about 31k triangles."""
tags = ["gates", "character", "humanoid", "rigged", "animated", "mascot"]
made_with = "Built in Meshy from our own prompt; 46 of its clips are retargeted from Quaternius's Universal Animation Library (CC0)."
source = "https://quaternius.com/"
rename_clips = { "01a00b60-c754-7f1a-a288-12c8a3379b57" = "Greet" }
files = [
  { src = "assets/models/stumpy.glb", name = "triple_t.glb" },
]

