[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/protocol",
    "crates/server",
    "crates/client-core",
    "crates/client",
    "crates/content",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
# **The one place a version number is typed.** Every crate inherits it with
# `version.workspace = true`, so a release is this line plus a tag and nothing
# else — there is no second copy to forget. `protocol::version` reads it back
# out of `CARGO_PKG_VERSION` at compile time, which is what the client prints
# in its corner and what the shard's minimum-client gate compares against, so
# bumping here moves the displayed build, the wire's `ver` field and the depot
# id together. `ci/depot.py` reads the same value off `crates/client`.
#
# Semver, and the middle field is where alpha work lands: the wire's own
# compatibility is `PROTO_VER`, not this, so this number is free to describe
# the *release* rather than the packet layout.
version = "0.1.0"

# Release profile keeps debug assertions off but stays deterministic: no
# fast-math anywhere, ever. opt-level 3 + thin LTO for the wasm artifact size.
[profile.release]
lto = "thin"
codegen-units = 1

# **Dependencies carry no debug info, and this is the disk fix.**
#
# Measured 2026-08-06: `target/debug/deps` was **30G**, of which **16.9G was
# thirteen executables at ~1.4G each** — `gates`, `client`, `soundbank` and the
# four render-tier test binaries, plus stale hash variants of each. Nothing
# about those binaries is 1.4G of code; it is DWARF for ~565 statically linked
# Bevy crates, copied whole into every one of them, because `debug` was never
# set and the dev profile defaults to full debug info.
#
# We do not step into wgpu. A backtrace through Bevy loses line numbers and
# keeps its symbols, which is the whole cost. Workspace members are NOT matched
# by `"*"` and keep full debug info, so debugging OUR code is unchanged.
#
# This is not a micro-optimisation on this box: the disk is 49G, a feature or
# profile change invalidates every artifact and cargo does not collect the old
# set, and `rust-lld` answers a full disk with SIGBUS mid-link rather than
# ENOSPC — which reads as an LLVM crash. That failure cost two builds today.
# Dependencies are optimized even in dev builds. This is Bevy's own standard
# advice and it is about the renderer only: an unoptimized wgpu/naga/image
# stack renders single-digit frames and takes minutes to specialize a
# pipeline, which makes a capture run unusable on a box with no GPU.
# Workspace members are NOT covered by `"*"`, so sim-core, protocol and the
# server keep their fast debug rebuild — and every gate runs `--release`
# anyway, so no wall moves.
[profile.dev.package."*"]
opt-level = 3
debug = false

# …and sim-core with them, because the renderer is one of its callers now.
# Meshing one 64 m chunk is 4,225 `terrain::height` taps and a chunk ring is
# 25 of them; the clutter fill is 721 draws per 16 m tile. Unoptimized that is
# seconds per chunk. This changes no arithmetic — Rust emits no fast-math at
# any opt level, which is the same property the release profile's comment
# above depends on — and every gate runs `--release` regardless.
[profile.dev.package.sim-core]
opt-level = 3
