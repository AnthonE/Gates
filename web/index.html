<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gates</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0c1117;
        color: #dbe3ea;
        font: 14px/1.45 system-ui, sans-serif;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* UI is plain DOM outside the render loop (DESIGN.md L8). */
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 17, 0.92);
        z-index: 10;
      }
      #start h1 {
        letter-spacing: 0.5em;
        font-weight: 300;
        margin: 0 0 8px 0.5em;
      }
      #start label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: min(440px, 90vw);
        color: #8ea0b0;
        font-size: 12px;
      }
      #start input {
        background: #131a22;
        border: 1px solid #2a3642;
        color: #dbe3ea;
        padding: 7px 9px;
        border-radius: 4px;
        font: 13px monospace;
      }
      #start button {
        margin-top: 8px;
        padding: 8px 26px;
        background: #1d2b3a;
        border: 1px solid #3a5064;
        color: #dbe3ea;
        border-radius: 4px;
        cursor: pointer;
      }
      #start button:hover {
        background: #24374b;
      }
      #starterr {
        color: #d98b8b;
        font-size: 12px;
        min-height: 1em;
        max-width: min(440px, 90vw);
        word-break: break-word;
      }
      #hint {
        color: #5d6d7c;
        font-size: 12px;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 10px;
        font: 11px monospace;
        color: #b8c6d2;
        text-shadow: 0 1px 2px #000;
        white-space: pre;
        z-index: 5;
        pointer-events: none;
        display: none;
      }
      #cross {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #e6edf3;
        text-shadow: 0 0 3px #000;
        z-index: 5;
        pointer-events: none;
        display: none;
      }
      #hotbar {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        display: none;
        gap: 4px;
        z-index: 5;
        pointer-events: none;
      }
      .hotcell {
        width: 74px;
        height: 40px;
        background: rgba(10, 15, 20, 0.55);
        border: 1px solid #2a3642;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font: 10px monospace;
        color: #cdd9e4;
        text-shadow: 0 1px 2px #000;
        overflow: hidden;
      }
      .hotcell.sel {
        border-color: #7fa8c9;
        background: rgba(28, 44, 58, 0.7);
      }
      /* Chat: log bottom-left (the reference's kill/contacts feed sits
         there), composer directly under it. Plain DOM, outside the RAF
         path like every other panel. */
      #chatlog {
        position: fixed;
        left: 12px;
        bottom: 66px;
        max-width: min(520px, 52vw);
        display: none;
        z-index: 5;
        pointer-events: none;
        font: 12px monospace;
        color: #c8d4de;
        text-shadow: 0 1px 3px #000;
      }
      .chatline {
        animation: chat-fade 12s linear forwards;
        word-break: break-word;
      }
      #chatlog.held .chatline {
        animation: none;
        opacity: 1;
      }
      .chatline .who {
        color: #7d8fa0;
      }
      .chatline.global .who {
        color: #d9b96f;
      }
      .chatline.own .who {
        color: #a9cf8f;
      }
      @keyframes chat-fade {
        0% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #chat {
        position: fixed;
        left: 12px;
        bottom: 40px;
        width: min(520px, 52vw);
        display: none;
        z-index: 7;
      }
      #chatinput {
        width: 100%;
        background: rgba(10, 15, 20, 0.88);
        border: 1px solid #3a5064;
        border-radius: 4px;
        color: #dbe3ea;
        padding: 5px 7px;
        font: 12px monospace;
        outline: none;
      }
      /* Vitals — bottom-right above the hotbar, the place the reference
         frames put them. One row for now (health); food and water land
         with the hunger timer. */
      #vitals {
        position: fixed;
        right: 16px;
        bottom: 92px;
        display: none;
        z-index: 5;
        pointer-events: none;
        font: 13px monospace;
        color: #e8efe0;
        text-shadow: 0 1px 2px #000;
      }
      .vrow {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-end;
      }
      .vbar {
        position: relative;
        width: 132px;
        height: 10px;
        background: #1a1d18cc;
        border: 1px solid #000a;
      }
      .vfill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: #c8402f;
      }
      .vnum {
        min-width: 30px;
        text-align: right;
      }
      #toasts {
        position: fixed;
        right: 24px;
        top: 40%;
        display: none;
        z-index: 5;
        pointer-events: none;
        font: 13px monospace;
        color: #d7e6c8;
        text-align: right;
      }
      /* Craft panel — plain DOM over the live world (clarity over chrome
         at alpha; the reference renders its menus the same way). */
      #craft {
        position: fixed;
        right: 12px;
        top: 48px;
        bottom: 96px;
        width: min(340px, 44vw);
        display: none;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
        background: rgba(10, 15, 20, 0.82);
        border: 1px solid #2a3642;
        border-radius: 6px;
        padding: 8px;
        z-index: 6;
        font: 11px monospace;
      }
      #craft h2 {
        margin: 0 0 4px;
        font: 12px monospace;
        letter-spacing: 0.2em;
        color: #8ea0b0;
      }
      .crow {
        padding: 5px 6px;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
        color: #cdd9e4;
      }
      .crow:hover {
        background: rgba(28, 44, 58, 0.7);
        border-color: #3a5064;
      }
      .crow .cname {
        color: #e6edf3;
        font-size: 12px;
      }
      .crow .cmeta {
        color: #7d8fa0;
      }
      .crow.gated {
        opacity: 0.55;
        cursor: default;
      }
      .crow.gated:hover {
        background: none;
        border-color: transparent;
      }
      .crow .gate {
        color: #d9b96f;
      }
      .cin.ok {
        color: #a9cf8f;
      }
      .cin.miss {
        color: #d98b8b;
      }
      #craftq {
        position: fixed;
        left: 50%;
        bottom: 60px;
        transform: translateX(-50%);
        display: none;
        gap: 4px;
        z-index: 5;
      }
      #build {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        display: none;
        padding: 4px 10px;
        background: rgba(10, 15, 20, 0.55);
        border: 1px solid #3a5064;
        border-radius: 4px;
        font: 11px monospace;
        color: #cdd9e4;
        z-index: 5;
        pointer-events: none;
      }
      .qcell {
        min-width: 90px;
        padding: 4px 8px;
        background: rgba(10, 15, 20, 0.55);
        border: 1px solid #4a5a3a;
        border-radius: 4px;
        text-align: center;
        font: 10px monospace;
        color: #cdd9e4;
        cursor: pointer;
      }
      .qcell:hover {
        border-color: #d98b8b;
      }
      .toast {
        text-shadow: 0 1px 3px #000;
        animation: toast-fade 1.6s ease-out forwards;
      }
      @keyframes toast-fade {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        15% {
          opacity: 1;
          transform: translateY(0);
        }
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <div id="cross">·</div>
    <div id="hotbar"></div>
    <div id="build"></div>
    <div id="craftq"></div>
    <div id="craft"></div>
    <div id="vitals"></div>
    <div id="toasts"></div>
    <div id="chatlog"></div>
    <div id="chat">
      <input
        id="chatinput"
        maxlength="48"
        spellcheck="false"
        autocomplete="off"
        placeholder="say something · /g for global · esc cancels"
      />
    </div>
    <div id="start">
      <h1>GATES</h1>
      <label
        >server
        <input id="url" spellcheck="false" />
      </label>
      <label
        >dev cert sha-256 (paste the shard log's dotted hex; leave empty for a
        real certificate)
        <input id="cert" spellcheck="false" />
      </label>
      <button id="connect">connect</button>
      <p id="starterr"></p>
      <p id="hint">
        WASD move · shift sprint · click to look around · hold left mouse to
        gather · 1–6 select hotbar · C craft (click a recipe; shift ×5;
        click a queued job to cancel) · B build (wheel picks the piece,
        R/F the level, right-click places) · T or enter to chat (20 m
        local; prefix <code>/g </code> for global)
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
