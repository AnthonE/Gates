<!--
  Cooked Meat — ours, not game-icons.net. See `raw_meat.svg` for why these
  two are authored rather than rasterised from the archive.

  **The same silhouette as raw, plus steam.** That is the whole design: the
  pair is one item in two states, and a hotbar cell 44 px across cannot
  carry a subtler difference than "this one is giving off heat". The haunch
  is shifted down and scaled slightly to make room for the wisps rather than
  drawn differently, so a player reading the two side by side sees the steam
  and nothing else change.

  No attribution is owed for this file; `assets/icons/CREDITS.md` says so.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g fill="#fff">
    <!-- Steam: three wisps, the middle one taller, all rising and curling
         the same way so they read as one plume rather than three marks. -->
    <g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round">
      <path d="M150 132c-26-22 26-40 0-62"/>
      <path d="M250 108c-26-26 26-46 0-72"/>
      <path d="M350 132c-26-22 26-40 0-62"/>
    </g>
    <!-- The bone, and then the haunch over its lower end — `raw_meat.svg`'s
         geometry translated down and scaled to 0.86 to clear the steam. -->
    <g transform="translate(36 132) scale(0.86)">
      <path d="M262 262 L392 132" stroke="#fff" stroke-width="52" stroke-linecap="round" fill="none"/>
      <circle cx="404" cy="96" r="42"/>
      <circle cx="440" cy="132" r="42"/>
      <ellipse cx="212" cy="312" rx="152" ry="128" transform="rotate(-38 212 312)"/>
    </g>
  </g>
</svg>
