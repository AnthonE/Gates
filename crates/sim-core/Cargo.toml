[package]
name = "sim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# rlib for the server and client-core bridge; cdylib so the parity gate can
# build this crate directly to wasm32-unknown-unknown and drive the probe
# exports from node with no bindgen in between.
crate-type = ["rlib", "cdylib"]

[dependencies]
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
# The transcendentals (`fmath`): pure Rust, the same code on every target,
# so native and wasm get the same bits. No `arch` feature: no per-CPU paths.
libm = { version = "0.2.16", default-features = false }
