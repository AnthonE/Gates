[package]
name = "agentkey"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# **The one crate in this repo that holds a private key** (agent players,
# `NETCODE.md` §2.4). Its own crate so the boundary is a dependency edge
# rather than a convention: the desktop client and the bot tools link it,
# and the browser build cannot — `client` names it under `native` only, so
# no page can ever carry a key, which is one of the three rules this crate
# exists to keep (never logged, never from argv, never in the page).
[dependencies]
protocol = { path = "../protocol" }
# The curve and ECDSA with recovery — the same two features `server` builds
# for `auth::verify`, so this adds a line and nothing to the lock.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
tiny-keccak = { version = "2", features = ["keccak"] }
# Already in the lock through `k256`: the file's bytes and the parsed secret
# are wiped rather than left for the allocator to hand to somebody else.
zeroize = "1"
