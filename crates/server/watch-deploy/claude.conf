# Optional systemd drop-in: install as gates-watch.service.d/claude.conf and
# remove jev.conf (drop-ins apply in name order, so jev.conf would win).
# Claude decides, through examples/claude_agent.py, and sees the frame this
# watch page serves (jev-watch sets GATES_FRAME_URL itself).
# The required environment file is root-owned, mode 0600, outside the repo:
# ANTHROPIC_API_KEY (a key from the Console organization the Max plan's API
# credits are linked to), and optionally DISCORD_WEBHOOK_URL.
# The day cap is a ceiling, not a target: at Haiku's price it bounds the
# preview to a few dollars a day even if a request costs more than measured.
[Service]
EnvironmentFile=/etc/gates-watch/anthropic.env
Environment=CLAUDE_MODEL=claude-haiku-5-5
ExecStart=
ExecStart=/usr/bin/xvfb-run -a -s "-screen 0 640x360x24" /mnt/hive-data/gates-watch/current/jev-watch --continuous --listen 127.0.0.1:8081 --assets /mnt/hive-data/gates-watch/assets --content /mnt/hive-data/gates-watch/current/content --think-ms 5000 --timeout-ms 20000 --max-requests-day 4000 --external /mnt/hive-data/gates-watch/venv/bin/python /mnt/hive-data/gates-watch/current/claude_agent.py
