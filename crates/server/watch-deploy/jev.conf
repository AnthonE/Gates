# Optional systemd drop-in: install as gates-watch.service.d/jev.conf.
# The required environment file is root-owned, mode 0600, outside the repo.
[Service]
EnvironmentFile=/etc/gates-watch/typesafe.env
ExecStart=
ExecStart=/usr/bin/xvfb-run -a -s "-screen 0 640x360x24" /mnt/hive-data/gates-watch/current/jev-watch --continuous --listen 127.0.0.1:8081 --assets /mnt/hive-data/gates-watch/assets --content /mnt/hive-data/gates-watch/current/content
