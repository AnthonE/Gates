[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
content = { path = "../content" }
sim-core = { path = "../sim-core" }
protocol = { path = "../protocol" }
client-core = { path = "../client-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "signal"] }
# SIWE verification: recover the signer of a `personal_sign` signature and
# derive its Ethereum address. Two small, ubiquitous crates and no way to do
# this without them — hand-rolling secp256k1 is not a thing anyone should do.
# `k256` with default features off keeps it to the curve and ECDSA recovery.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
tiny-keccak = { version = "2", features = ["keccak"] }
# The per-connection nonce. OS entropy, because a guessable nonce is a
# signature anybody can replay.
getrandom = "0.2"
# Git-pinned ≥ 0f7609a (CLAUDE.md traps, NETCODE.md §2.2): crates.io still
# tops out at 0.7.1, which has the two-byte remote panic (#317). This rev is
# main as of 2026-07-25, containing the fix plus one header-order fix.
wtransport = { git = "https://github.com/BiagioFesta/wtransport", rev = "a11e6a8e7ff33c6eef522d308007da55d1df9f81", features = [
    "dangerous-configuration",
    "self-signed",
    "quinn",
] }
rtrb = "0.3"
# The entitlement check (`entitle.rs`): does this player own a copy? One GET
# at join and one POST per roster sweep, against scry's ticket routes.
#
# `rustls` rather than a system TLS, and the reason is the client's reason
# next door: one trust store the build controls, on a box that may have no
# OpenSSL. Same crate, same version and the same two features the client
# already builds for the shard list, so this adds a line to a manifest and
# nothing to the lock. Blocking on purpose — it runs on the handshake task
# (already waiting on a network) and on the sweep's own thread, never on the
# sim thread (wall 3) and never on the accept loop.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# Save-record integrity only (store.rs): a torn write has to be detectable at
# load. Same crate and version `sim-core` and `content` already build, so this
# adds a line to a manifest and nothing to the tree.
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

[dev-dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
tiny-keccak = { version = "2", features = ["keccak"] }
# **A DEV-dependency, and the direction still holds.** `client` must never
# depend on `server` (that would ship the authoritative sim inside the client
# binary), and it does not; this is the other way round and only for tests.
# `tests/tls_posture.rs` is the reason: what the client trusts can only be
# proven against a real shard serving a real certificate, so the gate needs
# both halves in one binary. Default features, so no Bevy — this costs the
# server's test build one small rlib, not the renderer tier.
client = { path = "../client" }
