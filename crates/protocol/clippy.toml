# The same walls as sim-core (CLAUDE.md walls 1/3, DESIGN.md L3/L5):
# snapshot encoding runs on the sim thread and input decoding on the net
# tasks' hot path, so protocol code lives under the sim's discipline —
# no clocks, no locks, no I/O types, no String, no float escape hatches.
# ci/gates.sh runs clippy with -D warnings; any hit is a red gate.

disallowed-types = [
    # Nondeterministic iteration (wall 1)
    "std::collections::HashMap",
    "std::collections::HashSet",
    # Locks and channels (wall 3 / L3)
    "std::sync::Mutex",
    "std::sync::RwLock",
    "std::sync::Condvar",
    "std::sync::Barrier",
    "std::sync::mpsc::Sender",
    "std::sync::mpsc::Receiver",
    # Clocks and I/O (wall 1 / L1)
    "std::time::Instant",
    "std::time::SystemTime",
    "std::fs::File",
    "std::net::TcpStream",
    "std::net::UdpSocket",
    # Heap-owned strings have no business on the hot path (L5)
    "std::string::String",
]

disallowed-methods = [
    # libm / transcendentals and every float op outside the wall-1 set
    "f32::sin", "f32::cos", "f32::tan",
    "f32::asin", "f32::acos", "f32::atan", "f32::atan2",
    "f32::sin_cos", "f32::exp", "f32::exp2", "f32::ln",
    "f32::log", "f32::log2", "f32::log10", "f32::powf", "f32::powi",
    "f32::floor", "f32::ceil", "f32::round", "f32::trunc", "f32::fract",
    "f32::rem_euclid", "f32::hypot", "f32::cbrt", "f32::recip",
    "f32::to_degrees", "f32::to_radians", "f32::signum", "f32::abs",
    # FMA is the parity killer (DESIGN.md §4)
    "f32::mul_add",
    "f64::sin", "f64::cos", "f64::tan",
    "f64::asin", "f64::acos", "f64::atan", "f64::atan2",
    "f64::sin_cos", "f64::exp", "f64::exp2", "f64::ln",
    "f64::log", "f64::log2", "f64::log10", "f64::powf", "f64::powi",
    "f64::floor", "f64::ceil", "f64::round", "f64::trunc", "f64::fract",
    "f64::rem_euclid", "f64::hypot", "f64::cbrt", "f64::recip",
    "f64::to_degrees", "f64::to_radians", "f64::signum", "f64::abs",
    "f64::mul_add", "f64::sqrt",
    # Wall-clock reads (L1)
    "std::time::Instant::now",
    "std::time::SystemTime::now",
    # Thread spawning (wall 1)
    "std::thread::spawn", "std::thread::sleep",
]

disallowed-macros = [
    # No String/format!/logging on the hot path (wall 3 / L5)
    "std::format",
    "std::print", "std::println",
    "std::eprint", "std::eprintln",
    "std::dbg",
]
