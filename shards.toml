# The shards this game publishes. `./ci/shardlist.py` turns this into the
# `elo-shardlist-v1` document that BOTH the elo launcher's Servers window
# and the game's own intro screen read (`crates/client/src/shardlist.rs`).
#
# `shards.toml.example` is the annotated copy — every field's why lives
# there. This file is the real one, and it is committed rather than
# gitignored (unlike `shard.toml`) because it holds no deployment secret:
# it is the list of public addresses we are asking strangers to dial.
#
# Regenerate and publish:
#   ./ci/shardlist.py                  # -> target/servers.json
#   ./ci/shardlist.py --self-test      # the gate ci/gates.sh runs
# then the two OPERATOR acts, in this order and never the other one:
#   1. copy servers.json into the origin's $SCRY_DEPOTS_DIR/gates/
#   2. set manifest.servers.url to
#      https://elopros.com/api/launcher/servers/gates
# The order matters: `servers.url` pointing at a file that is not there is
# an error dialog on a game that is running fine, which is worse than the
# honest "no shards published" both readers draw while it is null.
# Both acts are DONE — the url is set in scry-forge's
# `data/launcher/gates.manifest.json` and the origin answers 200. What is
# left on the box is step 1 again, whenever a row here changes.

[[shard]]
# **`id` is the row KEY** — a reader builds its row and its favourite from it,
# so changing one splits a shard into two in everyone's list. This file said
# `eu-1` while the document actually being served said `us-east-1`, which meant
# the next person to run this generator would have re-published the split
# without touching a line. Adopted the SERVED name rather than the committed
# one, in that direction on purpose: players already have `us-east-1`, and it
# is also the true one — the box is Hetzner's Ashburn site, so `eu-1` was
# wrong about geography as well as out of date.
id = "us-east-1"
name = "Gates US East 1"

# The name, not the address: the certificate is issued for this host and
# WebTransport needs it for SNI. The port is `shard-public.toml`'s bind, and
# it sits in 49152-65535 because that is the range the Hetzner cloud
# firewall actually passes (`DECISIONS.md` 2026-08-03 — measured, not
# assumed).
#
# ⚠ **THREE THINGS CARRY THIS NAME AND THEY MOVE TOGETHER OR NOT AT ALL**
# (`DECISIONS.md` 2026-08-23, and the row is there because they did not).
# The row below is what a player DIALS; `shard-public.toml`'s `cert_pem`
# decides what name the QUIC handshake can prove, and its `domain` decides
# what name a login is signed against. Move one and the shard is dark in a
# way that reads as a client bug:
#
#   list ahead of the cert    → "invalid peer certificate: certificate is
#                                only valid for DnsName(...)" — the client
#                                is right to refuse, it validates against
#                                the platform root store with no pin
#   list ahead of the domain  → the handshake succeeds and every login is
#                                REFUSE_AUTH, because the client signs the
#                                host it dialled (`client/src/lib.rs`) and
#                                the shard rebuilds the message from
#                                `domain`
#
# That first failure was live from the 2026-08-20 platform domain move
# until 2026-08-23: the SERVED document was moved to `game.elopros.com` by
# hand and this file — the document's own generator input — was not, so
# re-running `./ci/shardlist.py` would have silently reverted it. They agree
# again now.
addr = "game.elopros.com:61234"

# The seed is what makes one island different from another, so naming it is
# more useful than naming a map that does not exist.
map = "island 20260731"

# Where this shard's LIVE count is polled from, every STATUS_POLL_SECS, by
# both readers. It is `shard-public.toml`'s `status_addr` (127.0.0.1:8431)
# fronted by the nginx vhost already serving 443 on this box — see that
# file for why it is not a public bind.
status_url = "https://game.elopros.com/gates/status.json"

# max_players is deliberately absent: it defaults to the sim's own
# MAX_PLAYERS, read out of crates/sim-core/src/limits.rs by the generator so
# a published cap cannot disagree with the cap the shard enforces at the door.
#
# players / ping_ms are absent and must stay absent. `players` is what
# status_url lights, live; writing one here freezes it at whatever it was
# when this file was last edited. `ping_ms` is a measurement only the reader
# can make.
