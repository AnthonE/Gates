name: nightly

# The builder, not the gate. Every night: run the gates against main, build the
# release server, and package the desktop client as a scry depot. (The test
# gate, ci/gates.sh, is the one that is never allowed to skip-pass.)
#
# ⚠ The header used to say this built "the wasm client". It never did, and the
# crate it named is gone (operator, 2026-08-08: "we use desktop build no more
# web"). What it actually produced was one file — `target/release/shard` — so
# every depot Gates has ever had was hand-built on one box, which is the
# "random code in a random place" failure `ci/publish.sh` exists to end,
# wearing a build artifact. The `depot` job below is the fix.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: toolchain
        run: |
          # `rust-toolchain.toml` pins the version, the profile, the two
          # components and the wasm target, so rustup installs exactly that on
          # first use and this step only has to exist to make it happen early
          # (and to fail here rather than mid-gate). Installing `stable` by
          # name is what this repo did until 2026-08-11, and it is what let CI
          # and the developer's box drift three releases apart while the gates
          # read green locally.
          rustup show active-toolchain || rustup toolchain install
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      # `ci/gates.sh`'s native-client gate builds `--features render`, and each
      # of these fails identically without its package: a `pkg-config exited
      # with status code 1` panic from a *-sys build script, with the crate
      # named only in the backtrace. Absent here until 2026-08-11, which is the
      # failure this gate would have hit next once the clippy break above it
      # was fixed.
      - name: the three -dev packages --features render needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev
      - name: gates first
        run: ./ci/gates.sh
      - name: build server (release)
        run: cargo build --release -p server
      - name: upload the server
        uses: actions/upload-artifact@v4
        with:
          name: gates-nightly-${{ github.run_id }}
          retention-days: 14
          path: |
            target/release/shard
          if-no-files-found: error

  # The desktop build, packaged the way a player receives it. Separate from the
  # job above because its dependencies and its runtime are both different: it
  # needs three -dev packages a headless image has no reason to carry, and the
  # release client is an ~8 minute compile.
  #
  # What this does NOT do is publish. A build goes live when the origin's
  # `published.json` names it, and that file is written by a person who has
  # looked at what they are about to serve (scry `CLAUDE.md`; `docs/LAUNCHER.md`
  # §8 row 1b). This produces the tree that act would rsync, and stops.
  #
  # **Both platforms, since 2026-08-16.** This job packaged linux only, so
  # every Windows depot Gates ever published was hand-cut on one box — the
  # "random code in a random place" failure this job's own header says it
  # exists to end, still true for half the platforms. It is what let
  # `0.2.0-gbed9e02d6` ship without the mingw C++ runtime beside it
  # (`NOW.md` §0win): a build nobody could start, from a step nobody could
  # re-run. A Windows depot cut here is cut the same way every night, by a
  # recipe that is read rather than remembered.
  depot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One platform failing must not delete the other. A linux-only night is
      # a thing an operator can look at and decide about; a cancelled matrix
      # is not. Same argument `release.yml` makes, and it learned it the
      # harder way.
      fail-fast: false
      matrix:
        platform: [linux-x86_64, win-x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # `ci/depot.py` keys the build id on the commit — a shallow clone
          # still has HEAD, but `git describe`-shaped reads want the history.
          fetch-depth: 0
      - name: toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed on the platform too: the two legs write different target
          # subdirectories and share a registry, and a cache restored from the
          # other leg is how a cross build picks up host artifacts.
          key: depot-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      # Each of these fails identically without its package — a `pkg-config
      # exited with status code 1` panic from a *-sys build script, 40 lines
      # into a build, with the crate named only in the backtrace. `libwayland`
      # and `libudev` are capabilities a shipped desktop client genuinely
      # wants; `libasound` is one bevy_audio asks for and this client does not
      # use, and trimming that is `NOW.md` §0x, not this file's business.
      - name: the three -dev packages --features render needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev
      # **The mingw half, and the threading model is not optional.** Ubuntu's
      # default alternative is `13-win32`, whose `libgcc.a(gthr-win32.o)` has
      # no `__mingwthr_key_dtor`, and the client fails at link with every gate
      # green. Pointing only the linker at `-posix` moves the error rather than
      # fixing it — the C++ deps (`basis-universal-sys`, via `cc` calling
      # `x86_64-w64-mingw32-g++`) are still compiled win32 and die on
      # `__gthr_win32_mutex_*`. Both halves must agree, which is why gcc AND
      # g++ are set here (`CLAUDE.md`, the trap this pays).
      #
      # `binutils-mingw-w64-x86-64` is the load-bearing third: it carries the
      # cross `strip` AND the cross-capable `objdump` that `ci/depot.py` reads
      # the PE import table with. Without it the packager refuses rather than
      # staging a Windows build whose runtime was never measured — which is
      # correct, and is a red night rather than a broken depot.
      - name: mingw, with POSIX threading on both halves
        if: matrix.platform == 'win-x86_64'
        run: |
          set -euo pipefail
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
                                  binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc \
                                        /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
                                        /usr/bin/x86_64-w64-mingw32-g++-posix
          rustup target add x86_64-pc-windows-gnu
          # Stated rather than assumed: a win32 answer here is the link failure
          # above, arriving twenty minutes later and reading as an LLVM crash.
          x86_64-w64-mingw32-gcc -v 2>&1 | grep -q 'Thread model: posix' \
            || { echo "::error::mingw is not on POSIX threading"; exit 1; }
      # ci/depot.py builds, stages, strips and writes the index itself. It
      # deliberately computes no digest — `scry digest` is the one
      # implementation of the number that gets notarized, and a second one
      # here would be scry's invariant 3 with money attached.
      - name: package the depot
        run: ./ci/depot.py --platform ${{ matrix.platform }} --out target/depot
      - name: what was packaged
        run: |
          set -euo pipefail
          index=$(find target/depot -name depot.json -print -quit)
          test -n "$index" || { echo "::error::no depot.json was written"; exit 1; }
          python3 - "$index" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          n = len(doc["files"])
          total = sum(f["bytes"] for f in doc["files"])
          req = doc.get("requires", {})
          print(f"build {doc['build']} ({doc['platform']}) — {n} file(s), {total:,} bytes")
          print(f"launch: {doc['launch']['exec']} {' '.join(doc['launch']['args'])}")
          print("needs: " + ", ".join(req.get("libs", [])))
          print("ships: " + (", ".join(req.get("bundled", [])) or "nothing"))
          # A depot with no files, or one that names no start command, would
          # install cleanly and do nothing — refuse it here rather than on a
          # player's disk.
          assert n > 0, "a depot with no files is not a build"
          assert doc["launch"]["exec"], "a depot with no launch.exec cannot start"

          # **The assertion `0.2.0-gbed9e02d6` needed and did not have.** That
          # depot's own requires.libs named libstdc++-6.dll and its tree held
          # three files, and every check passed because every check was about
          # the document. These two are about the SET: nothing the player is
          # told to provide may be a thing the platform does not have, and the
          # runtime we promised to ship has to actually be in the file list.
          if doc["platform"].startswith("win-"):
              staged = {f["path"].lower() for f in doc["files"]}
              bundled = req.get("bundled", [])
              assert bundled, "a windows depot with no bundled runtime cannot start"
              for dll in bundled:
                  assert dll.lower() in staged, f"{dll} is promised but not staged"
              # A name mingw owns must never be left to the player. Anything
              # matching this shape is ours, and its presence in `libs` means
              # the sort in ci/depot.py stopped working.
              stray = [x for x in req.get("libs", [])
                       if x.lower().startswith(("libstdc++", "libgcc", "libwinpthread"))]
              assert not stray, f"mingw runtime left to the player's machine: {stray}"
              assert "LICENSE-MINGW-RUNTIME.txt" in {f["path"] for f in doc["files"]}, \
                  "the runtime ships without the notice that must travel with it"
              print(f"windows runtime OK — {len(bundled)} DLL(s) staged and credited")
          PY
          echo "$index" >> "$GITHUB_STEP_SUMMARY"
      - name: upload the depot
        uses: actions/upload-artifact@v4
        with:
          name: gates-depot-${{ matrix.platform }}-${{ github.run_id }}
          retention-days: 14
          # The staged tree AS IT WOULD BE SERVED — depot.json beside the files
          # it names, at the paths it names them at. An operator publishes by
          # rsyncing this into the origin's depot root and writing
          # published.json; nothing is repacked in between, because the digest
          # is taken over the document exactly as written.
          path: target/depot
          if-no-files-found: error

  # **Does the release still compile on the platforms we ship to?**
  #
  # Added 2026-08-11, the day the three-platform release workflow was written,
  # because the first thing that workflow would have hit is that `bin/shard.rs`
  # imported `tokio::signal::unix` unconditionally and **the Windows build of
  # the shard could not compile at all**. That was found by typechecking rather
  # than by review, and the lesson is the cheap one: a platform nobody compiles
  # for is a platform that does not build.
  #
  # Here rather than in `ci/gates.sh` on purpose. This is the BUILDER, not the
  # gate (this file's own header), and the cost is the argument: a
  # Bevy-for-Windows check is minutes, every local `./ci/gates.sh` run would
  # pay it, and the failure it catches cannot reach a player without passing
  # through either this job or the release workflow's own build first.
  #
  # `check`, not `build`: this is about cfg blocks and APIs that do not exist
  # on the target, which is the class of bug that actually shows up here.
  # Linking is the release workflow's business and it does that for real.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The gnu triple, not msvc: it typechecks from Linux with no Windows
        # host, and `cfg(windows)` is identical for both, so it catches the
        # cfg-and-API class in full. What it does NOT catch is msvc linking and
        # ABI — the release workflow builds that on a real Windows runner, and
        # this job is the early warning rather than the proof.
        target: [x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: mingw (the gnu triple wants a linker even to check some crates)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: the three -dev packages the host build script side still wants
        run: sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      # Exactly what the release workflow builds, and nothing else — the point
      # is the shipped artifacts, not the whole workspace.
      - name: the shard
        run: cargo check -p server --bin shard --target ${{ matrix.target }}
      - name: the client
        run: cargo check -p client --features render --bin gates --target ${{ matrix.target }}
