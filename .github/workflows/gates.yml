name: gates

# The test gate. Red means do not merge; there is no override lane.
# Path-filtered so docs-only PRs don't trip a gate that has no work to do
# — the gate either runs for real or does not run at all (never a
# skip-pass; see ci/gates.sh header).
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "content/**"
      - "ci/**"
      - ".github/workflows/gates.yml"
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "content/**"
      - "ci/**"
      - ".github/workflows/gates.yml"
  workflow_dispatch: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    # 45, not 30. The first green run after the toolchain pin took **27.4
    # minutes** on a cold cache — 2.6 minutes under the old ceiling — and a
    # `Cargo.lock` change busts the cache on exactly the commits that are
    # least like the last one. A gate that trips on a slow runner reports a
    # hang, not a defect, and `CLAUDE.md`'s own rule is that widening a
    # timeout is not a fix; that rule is about *waiting on a clock inside a
    # test*, which this is not — this is a ceiling for a whole compile.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          # `rust-toolchain.toml` pins the version, the profile, the two
          # components and the wasm target, so rustup installs exactly that on
          # first use and this step only has to exist to make it happen early
          # (and to fail here rather than mid-gate). Installing `stable` by
          # name is what this repo did until 2026-08-11, and it is what let CI
          # and the developer's box drift three releases apart while the gates
          # read green locally.
          rustup show active-toolchain || rustup toolchain install
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      # `ci/gates.sh`'s native-client gate builds `--features render`, and each
      # of these fails identically without its package: a `pkg-config exited
      # with status code 1` panic from a *-sys build script, with the crate
      # named only in the backtrace. Absent here until 2026-08-11, which is the
      # failure this gate would have hit next once the clippy break above it
      # was fixed.
      - name: the three -dev packages --features render needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev
      # The asset triage and its repair step measure a texture, so their
      # self-tests need a decoder: `ci/measure_glb.py` and
      # `ci/flatten_charts.py` say SKIP and exit nonzero without one rather
      # than pass on the cases that did not run.
      - name: numpy and Pillow, for the asset triage self-tests
        run: pip3 install numpy pillow
      - name: the gates
        run: ./ci/gates.sh
