name: gates

# The test gate. Red means do not merge; there is no override lane.
# Path-filtered so docs-only PRs don't trip a gate that has no work to do
# — the gate either runs for real or does not run at all (never a
# skip-pass; see ci/gates.sh header).
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "content/**"
      - "ci/**"
      - ".github/workflows/gates.yml"
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "content/**"
      - "ci/**"
      - ".github/workflows/gates.yml"
  workflow_dispatch: {}

# A newer push to the same PR supersedes the run in flight. Main always runs
# to the end, so every merge is tested and its cache saved.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    # Run 35478523217 (2026-09-20) had a cold cache: 44 minutes reached
    # parity, then native + wasm took another 27.5 minutes. The 75-minute
    # job cap killed the final debug probe after native/wasm had matched.
    # Allow the whole compile and suite to finish, with room to save the
    # cache afterward. This is a job ceiling; test timeouts and assertions
    # remain in ci/gates.sh and its suites. Keep nightly/release in step.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          # `rust-toolchain.toml` pins the version, the profile, the two
          # components and the wasm target, so rustup installs exactly that on
          # first use and this step only has to exist to make it happen early
          # (and to fail here rather than mid-gate). Installing `stable` by
          # name is what this repo did until 2026-08-11, and it is what let CI
          # and the developer's box drift three releases apart while the gates
          # read green locally.
          rustup show active-toolchain || rustup toolchain install
      # Only main SAVES the cache. One is ~4.8 GB against the repo's 10 GB
      # limit, so when every PR run saved its own copy they evicted main's:
      # the 2026-09-22 main run started cold on a Cargo.lock unchanged since
      # 09-16 and took 90 minutes. A PR restores its base branch's cache.
      - name: cache cargo (restore)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-v2-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: gates-v2-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-
      # `ci/gates.sh`'s native-client gate builds `--features render`, and each
      # of these fails identically without its package: a `pkg-config exited
      # with status code 1` panic from a *-sys build script, with the crate
      # named only in the backtrace. Absent here until 2026-08-11, which is the
      # failure this gate would have hit next once the clippy break above it
      # was fixed.
      - name: the three -dev packages --features render needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev
      # The asset triage and its repair step measure a texture, so their
      # self-tests need a decoder: `ci/measure_glb.py` and
      # `ci/flatten_charts.py` say SKIP and exit nonzero without one rather
      # than pass on the cases that did not run.
      - name: numpy and Pillow, for the asset triage self-tests
        run: pip3 install numpy pillow
      - name: the gates
        env:
          # PRs skip the wasm parity probe and the web-profile build (MVP mode);
          # main and manual runs, like nightly and release, run everything.
          GATES_TIER: ${{ github.event_name == 'pull_request' && 'fast' || 'all' }}
        run: ./ci/gates.sh
      - name: cache cargo (save, main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The key the restore step computed, before target/ existed to hash through.
          key: ${{ steps.cache.outputs.cache-primary-key }}
