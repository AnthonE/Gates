name: gates

# The test gate. A blocking red means do not ship; an advisory red (tooling and
# test harnesses, `advise` in ci/gates.sh) is a warning and the run stays green.
#
# It runs on each merge to main, in the background: no PR waits on it and it is
# not a required check, but a break shows up the hour it lands rather than at
# ship time (operator, 2026-10-30). A newer merge cancels an older run, so a
# burst of merges is one run. ci/release.sh takes a green run of HEAD's tree
# and dispatches one only when there is none. Anyone can start one by hand:
# `gh workflow run gates --ref <branch>` (add `-f tier=all` for the wasm parity
# probe and the web builds too).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: "fast (what a release needs) or all (adds wasm parity and the web builds)"
        default: fast
        type: choice
        options: [fast, all]

# A second dispatch of the same ref waits for the first rather than racing it;
# a push cancels the older push run (main moved, so that tree will not ship).
concurrency:
  group: gates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Read-only token: nothing here writes, and a compromised step gets no more.
permissions:
  contents: read

jobs:
  # The gates in three parts side by side (`GATES_PART`, ci/gates.sh): one
  # job ran them in a line for 60 minutes (run 39892561035), 29 of them the
  # native suite and 21 the renderer tier. Each part restores and, on main,
  # saves its own cache, since each compiles a different target/.
  part:
    name: gates · ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [base, render, wasm]
    env:
      CARGO_INCREMENTAL: 0
    # Run 35478523217 (2026-09-20) had a cold cache: 44 minutes reached
    # parity, then native + wasm took another 27.5 minutes. The 75-minute
    # job cap killed the final debug probe after native/wasm had matched.
    # Allow the whole compile and suite to finish, with room to save the
    # cache afterward. This is a job ceiling; test timeouts and assertions
    # remain in ci/gates.sh and its suites. Keep nightly/release in step.
    # 120 → 180 (2026-09-25): main's full runs had grown to 95–115 minutes
    # and nightly run 36139601292 was cancelled at 120 mid-suite.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: toolchain
        run: |
          # `rust-toolchain.toml` pins the version, the profile, the two
          # components and the wasm target, so rustup installs exactly that on
          # first use and this step only has to exist to make it happen early
          # (and to fail here rather than mid-gate). Installing `stable` by
          # name is what this repo did until 2026-08-11, and it is what let CI
          # and the developer's box drift three releases apart while the gates
          # read green locally.
          rustup show active-toolchain || rustup toolchain install
      # Only main SAVES the cache. One whole-suite cache was ~4.8 GB against
      # the repo's 10 GB limit, so when every PR run saved its own copy they
      # evicted main's: the 2026-09-22 main run started cold on a Cargo.lock
      # unchanged since 09-16 and took 90 minutes. A PR restores its base
      # branch's cache. The last restore key is the single job's cache from
      # before the split, so the first split runs start warm.
      - name: cache cargo (restore)
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-v3-${{ matrix.part }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            gates-v3-${{ matrix.part }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-
            gates-v2-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-
      # `ci/gates.sh`'s native-client gate builds `--features render`, and each
      # of these fails identically without its package: a `pkg-config exited
      # with status code 1` panic from a *-sys build script, with the crate
      # named only in the backtrace. Absent here until 2026-08-11, which is the
      # failure this gate would have hit next once the clippy break above it
      # was fixed. The browser builds want them too (`render` on wasm32
      # resolves the same crates' build scripts).
      - name: the three -dev packages --features render needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev
      # The asset triage and its repair step measure a texture, so their
      # self-tests need a decoder: `ci/measure_glb.py` and
      # `ci/flatten_charts.py` say SKIP and exit nonzero without one rather
      # than pass on the cases that did not run.
      - name: numpy and Pillow, for the asset triage self-tests
        if: matrix.part == 'base'
        run: pip3 install numpy pillow
      - name: the gates
        env:
          GATES_TIER: ${{ inputs.tier || 'fast' }}
          GATES_PART: ${{ matrix.part }}
        run: ./ci/gates.sh
      - name: cache cargo (save, main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The key the restore step computed, before target/ existed to hash through.
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Green only when every part is: a skipped or failed part is red here,
  # never the "skipped" a required check would read as passing. It names the
  # tree it passed (`gates-tree-<git tree hash>`), so ci/release.sh can take a
  # branch's green run for main's commit when the two trees are the same
  # tree, rather than waiting on main's own run of the identical files.
  gates:
    needs: part
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: every part green
        run: |
          [ "${{ needs.part.result }}" = success ] \
            || { echo "a part of the gates is ${{ needs.part.result }}"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the tree it tested
        id: tree
        run: |
          t=$(git rev-parse 'HEAD^{tree}')
          echo "$t" > tree.txt
          echo "tree=$t" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gates-tree-${{ steps.tree.outputs.tree }}
          path: tree.txt
          retention-days: 30
