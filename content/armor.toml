# Gates · content/armor.toml — worn protection (CONTENT.md §1).
#
# **Read since 2026-08-19** (armor reduction v0): `bake_combat` installs
# these rows into `CombatContent::armor` keyed by item index, and
# `combat::hurt` subtracts them from every hit that is a hit. Until that
# day this file was priced, validated, hashed and balance-anchored with
# nothing in the sim reading a row of it.
#
# ⚠ **`slot` does not yet select which hits a piece answers.** Aim is
# planar and there are no hit areas (`combat.rs`), so the worn SET is one
# number and both slots sum — a headwrap pays against a body blow. What
# `slot` does do is index `Player::worn`, so a piece pays in one slot only
# and two body plates cannot stack. Hit areas are a later slice; when they
# land, this line is the one that changes.
#
# ⚠ **The band below is known-misleading and it is not a lie this file
# can fix.** `balance.toml`'s `armor_extra_hits_max` asserts any SINGLE
# piece adds at most +2 hits-to-kill against every banded weapon (CONTENT
# §4 anchor 2) — but the anchor loops every row against a *body* TTK, so
# it credits a head piece against body hits, it has no floor, and it
# cannot see a set: head 10 % + roadsign 25 % is **+3** on four weapons.
# Re-speaking the band is an operator act (`DECISIONS.md` §open, "armor
# reduction v0").
#
# **These three numbers are OURS, and as of 2026-08-18 that is a written
# block rather than an unexamined gap** (`reference/RIPLIST.md` §1h).
# Theirs were read at page tier the same day —
# `wiki.facepunch.com/rust/item/{burlap.headwrap,burlap.shirt,
# roadsign.jacket}`, each carrying a **Protection** table — and they are
# takeable whole:
#
# | | theirs, projectile = melee | ours |
# |---|---|---|
# | burlap headwrap | 15 % | 10 % |
# | burlap shirt | 10 % | 15 % |
# | road sign jacket | 20 % | 25 % |
# | road sign `move_penalty_pct` | none | 5 % |
#
# **The reason this file had for differing does not survive reading the
# pages.** `BALANCE.md` §4.1 filed the armour ladder under *real* reasons
# — "their protection is per damage type; ours is a flat percentage;
# copying their percentages onto our model would mislead". True of their
# model in the abstract and **false for every piece we own**: their
# Projectile and Melee cells are EQUAL on all three, and those are the
# only two damage classes our combat has, so one scalar expresses theirs
# exactly. The columns we cannot key against — Bite, Radiation, Cold —
# are mechanics we do not ship. §4.1 is retracted.
#
# **Our ladder is also inverted**, which is the part a player feels: ours
# has the headwrap weaker than the shirt where theirs has it stronger.
# Taking the column fixes an ordering, not only three magnitudes.
#
# ⚠ **Why the numbers are still ours: `crates/content/tests/content.rs`
# anchors a fixture on `reduction_pct = 25`.** The take was applied,
# validated, and passed every band (`armor_extra_hits_max` holds with no
# re-speak — the set gets weaker, not stronger); `band_breaks_refused`
# then failed as *"test fixture rot"*, because its armour case mutates the
# roadsign's 25 into 60 to prove the band bites. The whole fix is
# re-anchoring that one string on the new value — 20 is unique to the
# roadsign row under the take, where 25 is today — and `RIPLIST.md` §5
# step 4 says the fixture belongs in the same commit as the numbers. The
# content lane that found this may not edit `crates/`, so it is filed
# rather than done.
#
# ⚠ **And this file is scheduled to change shape anyway** (`DECISIONS.md`
# 2026-08-17, spoken): equipment v0 replaces `reduction_pct` with a
# per-type vector. §1h carries all five of their columns off the same
# pages, so that slice can take the whole table and re-anchor the fixture
# in one move — which is probably the right place for this to land.

[[armor]]
id = "item.armor_burlap_head"
slot = "head"
reduction_pct = 10
move_penalty_pct = 0

[[armor]]
id = "item.armor_burlap_body"
slot = "body"
reduction_pct = 15
move_penalty_pct = 0

[[armor]]
id = "item.armor_roadsign_body"
slot = "body"
reduction_pct = 25
move_penalty_pct = 5
