# Gates · content/skins.toml — the skin catalog (CONTENT.md §1): Rust's
# item definitions for skins. The schema can never carry a stat field;
# that absence is the never-table (DESIGN.md §3.3) enforced at the schema
# layer.
#
#   id       content id, `skin.` prefix
#   catalog  the id an item wearing this skin carries (ItemStack::skin) and
#            the catalogId the platform's item contract mints it under.
#            Nonzero, unique, never reused for a different look.
#   name     what the store and the item's label say (≤ 24 ASCII bytes)
#   covers   the one item it fits (a stack-1 item; a deployable keeps its
#            skin when placed and when picked back up)
#   tint     the look, v0: an sRGB multiply over the item's own colours. A
#            skin with a model of its own (`client::ui::hold::SKIN_MODELS`)
#            draws that, and a picture of it in the store; its tint is the
#            fallback while the model loads
#   coin     JUNK, ELO or ORBS \  optional, together: a row without them
#   price    bare amount       /  ships its look and is not on sale until
#                                priced — prices are the operator's
#                                (BUSINESS.md). Skins are bought with JUNK,
#                                the play coin (2026-10-18); ORBS is the
#                                governance coin now.
#   season   which drop it belongs to
#   unlock   true for an unlock rather than a look (Rust's Frog Boots): owning
#            the row is what lets a player craft `covers`, and nobody else
#            can. Never worn, so it may cover a deployable; no texture.
#
# Ownership is read off the platform (server/src/skins.rs); a shard with
# `skins_all = true` in shard.toml lends every row to every player so the
# looks can be seen before anything is sold. On a shard with `skins_origin`
# set, the platform's store prices replace the coin/price here (read at boot
# and every five minutes); these apply only on a shard without one.
#
# Rows stay out of the content hash (`canon.rs`): a stack carries its skin's
# catalog id, so adding, retinting or renaming a look is never a wipe.

