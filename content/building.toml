# Gates · content/building.toml — the build grid pieces (CONTENT.md §1,
# DESIGN.md §2). One row per shape × material; `cost` is both the direct
# build cost and the upgrade-into cost (wood→stone→metal). Doors are
# deployables (deployables.toml) that mount in a doorway — validation
# asserts a door is always weaker than its material's wall, so the door
# stays the intended breach point.
#
# **Every number below is the reference game's, taken whole 2026-08-10**
# (`reference/BUILDING.md` §7b, `reference/BALANCE.md` §6.1: no case is
# needed to take one). Their grade base — the full wall — is twig 50 /
# wood 200 / stone 300 / metal 200, and their four shape ratios run off it:
#
#   1.0  foundation · wall · stairs      0.7  doorway · window
#   0.5  floor · roof · wall_frame
#
# So these 32 cells ARE their 32 cells for the eight shapes we have.
# Window and wall_frame joined 2026-08-15 (catalogue v1, §9.13): their
# ratios were already decided by §7b.3 — an opening is 0.7, a mostly-hole
# frame is 0.5 — so the window's column is the doorway's and the frame's
# is the floor's, digit for digit.
#
# hp is a property of the MATERIAL alone and never of the shape, which is
# what those ratios are for. A stone floor and a stone wall are both 500,
# so a floor buys twice the hp per stone that a wall does and a player who
# stacks the cheap shapes is rewarded for it — that spread is the whole
# reason to have more than one shape, and pricing every shape alike (which
# is what this file did until 2026-08-10) deletes it.
#
# ⚠ **This column was never taken before, and nothing said so.** The
# 2026-08-08 balance pass took the hp ladder and the satchel out of this
# very file and left `cost` untouched; `reference/RIPLIST.md` never opened
# a row for it. So the costs stood as first written in the M1 build slice,
# derived from our own `farm_per_min` and compared against nothing. What
# made that visible was the node take of 2026-08-10: once a tree paid
# THEIR 810 wood, a wall priced at ours cost **1.75× theirs in trees** —
# the numerator theirs, the denominator ours, which is exactly the
# false-familiarity trap `BALANCE.md` §4.1 names, one level out.

# --- twig · the placement grade ------------------------------------------
#
# Everything enters the world here and only here (sim-core `build::place`
# refuses any other rung); the hammer commits it upward and the grade is
# paid ON TOP of what twig already cost. `reference/BUILDING.md` §7b.4.
#
# hp 10 and the 50 / 35 / 25 costs are theirs outright. **They landed as
# 88 / 62 / 44 for one commit** — their ratio against our own wood grade,
# on the argument that our cost column was farm-minute anchored and theirs
# was not, so their absolute would be a number in their currency. That
# argument was answered by looking at where our column came from: it was
# never derived from anything a player can feel, and the anchor it was
# priced against is the one `RIPLIST.md` §1a calls a declared number the
# game's own yields cannot contradict. There is no second currency here to
# convert between — only an anchor that had never been checked.

[[piece]]
id = "build.foundation_twig"
shape = "foundation"
material = "twig"
hp = 10
cost = [{ item = "item.wood", count = 50 }]

[[piece]]
id = "build.wall_twig"
shape = "wall"
material = "twig"
hp = 10
cost = [{ item = "item.wood", count = 50 }]

