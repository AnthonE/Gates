# Gates · content/building.toml — the build grid pieces (CONTENT.md §1,
# DESIGN.md §2). One row per shape × material; `cost` is both the direct
# build cost and the upgrade-into cost (wood→stone→metal). Doors are
# deployables (deployables.toml) that mount in a doorway — validation
# asserts a door is always weaker than its material's wall, so the door
# stays the intended breach point.
#
# The price of a shape is a RATIO of its material's wall, and the ratios
# are the reference game's (`reference/BUILDING.md` §7b.3, taken whole
# 2026-08-10 under `reference/BALANCE.md` §6):
#
#   1.0  foundation · wall · stairs      0.7  doorway
#   0.5  floor · roof
#
# hp is a property of the MATERIAL alone and never of the shape, which is
# what those ratios are for. A stone floor and a stone wall are both 500,
# so a floor buys twice the hp per stone that a wall does and a player who
# stacks the cheap shapes is rewarded for it — that spread is the whole
# reason to have more than one shape, and pricing every shape alike (which
# is what this file did until 2026-08-10) deletes it.

# --- foundation ---------------------------------------------------------

[[piece]]
id = "build.foundation_wood"
shape = "foundation"
material = "wood"
hp = 250
cost = [{ item = "item.wood", count = 350 }]

[[piece]]
id = "build.foundation_stone"
shape = "foundation"
material = "stone"
hp = 500
cost = [{ item = "item.stone", count = 350 }]

[[piece]]
id = "build.foundation_metal"
shape = "foundation"
material = "metal"
hp = 1000
cost = [{ item = "item.metal_frags", count = 200 }]

