# Gates · content/building.toml — the build grid pieces (CONTENT.md §1,
# DESIGN.md §2). One row per shape × material; `cost` is both the direct
# build cost and the upgrade-into cost (wood→stone→metal). Doors are
# deployables (deployables.toml) that mount in a doorway — validation
# asserts a door is always weaker than its material's wall, so the door
# stays the intended breach point.

# --- foundation ---------------------------------------------------------

[[piece]]
id = "build.foundation_wood"
shape = "foundation"
material = "wood"
hp = 750
cost = [{ item = "item.wood", count = 350 }]

[[piece]]
id = "build.foundation_stone"
shape = "foundation"
material = "stone"
hp = 1750
cost = [{ item = "item.stone", count = 350 }]

[[piece]]
id = "build.foundation_metal"
shape = "foundation"
material = "metal"
hp = 3000
cost = [{ item = "item.metal_frags", count = 200 }]

