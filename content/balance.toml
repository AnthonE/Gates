# Gates · content/balance.toml — the declared bands and globals the
# balance anchors compute against (CONTENT.md §4). These ARE the band
# knobs: DECISIONS.md §open "balance bands" points here; moving one is a
# re-speak, not a drift. `test_content` computes every anchor from the
# data files and asserts it inside these ranges — and the shard refuses
# to boot on content that breaks a band.

# Archetypes the node band applies to (bush is an instant pickup).
banded_nodes = ["tree", "stone_node", "metal_node", "sulfur_node"]

[globals]
# Hits-to-kill divides this by weapon damage (CONTENT §4 anchor 2).
player_hp = 100
# Effective gather rate at tier-1 tools, units/min, travel included —
# the farm-minute currency every cost anchor is priced in (anchor 3).
# Craft seconds are ignored: farm time dominates at these scales.
# Gated (balance.rs): a row may never exceed the sim's at-node ceiling
# (best tier-≤1 yield/hit, weak mark included, at the swing cadence), and
# every row must be a node output some tier-≤1 swing pays. The gap to
# at-node is the travel term — measured by `crates/server/tests/
# farmwalk.rs`, its meaning still the operator's knob (DECISIONS.md
# §open, "the economy has never been measured").
farm_per_min = { "item.wood" = 50, "item.stone" = 50, "item.metal_ore" = 30, "item.sulfur_ore" = 30, "item.cloth" = 20 }
# Barrel-only drops (components, fat) priced as road-minutes per unit.
component_minutes = { "item.gears" = 4, "item.rope" = 4, "item.tarp" = 4, "item.fat" = 2 }
# Upkeep drains this % of build cost per day (DESIGN §2; anchor 3 holds
# a solo's daily upkeep under upkeep_solo_daily_max_min).
upkeep_pct_per_day = 10
# Repairing a damaged piece back to full costs this % of the pro-rata
# share of its own build cost — 100 = you pay exactly the materials the
# damage destroyed, so a repair is never cheaper than the hp it buys and
# a defender cannot out-heal a raid on economics alone. Rust's hammer is
# cheaper than this; 100 is the conservative end, and only the operator
# loosens it. Proposed default, DECISIONS.md §open ("repair v0").
repair_cost_pct = 100
# Unpaid decay per upkeep period (1 h), as a % of the piece's max hp, by
# the piece's own material. The reference's ladder, converted: it takes a
# full-health block ~1 h of twig / ~3 h of wood / ~5 h of stone / ~8 h of
# metal to rot away once its upkeep runs out, so the tougher the grade the
# SLOWER it goes and an upgrade buys time as well as hp. 100 / hours,
# rounded up — which puts twig at exactly 100, one period and gone.
#
# Twig's rate is only half of what makes it a draft; the other half is in
# sim-core `deploy::upkeep_sweep`, where twig is never charged upkeep and
# therefore never protected by a hearth however well stocked. A scaffold
# pays no rent and gets no shelter.
#
# It replaces one flat 5 % for everything, which made a metal base rot at
# a wooden one's rate and took twenty hours to do it. Proposed default,
# DECISIONS.md §open ("upkeep/decay v1").
decay_pct_per_period = { twig = 100, wood = 34, stone = 20, metal = 13 }
# The rent's size ladder (upkeep v2), [after, permille per day]: past 15
# graded pieces in one base each further piece's day costs 15 %, past 65
# 20 %, past 190 33.3 %, with upkeep_pct_per_day above as the first rung.
# Theirs, taken whole: the four `decay.bracket_*` convars, 15 / 50 / 125
# blocks at 0.1 / 0.15 / 0.2 / 0.333 a day. Their counts are read as bracket
# SIZES — 15, the next 50, the next 125 — because the 2026 convar text and
# the only worked example say so; the 2018 text read them as thresholds
# (15 / 50 / 125), and that reading is the loser BALANCE.md §6.3 keeps in
# reference/BUILDING.md §4b. The blend is theirs too: a base pays the
# average of its rungs on every piece, (15 × 10 % + 5 × 15 %) / 20 = 11.25 %
# at twenty. Twig is not counted, for the reason it pays no rent.
# Proposed default, DECISIONS.md §open ("upkeep v2").
upkeep_steps = [[15, 150], [65, 200], [190, 333]]
# An unpaid piece with anything of its base built over it rots at this % of
# its ladder rate, so a lapsed base comes down from the roof inward. Theirs,
# whole — "Building blocks that are inside now decay at 10% of their normal
# decay rate" (`decay.upkeep_inside_decay_scale` 0.1, Facepunch commit
# 212834). Proposed default, DECISIONS.md §open ("upkeep v2").
inside_decay_pct = 10
# Hours a destroyed hearth's stock still buys the building it stood in —
# Devblog 198, "up to 24 hours of decay protection on all building blocks
# that are currently connected to the building" (`decay.upkeep_grief_
# protection`, 1440 minutes). Per material, since our upkeep is.
# Proposed default, DECISIONS.md §open ("upkeep v2").
grief_protection_h = 24
# Chance an arrow is destroyed where it lands instead of becoming an item
# on the ground again (arrow recovery v0). Theirs, taken whole under
# BALANCE.md §6: reference/PROJECTILES.md §5 reads "~15 % chance to break
# on impact and be destroyed", and §5 is the reason the bow's damage row
# is on hold — their ~35 is priced against ammunition that comes back and
# ours was priced against ammunition that never did. The odds are what
# turn a spent arrow from a cost into a tax; nothing else in the loop
# does. Tier 3 in their doc, so approximate by their own warning.
arrow_break_pct = 15
# Seconds an arrow that DEALT DAMAGE lies in its target before it may be
# taken back; one that missed may be taken the moment it lands. Theirs
# too (§5, "retrieved after 10 seconds"), and the rule reads arbitrary
# and is not: it stops an archer re-collecting the arrow they just shot
# someone with *during* the fight, so a bow still runs dry in a sustained
# engagement while losing almost nothing to a day of hunting.
arrow_lodge_s = 10

[bands]
# Anchor 2 — TTK in body hits, no armor; per weapon kind.
ttk_melee = [3, 5]
ttk_bow = [3, 4]
ttk_firearm = [4, 6]
# "headshot × 2" (CONTENT §4) — every banded weapon carries exactly this,
# so a data edit can't quietly make headshots one-tap past the TTK band.
headshot_mult = 2
# And "limb ×0.5" (`reference/PROJECTILES.md` §0), as a percent so this file
# stays integer-only. Exact for `headshot_mult`'s reason at the other end of
# the ladder: the TTK band above is measured on **body** hits, so it says
# nothing about a leg, and a data edit could otherwise take a limb to 100
# (aim stops mattering downward) or to 1 (a leg hit is a wasted round) with
# every band still green. The throwable row is skipped — a blast has no
# anatomy — which is why the satchel carries the identity at both ends.
limb_pct = 50
# Any single armor piece may add at most this many hits vs any banded weapon.
armor_extra_hits_max = 2
# Anchor 3 — a banded node's total yield and hit count at tier-1 tools.
#
# The ceiling moved 400 → 1000 on 2026-08-10, and it is the band that had
# to move for the reference's node totals to land (`reference/RIPLIST.md`
# §2 row 1; operator, 2026-08-10). It is not a loosening for its own sake:
# 1000 is exactly their stone node, the largest of the four, and 250 keeps
# the floor it has always had because nothing in the take argues about the
# floor. The band now brackets their own spread — sulfur 300 to stone 1000
# — which is the citation, so a value outside it is a value outside
# theirs.
#
# **`node_hits` did NOT move, and that is the deliberate half.** Their hit
# counts run 15–28 and would break [8, 12] — but they are unobtainable
# rather than merely unfound (§4.1a: the marker made hits-to-clear a
# function of aim, so no modern source publishes them). Our schema needs
# only the total, so the hit count stays ours and this band stays put.
node_yield = [250, 1000]
node_hits = [8, 12]
# A full wood wall in farm-minutes of wood at T1 tools (CONTENT §4 anchor 3).
#
# **Re-spoken 7 → 4 on 2026-08-10** (`DECISIONS.md` §open "twig v0"), and
# it is `reference/BALANCE.md` §7's rule working rather than a loosening:
# their wood wall is 200 wood, which prices at 4.0 here, and the question
# a band break asks is which of the two is out of date. This one was. The
# band was written around a cost column that had never been compared to
# anything — the 2026-08-08 balance pass took the hp ladder out of
# `building.toml` and left `cost` alone, and `RIPLIST.md` never opened a
# row for it — so [5, 9] was a fence around our own invented number.
#
# The node take of 2026-08-10 is what made it visible: once a tree paid
# **their** 810 wood, a wall priced at **ours** cost 1.75× theirs in
# trees, which is the unit a player actually feels. Taking the cost column
# makes both halves of "how many trees is a wall" come from one game.
#
# [3, 5] keeps the old band's shape — ±29% around the value, one unit
# either side after the anchor's rounding — so it still catches drift.
wood_wall_minutes = [3, 5]
# Anchor 1 — satchels-to-break-a-stone-wall in farm-minutes over the
# starter build in farm-minutes; below ~1.0 nobody builds, above ~3
# nobody raids. Percent (100 = 1.0×) so the file stays integer-only.
# Wood and metal ratios must rise strictly with tier.
raid_ratio_stone_pct = [100, 300]
# Anchor 1's melee face — the raid lane by hand. Swings, not minutes:
# swings are integer-exact out of the data (piece hp ÷ the best melee
# weapon's `structure`), where minutes would drag the sim's swing cadence
# into a content assert. The door is the intended breach point and must
# stay openable by hand; every wall, at every material, must cost at least
# the floor, so a spear never undercuts the satchel.
# Proposed defaults, DECISIONS.md §open ("piece damage v0").
door_breach_swings = [30, 80]
wall_breach_swings_min = 60
# Anchor 3 — a solo starter's daily upkeep ceiling, farm-minutes.
upkeep_solo_daily_max_min = 15

# Death drops your whole inventory where you fell (DESIGN §2) into one
# backpack, and that bag despawns on a timer: **one base constant × the
# rarity multiplier of the rarest thing inside** (NETCODE.md §6.4, which
# also fixes the shape — "5 min base → ~5/20/40/60 min tiers"). The
# multipliers below are exactly that ladder against the 5-minute base,
# and `items.toml` already declares the rarity column that drives it.
# Proposed defaults, DECISIONS.md §open "death backpack v0"; a rarer item
# may never despawn sooner, so the ladder must rise strictly.
[backpack]
despawn_base_min = 5
mult_common = 1
mult_uncommon = 4
mult_rare = 8
mult_very_rare = 12

# The survival clock (DESIGN §2: "hunger/thirst minimal — a slow health
# drain past a timer, food to reset it"). Two meters that only ever fall,
# and food that puts them back; a meter at zero costs hp per minute, and
# both empty stack. Minutes here, ticks in the sim — `bake_survival` does
# the conversion once so the sim never multiplies a clock.
#
# Proposed defaults, DECISIONS.md §open "survival clock v0". The shape,
# not the exact numbers, is what is being claimed: water is the shorter
# fuse and the harsher penalty (thirst kills faster than hunger in every
# game in this tradition and in life), and an untended fresh spawn has
# ~40 minutes before the first point of damage and dies around the
# 60-minute mark — long enough that gathering and building are still the
# session, short enough that standing still is never free.
#
# `drink_*` is the drink verb (wire v15, `survival::drink`) — thirst's real
# answer, and the reason a player spawned beside an ocean is no longer
# looking at scenery. **The sea is salt**: a mouthful restores
# `drink_water` and costs `drink_hp_cost`, so the ocean is the answer that
# is always there and never free.
#
# The pair is derived against the answers that already ship, not picked:
# a bush pays 5 berries at 5 water each = 25 water, which is 10 minutes of
# the 40-minute meter, plus 10 cloth. So one mouthful is set to **one
# bush's worth of thirst in one press, with no walk and no bush** — and
# costs 2 hp for it. Living entirely off the sea therefore runs 4 drinks
# an hour = 8 hp an hour against a 100 hp body, and the repair is on the
# same shelf: a bandage is 20 cloth = 2 bushes = 20 hp = ten mouthfuls.
# Ten bushes of drinking, or two bushes of bandaging: the sea is 5× the
# farm time cheaper and bleeds, which is the trade the genre makes.
[survival]
max_food = 500
max_water = 250
food_minutes_to_empty = 60
water_minutes_to_empty = 40
starve_hp_per_min = 3
dehydrate_hp_per_min = 5
drink_water = 25
drink_hp_cost = 2

# Wet and cold (weather v0, `sim_core::exposure`) — the reference's exposure:
# rain soaks you unless something is overhead (their `weather.wetness_rain`),
# the sea soaks you to the depth you stand in, and a fire dries you. The chill
# a body heads for is the night, the rain, the wind and how wet it is, less
# what it wears (wet clothes keep half) and less a fire or a torch. Per mille
# of a meter, per second; distances in cm.
#
# What these numbers do, measured against the formula rather than chosen:
# naked and dry on a clear night heads for 350 (no damage); clothed, soaked
# in daytime heavy rain, 575 (none); soaked at night in heavy rain, ~925 —
# about 5 hp a minute, a slow death with time to find a roof and a fire.
# A roof and a lit campfire take anyone back to zero.
[exposure]
wet_rain_per_s = 8
dry_per_s = 2
dry_fire_per_s = 12
soak_depth_cm = 120
night_cold = 350
rain_cold = 250
wind_cold = 150
wet_cold = 450
fire_warmth = 1000
torch_warmth = 150
heat_radius_cm = 450
chill_rise_per_s = 8
chill_fall_per_s = 20
hurt_at = 600
hurt_hp_per_min = 6

# The starter base the raid ratio prices (CONTENT §3: "2×1 stone, door,
# bag, hearth, box"): 2 foundations, 5 walls, 1 doorway, 2 roofs, plus
# the deployed kit.
[[starter_base.pieces]]
piece = "build.foundation_stone"
count = 2

[[starter_base.pieces]]
piece = "build.wall_stone"
count = 5

[[starter_base.pieces]]
piece = "build.doorway_stone"
count = 1

[[starter_base.pieces]]
piece = "build.roof_stone"
count = 2

[[starter_base.items]]
item = "item.door_wood"
count = 1

[[starter_base.items]]
item = "item.hearth"
count = 1

[[starter_base.items]]
item = "item.sleeping_bag"
count = 1

[[starter_base.items]]
item = "item.box_small"
count = 1

# What a fresh character spawns holding (`sim_core::inventory::SpawnKit`;
# DECISIONS.md 2026-08-15). **A rock and a torch** — the reference's own
# naked spawn, spoken after the operator played the shard: *"we should be
# starting with a rock and a torch"*, *"you cant smash trees with ur hans
# lol u need a rock"*.
#
# This is no longer scaffolding. It replaces nine entries — plan, hammer,
# stone hatchet, stone pickaxe, torch, 3 bandages, 900 wood, 500 stone,
# 100 metal frags, and no rock — whose own comment called itself *"testing
# scaffolding, and an operator call to empty"*. That kit existed because a
# naked spawn made the build wheel read `350 Wood (0)`, and it survived by
# being the only way anybody could reach the building verb. It is not the
# only way any more: `shard.toml`'s `dev_spawn_kit` re-grants a fat kit on
# a dev shard, and never on a public one (`crates/server/src/config.rs`).
#
# **The rock is the mechanism, which is what `BALANCE.md` §6 asks for.**
# Bare hands pay nothing on any swung node (gatherables.toml), so the rock
# is what makes the loop start. It costs 10 stone (recipes.toml) and
# carries no condition, so a player WITH stone can always re-make one.
#
# ⚠ **A player with no stone and no rock is stranded until they die**, and
# that is a property of the shipped tables rather than a guess: stone comes
# off `gather.stone_node`, whose only yield rows are the rock and the two
# pickaxes, and no loot table or mob drop pays `item.stone` or `item.rock`
# (`grep 'item.stone' content/loot.toml content/mobs.toml` — empty). So the
# re-grant below is not only a convenience, it is the ONLY route back. The
# reference has the same shape, which is why it hands you a rock on every
# spawn, so this is probably right — but it is a consequence nobody spoke,
# and the operator's options if it is not (a stone row on a barrel table, a
# rock that cannot be moved out of the belt) are content, not code.
#
# **Cheap enough to re-grant on every respawn**, which is the half that
# fixes death: `World::wake` grants this beside `survival::grant`, where
# the old kit could not go because 900 wood on every death is an item
# printer and 10 stone of tools is not. `NOW.md` §0die mechanism 3.
#
# The order is the order it lands in: rock on hotbar slot 1, torch on 2.
[[spawn_kit]]
item = "item.rock"
count = 1

[[spawn_kit]]
item = "item.torch"
count = 1
