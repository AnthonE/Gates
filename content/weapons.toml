# --- weapons proper ------------------------------------------------------

[[weapon]]
id = "item.spear_wood"
kind = "melee"
damage = 20
structure = 3
headshot_pct = 200
limb_pct = 50
rate_per_min = 48
range_m = 2

[[weapon]]
id = "item.spear_metal"
kind = "melee"
damage = 30
structure = 4
headshot_pct = 200
limb_pct = 50
rate_per_min = 48
range_m = 2

# **Neither bow carries a `range_m`**: an arrow flies until something stops
# it, so a bow's reach is its round's speed and drop (`[[ammo]]` below) — a
# level shot from a standing eye meets flat ground about 33 m out with a
# wooden arrow and 50 m with the crossbow's, as Rust's do.
#
# The bow's 50 is Rust's wooden arrow off a hunting bow (its live item
# data): two body hits on a naked body, a 75 to the head, which does not
# one-shot one. It was held at 35 until arrows came back — they do now, are
# seen where they fall and stand in what they hit.
[[weapon]]
id = "item.bow"
kind = "bow"
damage = 50
structure = 1
headshot_pct = 150
limb_pct = 50
# Rust's hunting bow looses every 1.25 s (its repeat delay; the nock is
# inside it), against the 2 s this was. 48 a minute is 37 ticks, 1.23 s.
rate_per_min = 48
ammo = ["item.arrow_wood"]
# The draw: hold the right mouse this long before a shot will loose
# (`reference/PROJECTILES.md` §6 — the hunting bow's ~1 s draw). The
# crossbow carries none: it is cocked, and fires from the hip.
draw_ms = 1000

# Rust's crossbow hits 1.2 times as hard as the bow with the same arrow:
# 60, 90 to the head.
[[weapon]]
id = "item.crossbow"
kind = "bow"
damage = 60
structure = 1
headshot_pct = 150
limb_pct = 50
# Rust's crossbow reloads in 3.6 s; 17 a minute is 105 ticks, 3.5 s.
rate_per_min = 17
ammo = ["item.arrow_metal"]

[[weapon]]
id = "item.revolver"
kind = "firearm"
damage = 20
structure = 1
headshot_pct = 200
limb_pct = 50
rate_per_min = 150
range_m = 50
ammo = ["item.pistol_ammo"]
# Eight rounds and 3.4 s, both the reference's own published figures for
# this weapon, taken rather than argued (`reference/BALANCE.md` §6: take
# theirs, a case is needed only to differ). The magazine is what gives a
# firefight a rhythm — without it `rate_per_min` alone makes a gun an
# unbroken stream of clicks and the body-part ladder above is only a
# slightly longer stream of them.
#
# Neither bow carries one, and that IS a difference from the reference,
# which models a bow as a one-round magazine reloaded between shots (a bow
# is a `BaseProjectile` like every gun — `reference/PROJECTILES.md` §1).
# The mechanism is the case: a one-round magazine reloaded after every shot
# is the nock, and the nock is already `rate_per_min` here, so carrying
# both would be two cadences to keep in step for one wait.
magazine = 8
reload_ms = 3400

[[weapon]]
id = "item.satchel_charge"
kind = "throwable"
damage = 475
structure = 125
headshot_pct = 100
limb_pct = 100
rate_per_min = 10
range_m = 10
# Seconds between planting the charge and the blast. The only field that
# is the throwable's alone: every other column above is shared with the
# melee rows, and a fuse has no meaning on a swing, so `validate` requires
# it here and refuses it everywhere else. It is what makes the raid a
# commitment rather than a click — you are standing at the wall you are
# breaking, and the defender gets the same seconds you do.
# Proposed default, DECISIONS.md §open ("satchel fuse v0").
fuse_s = 10
# Blast radius in metres — one build cell, so the hole a charge is INTENDED
# to clear is the cell it was planted on: the wall you stuck it to, the
# floor under that wall, and whatever shares the cell's corner.
#
# READ BY `charge::detonate` since satchel blast v0. This line said
# "NOTHING READS THIS YET" through the whole slice that made it load-
# bearing, which is the drift `CLAUDE.md` warns about: a comment claiming
# a column is inert reads as permission to change it freely.
#
# The curve it describes is the one that shipped: both damage columns fall
# linearly to zero at this distance, `structure` lands whole at the planted
# address because the distance there is zero, and `damage` is what the
# blast takes off a body standing in it. The scan is the 3×3 column ring
# around the epicentre, and `charge.rs`'s const block asserts this radius
# cannot outrun that ring — so widening `blast_m` past one build cell is a
# sim change, not a content change.
# Proposed default, DECISIONS.md §open ("satchel blast v0").
blast_m = 3

# --- the rounds ------------------------------------------------------------
#
# **Ballistics belong to the round, not to the bow that fires it**
# (`reference/PROJECTILES.md` §9.3; operator, 2026-08-10). These two blocks
# were `[weapon.ballistic]` on the bow and the crossbow until the schema
# moved.
#
# **The numbers are Rust's** (2026-10, read off the live item data): a
# wooden arrow leaves a hunting bow at 50 m/s and falls at 0.75 g, and a
# crossbow throws it half as fast again, 75 m/s. The shipped 40 m/s at a
# 20 m/s² drop was slower and fell 2.7 times as hard: a level shot hit the
# dirt 11–16 m out, and a target 20 m away was 2.5 m under the crosshair
# ("it only flies a few feet"). Their drag (0.005/s) is under 4 % over a
# whole flight and is not modelled.
#
# `drop_mps2` is whole metres per second squared and the sim's step is
# 0.9 m/s² at 30 Hz, so 7 bakes to the nearest, 7.2 — their 7.36 within
# 2 %.
#
# The reference game hangs these off `ItemModProjectile`, a mod on the ammo
# item, which is how one bow there fires wooden, bone, high-velocity and
# fire arrows that differ in speed, drop and impact. With the numbers on the
# weapon that is unreachable at any values: the bow decides how fast its
# arrow flies, so every arrow it fires flies the same.
#
# What this table does NOT yet carry is a damage column. Theirs scales the
# weapon's damage by the round's (a high-velocity arrow is −20 %), and that
# multiplier is a number nobody has spoken — `DECISIONS.md` §open, not this
# file. So damage stays on the weapon and every round out of one bow hits
# equally hard, which is the honest half-way house and is stated rather
# than hidden.
#
# `speed_mps` has a hard ceiling the bake enforces and it is not a taste
# call: an arrow faster than `ARROW_STEP_MM × MAX_ARROW_SUBSTEPS` per tick
# (2.72 m) passes through a wall between two collision samples. Content
# that fast is refused at boot rather than clamped.

[[ammo]]
id = "item.arrow_wood"
speed_mps = 50
drop_mps2 = 7

[[ammo]]
id = "item.arrow_metal"
speed_mps = 75
drop_mps2 = 7
