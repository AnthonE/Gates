# Gates · content/weapons.toml — combat rows (CONTENT.md §1). Damage is
# per body hit; TTK bands in balance.toml assert hits-to-kill (CONTENT §4
# anchor 2). `ballistic` present = projectile (M2 consumes speed/drop);
# absent on a firearm = hitscan.
#
# `structure` is the second damage column: what one hit takes off a
# building piece or a deployable. It is its own number, never `damage`
# scaled — a spear that kills a man in four hits must not open a wall in
# four. Two laws hold it (balance.rs, anchor 1): no weapon's `structure`
# may exceed its own `damage`, and the throwable raid tool's must strictly
# exceed every melee weapon's — the raid tool stays the raid tool. The
# raid-ratio anchor divides wall hp by the satchel's `structure`.

[[weapon]]
id = "item.spear_wood"
kind = "melee"
damage = 25
structure = 3
headshot_mult = 2
rate_per_min = 48
range_m = 2

[[weapon]]
id = "item.spear_metal"
kind = "melee"
damage = 30
structure = 4
headshot_mult = 2
rate_per_min = 48
range_m = 2

[[weapon]]
id = "item.bow"
kind = "bow"
damage = 30
structure = 1
headshot_mult = 2
rate_per_min = 30
range_m = 60
ammo = "item.arrow_wood"

[weapon.ballistic]
speed_mps = 40
drop_mps2 = 20

[[weapon]]
id = "item.crossbow"
kind = "bow"
damage = 35
structure = 1
headshot_mult = 2
rate_per_min = 20
range_m = 80
ammo = "item.arrow_metal"

[weapon.ballistic]
speed_mps = 55
drop_mps2 = 20

[[weapon]]
id = "item.revolver"
kind = "firearm"
damage = 20
structure = 1
headshot_mult = 2
rate_per_min = 150
range_m = 50
ammo = "item.pistol_ammo"

[[weapon]]
id = "item.satchel_charge"
kind = "throwable"
damage = 500
structure = 500
headshot_mult = 1
rate_per_min = 10
range_m = 10
# Seconds between planting the charge and the blast. The only field that
# is the throwable's alone: every other column above is shared with the
# melee rows, and a fuse has no meaning on a swing, so `validate` requires
# it here and refuses it everywhere else. It is what makes the raid a
# commitment rather than a click — you are standing at the wall you are
# breaking, and the defender gets the same seconds you do.
# Proposed default, DECISIONS.md §open ("satchel fuse v0").
fuse_s = 10
# Blast radius in metres — one build cell, so the hole a charge clears is
# the cell it was planted on: the wall you stuck it to, the floor under
# that wall, and whatever shares the cell's corner. Both damage columns
# fall off linearly to zero at this distance, and at the planted address
# the distance is zero, so `structure` still arrives whole there and
# balance.rs anchor 1 still divides wall hp by exactly this row's 500.
# `damage` above stops being a discarded column at the same time: it is
# what the blast takes off a player standing in it, on the same curve, so
# 500 is lethal inside 2.4 m against a 100 hp player and survivable at the
# rim. You are standing at the wall you are breaking — the fuse is the
# raider's cost, and this is what it buys the defender.
# Proposed default, DECISIONS.md §open ("satchel blast v0").
blast_m = 3
