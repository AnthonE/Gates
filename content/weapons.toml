# Gates · content/weapons.toml — combat rows (CONTENT.md §1). Damage is
# per body hit; TTK bands in balance.toml assert hits-to-kill (CONTENT §4
# anchor 2). A `kind = "bow"` row is a projectile weapon and its rounds
# carry the ballistics (the `[[ammo]]` table at the foot of this file); a
# firearm names rounds with no `[[ammo]]` row and is hitscan.
#
# `structure` is the second damage column: what one hit takes off a
# building piece or a deployable. It is its own number, never `damage`
# scaled — a spear that kills a man in four hits must not open a wall in
# four. Two laws hold it (balance.rs, anchor 1): no weapon's `structure`
# may exceed its own `damage`, and the throwable raid tool's must strictly
# exceed every melee weapon's — the raid tool stays the raid tool. The
# raid-ratio anchor divides wall hp by the satchel's `structure`.
#
# `headshot_pct` and `limb_pct` are the two ends of the body-part ladder
# (`reference/PROJECTILES.md` §0: head ×2, chest ×1, limbs ×0.5, with a
# per-weapon override), both in **percent**, 100 the identity at each end.
# The satchel carries both identities because a blast has no anatomy to aim
# at. The head was an integer multiplier until Rust's arrows took ×1.5
# (every bow; guns stay ×2, Facepunch's own item pages), which a multiplier
# cannot say. `[bands]` holds the head to [150, 200] and to never killing a
# naked body in one hit, and pins the limb to one value.
#
# **Every row reaches the sim now** (melee aim v1, 2026-09-05). The melee
# rows carried both columns priced for a mechanic that did not exist — a
# swing was resolved feet-to-feet in a plane, so there was no height to
# test — and `bake_combat` dropped them one line before `MeleeDef` could
# hold them. A swing is a cast along the look ray since `melee.rs`, so a
# spear crossing a skull pays `headshot_pct` and one that reaches only the
# shins pays `limb_pct`, exactly as an arrow does (`combat::strike_body`).

# --- tools that are also weapons ---------------------------------------
#
# **A hatchet did no damage to anything until 2026-08-08, and that was a
# hole rather than a design.** `weapons.toml` armed six things, none of them
# a tool, so `held_melee` returned `None` for every pocket the spawn kit
# fills — a fresh character could chop a tree and could not hit a pig, a
# player, or a door with the same axe. `crates/server/tests/hunt.rs` found
# it by trying to hunt with what a spawn actually has.
#
# **The window is not a taste call.** `[bands] ttk_melee = [3, 5]` against
# `player_hp = 100` means every `kind = "melee"` row must do 20–34 damage or
# the content refuses to load, so a tool cannot be a *feeble* weapon here —
# it can only sit at the bottom of the same band a spear sits in. That is
# the honest cost of the band as written, and whether it should widen so a
# rock is meaningfully worse than a spear is a knob, not a loop's call
# (`DECISIONS.md` §open, "tools as weapons").
#
# What separates them instead is **reach**: 1 m against the spears' 2 m, so
# a spear wins the fight it starts. Gather reach is `gather::REACH_M` and is
# untouched — swinging at a tree is not affected by this table.
#
# `structure` stays at or below the metal spear's 4 on every row, so the
# best-melee anchor (`balance.rs`, the door and wall breach swings) still
# resolves to `item.spear_metal` and no raid number moves.

[[weapon]]
id = "item.rock"
kind = "melee"
damage = 20
structure = 1
headshot_pct = 200
limb_pct = 50
rate_per_min = 48
range_m = 1

# **The torch hits** — the reference's does: 5 a blow against its rock's 10,
# plus a point of heat while it burns. Half the rock here too, and the heat
# is `lit_damage` (the sim adds it only while `light::is_lit`). It is a light
# first, so it answers to `[bands] ttk_light` rather than the weapons' band
# (`balance.rs`), and it harvests nothing (no gatherable names it).
[[weapon]]
id = "item.torch"
kind = "melee"
damage = 10
lit_damage = 2
structure = 1
headshot_pct = 200
limb_pct = 50
rate_per_min = 48
range_m = 1

[[weapon]]
id = "item.hatchet_stone"
kind = "melee"
damage = 25
