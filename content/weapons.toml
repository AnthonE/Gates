# --- the rocket (guns v1) ----------------------------------------------------
#
# Rust's basic rocket: 18 m/s, a quarter of gravity, no drag (their wiki;
# the speed is old and the feel is right: you lead a running man by a body
# and see it come). 30 here, so a lob 200 m out lands inside the flight
# backstop, and 2 m/s² bakes to the sim's 1.8. Its blast is
# theirs where a charge's bound allows: 275 to a body at the heart (falling
# to nothing at the edge), and 125 off a structure — a quarter of a stone
# wall, so stone takes four, sheet metal eight, wood two, their raid table.
# The piece it strikes takes the whole 125.
[[ammo]]
id = "item.rocket"
speed_mps = 30
drop_mps2 = 2
[ammo.blast]
blast_m = 3
damage = 275
structure = 125
