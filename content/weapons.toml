# Seconds between planting the charge and the blast. The only field that
# is the throwable's alone: every other column above is shared with the
# melee rows, and a fuse has no meaning on a swing, so `validate` requires
# it here and refuses it everywhere else. It is what makes the raid a
# commitment rather than a click — you are standing at the wall you are
# breaking, and the defender gets the same seconds you do.
# Proposed default, DECISIONS.md §open ("satchel fuse v0").
fuse_s = 10
# The reference's satchel duds one time in five, and is relit by hand. Ours
# falls where it was planted, to be picked up and planted again — the same
# walk back to the wall, and no satchel lost, so the raid's cost in
# satchels (`balance.toml` anchor 1) does not move; its time does.
dud_pct = 20
# Blast radius in metres — one build cell, so the hole a charge is INTENDED
# to clear is the cell it was planted on: the wall you stuck it to, the
# floor under that wall, and whatever shares the cell's corner.
#
# READ BY `charge::detonate` since satchel blast v0. This line said
# "NOTHING READS THIS YET" through the whole slice that made it load-
# bearing, which is the drift `CLAUDE.md` warns about: a comment claiming
# a column is inert reads as permission to change it freely.
#
# The curve it describes is the one that shipped: both damage columns fall
# linearly to zero at this distance, `structure` lands whole at the planted
# address because the distance there is zero, and `damage` is what the
# blast takes off a body standing in it. The scan is the 3×3 column ring
# around the epicentre, and `charge.rs`'s const block asserts this radius
# cannot outrun that ring — so widening `blast_m` past one build cell is a
# sim change, not a content change.
# Proposed default, DECISIONS.md §open ("satchel blast v0").
blast_m = 3

