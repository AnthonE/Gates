# Gates · content/deployables.toml — placeable entities (CONTENT.md §1).
# placement: ground | foundation | doorway | any | door. Doors declare
# `material` so validation can hold them under their material's wall hp
# (the door is the intended breach point); non-doors must not declare one.
#
# matter: wood | stone | metal | cloth — what it is made of, which the client
# hears and sees a blow land on (dust, chips, the impact sound). The sim never
# reads it. A door's agrees with its `material`.
#
# `door` is the code lock's placement class and its alone (lock v1): it is
# the one class whose target must be OCCUPIED, by a door. A lock mints no
# deploy record — it lives in the sim's lock store, keyed by the door's
# address — so its `hp` is carried for the schema and never tracked: a
# lock dies with what it is bolted to, which is the reference's own rule
# (`reference/DOORS.md` §2.2).

# `any`: bare ground, a foundation or an upper floor. A bag goes inside
# your base, which is where Rust's go, and the body wakes standing on the
# floor it lies on (`deploy::bag_wake_body`).
[[deployable]]
id = "item.sleeping_bag"
archetype = "bag"
placement = "any"
matter = "cloth"
hp = 200

[[deployable]]
id = "item.hearth"
archetype = "hearth"
placement = "foundation"
matter = "wood"
hp = 1000

[[deployable]]
id = "item.box_small"
archetype = "box"
placement = "any"
matter = "wood"
hp = 150

[[deployable]]
id = "item.box_large"
archetype = "box"
placement = "foundation"
matter = "wood"
hp = 300

# A log wall: stands on the ground or a floor and blocks a body
# (`deploy::DEPLOY_VOL`). Rust's wooden barricade hp.
[[deployable]]
id = "item.barricade_wood"
archetype = "barricade"
placement = "any"
matter = "wood"
hp = 350

# A raised bed (crops v0): seeds in its beds grow into a crop on the ovens'
# sweep, with no fuel and no switch (`sim-core/oven.rs`). On the ground or a
# floor; a planter is a garden, not a fortification, so it is the box's hp.
[[deployable]]
id = "item.planter"
archetype = "planter"
placement = "any"
matter = "wood"
hp = 300

[[deployable]]
id = "item.fire_pit"
archetype = "fire"
placement = "any"
matter = "stone"
hp = 50

[[deployable]]
id = "item.furnace"
archetype = "furnace"
placement = "any"
matter = "stone"
hp = 500

[[deployable]]
id = "item.workbench1"
archetype = "workbench"
placement = "foundation"
matter = "wood"
hp = 500

# The ladder's upper rungs (bench ladder v0). hp rises 500 → 750 → 1000
# — proposed defaults, DECISIONS.md §open "bench ladder v0": the current
# reference page says 500/750 for its fragment-era benches and no
# pre-Oct-2025 hp survives in the sources, so the rise is ours, priced so
# a raid that costs a base its top bench costs more swings than its
# first.
[[deployable]]
id = "item.workbench2"
archetype = "workbench2"
placement = "foundation"
matter = "metal"
hp = 750

[[deployable]]
id = "item.workbench3"
archetype = "workbench3"
placement = "foundation"
matter = "metal"
hp = 1000

# The recycler (recycler v0): a container that converts without burning.
# `placement = "any"` and hp 300 are the furnace's, because it is the
# furnace's shape of object — a workbench-era converter you put down once
# and feed — and a second set of numbers for the same silhouette would be
# a distinction with nothing behind it. What separates the two is which
# `cooking.toml` rows name them.
[[deployable]]
id = "item.recycler"
archetype = "recycler"
placement = "any"
matter = "metal"
hp = 300

# The research table (research v0). `foundation` like the workbench it sits
# beside — a table is furniture for a base, not something you drop in a
# field — and hp 400 is the workbench's, because they are the same object
# to a raider: the thing that makes the base a workshop.
[[deployable]]
id = "item.research_table"
archetype = "research"
placement = "foundation"
matter = "metal"
hp = 200

[[deployable]]
# ⚠ `hp` is INERT on this row and nothing reads it. A lock mints no
# `DeployRec` — `deploy.rs` bolts `has_lock` onto the record it is placed
# on and returns, "a lock is not a deployable, it is a record about one" —
# so a lock is never damaged, and a raider goes through the door exactly
# as they do in the reference game. The field is required by the schema;
# the number is not a balance knob. `reference/RIPLIST.md` §1c.
id = "item.lock_code"
archetype = "lock"
placement = "door"
matter = "metal"
hp = 100

# The key lock: locked the moment it is on, to its placer and the base's
# hearth crew, with no keypad (`lock::LockRec::fresh_key`). `hp` is inert
# for the code lock's reason.
[[deployable]]
id = "item.lock_key"
archetype = "lock"
placement = "door"
matter = "metal"
hp = 100
keyed = true

