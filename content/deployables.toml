# Gates · content/deployables.toml — placeable entities (CONTENT.md §1).
# placement: ground | foundation | doorway | any | door. Doors declare
# `material` so validation can hold them under their material's wall hp
# (the door is the intended breach point); non-doors must not declare one.
#
# matter: wood | stone | metal | cloth — what it is made of, which the client
# hears and sees a blow land on (dust, chips, the impact sound). The sim never
# reads it. A door's agrees with its `material`.
#
# `door` is the code lock's placement class and its alone (lock v1): it is
# the one class whose target must be OCCUPIED, by a door. A lock mints no
# deploy record — it lives in the sim's lock store, keyed by the door's
# address — so its `hp` is carried for the schema and never tracked: a
# lock dies with what it is bolted to, which is the reference's own rule
# (`reference/DOORS.md` §2.2).

# `any`: bare ground, a foundation or an upper floor. A bag goes inside
# your base, which is where Rust's go, and the body wakes standing on the
# floor it lies on (`deploy::bag_wake_body`).
[[deployable]]
id = "item.sleeping_bag"
archetype = "bag"
placement = "any"
matter = "cloth"
hp = 200

[[deployable]]
id = "item.hearth"
archetype = "hearth"
placement = "foundation"
matter = "wood"
hp = 1000

[[deployable]]
id = "item.box_small"
archetype = "box"
placement = "any"
matter = "wood"
hp = 150

[[deployable]]
id = "item.box_large"
archetype = "box"
placement = "foundation"
matter = "wood"
hp = 300

# A log wall: stands on the ground or a floor and blocks a body
# (`deploy::DEPLOY_VOL`). Rust's wooden barricade hp.
[[deployable]]
id = "item.barricade_wood"
archetype = "barricade"
placement = "any"
matter = "wood"
hp = 350

# Rust's barbed barricade (their hp, 400) and floor spikes (100). The barbed
# one is the barricade's wall with wire through it; the spikes are walked
# over, and hurt the body standing on them (`World::prick_deploys`).
[[deployable]]
id = "item.barricade_barbed"
archetype = "barricade_barbed"
placement = "any"
matter = "wood"
hp = 400

[[deployable]]
id = "item.floor_spikes"
archetype = "floor_spikes"
placement = "any"
matter = "wood"
hp = 100

# A rug: walked over like the spikes, on the ground or a floor, and anything
# but another rug stands on it (`deploy::layers`). Comfort is per
# mille within `comfort_radius_cm`: 15 % with no fire, on top of a fire's, and
# the best rug in reach counts, so two rugs are one (`World::furnish_comfort`).
[[deployable]]
id = "item.abyss_rug"
archetype = "rug"
placement = "any"
matter = "cloth"
hp = 100
comfort = 150
comfort_radius_cm = 300

# A raised bed (crops v0): seeds in its beds grow into a crop on the ovens'
# sweep, with no fuel and no switch (`sim-core/oven.rs`). On the ground or a
# floor; a planter is a garden, not a fortification, so it is the box's hp.
[[deployable]]
id = "item.planter"
archetype = "planter"
placement = "any"
matter = "wood"
hp = 300

# A water catcher (farming v2): a barrel under a tarp funnel. It banks rain
# under open sky, fills a waterskin, and waters the planters and ground
# plants within `catcher_reach_cm` (`cooking.toml` `[farm]`).
[[deployable]]
id = "item.water_catcher"
archetype = "catcher"
placement = "any"
matter = "wood"
hp = 150

[[deployable]]
id = "item.fire_pit"
archetype = "fire"
placement = "any"
matter = "stone"
hp = 50

[[deployable]]
id = "item.furnace"
archetype = "furnace"
placement = "any"
matter = "stone"
hp = 500

# The benches and the research table stand on bare ground as well as a
# floor (operator, 2026-10-17: like Rust, where a workbench goes down in a
# field). `any` holds them to the terrain test a foundation passes.
[[deployable]]
id = "item.workbench1"
archetype = "workbench"
placement = "any"
matter = "wood"
hp = 500

# The ladder's upper rungs (bench ladder v0). hp rises 500 → 750 → 1000
# — proposed defaults, DECISIONS.md §open "bench ladder v0": the current
# reference page says 500/750 for its fragment-era benches and no
# pre-Oct-2025 hp survives in the sources, so the rise is ours, priced so
# a raid that costs a base its top bench costs more swings than its
# first.
[[deployable]]
id = "item.workbench2"
archetype = "workbench2"
placement = "any"
matter = "metal"
hp = 750

[[deployable]]
id = "item.workbench3"
archetype = "workbench3"
placement = "any"
matter = "metal"
hp = 1000

# The recycler (recycler v0): a container that converts without burning.
# `placement = "any"` and hp 300 are the furnace's, because it is the
# furnace's shape of object — a workbench-era converter you put down once
# and feed — and a second set of numbers for the same silhouette would be
# a distinction with nothing behind it. What separates the two is which
# `cooking.toml` rows name them.
[[deployable]]
id = "item.recycler"
archetype = "recycler"
placement = "any"
matter = "metal"
hp = 300

# The research table (research v0). `any` like the workbench it sits
# beside, and hp 400 is the workbench's, because they are the same object
# to a raider: the thing that makes the base a workshop.
[[deployable]]
id = "item.research_table"
archetype = "research"
placement = "any"
matter = "metal"
hp = 200

[[deployable]]
# ⚠ `hp` is INERT on this row and nothing reads it. A lock mints no
# `DeployRec` — `deploy.rs` bolts `has_lock` onto the record it is placed
# on and returns, "a lock is not a deployable, it is a record about one" —
# so a lock is never damaged, and a raider goes through the door exactly
# as they do in the reference game. The field is required by the schema;
# the number is not a balance knob. `reference/RIPLIST.md` §1c.
id = "item.lock_code"
archetype = "lock"
placement = "door"
matter = "metal"
hp = 100

# The key lock: locked the moment it is on, to its placer and the base's
# hearth crew, with no keypad (`lock::LockRec::fresh_key`). `hp` is inert
# for the code lock's reason.
[[deployable]]
id = "item.lock_key"
archetype = "lock"
placement = "door"
matter = "metal"
hp = 100
keyed = true

[[deployable]]
id = "item.door_wood"
archetype = "door"
placement = "doorway"
matter = "wood"
material = "wood"
hp = 200

[[deployable]]
id = "item.door_metal"
archetype = "door"
placement = "doorway"
matter = "metal"
material = "metal"
hp = 250

[[deployable]]
id = "item.window_bars_metal"
archetype = "window_bars"
placement = "window"
matter = "metal"
hp = 500

[[deployable]]
id = "item.garage_door"
archetype = "garage_door"
placement = "wall_frame"
matter = "metal"
material = "metal"
hp = 600

# HP: https://wiki.rustclash.com/item/strengthened-glass-window
[[deployable]]
id = "item.window_glass"
archetype = "window_glass"
placement = "window"
matter = "stone"
hp = 350

# HP: https://wiki.rustclash.com/item/wood-shutters
[[deployable]]
id = "item.window_shutters"
archetype = "window_shutter"
placement = "window"
matter = "wood"
hp = 200

# A player's auto turret (`sim-core/src/turret.rs`, `NOW.md` §0aa 1): a box
# with a gun on top — the one you put in it, `[turret]` below — that shoots
# anybody in reach who is not its owner or the crew of the claim it stands in. Rust's turret hp; unpowered, since
# nothing here carries power.
[[deployable]]
id = "item.autoturret"
archetype = "turret"
placement = "foundation"
matter = "metal"
hp = 1000

# The compound shop (`sim-core/src/shop.rs`): a twelve-slot steel cabinet of
# stock and takings. Its owner and the crew of the claim it stands in fill it
# and set its offers; anyone in reach buys, in junk.
[[deployable]]
id = "item.vending_machine"
archetype = "vending"
placement = "any"
matter = "metal"
hp = 500

# The turret. As in Rust it fires the gun you put in its box — the first of
# `guns` it holds — at that gun's own `weapons.toml` numbers (its magazine a
# burst, its rate, its reload between bursts, its round out of the same box),
# for `damage_pct` of the gun's damage: a revolver turret's 21 a round is the
# 20 the built-in gun dealt. Range is the reference's 30 m; the 1 s beep
# before it opens up is ours.
[turret]
range_m = 30
lock_ms = 1000
lose_ms = 3000
spread_cm_per_10m = 15
damage_pct = 60
guns = [
  "item.revolver",
  "item.semi_pistol",
  "item.python",
  "item.thompson",
  "item.custom_smg",
  "item.semi_rifle",
  "item.assault_rifle",
  "item.bolt_rifle",
  "item.pump_shotgun",
]
