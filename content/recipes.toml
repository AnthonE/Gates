# --- furnace runs -------------------------------------------------------
#
# **Their shape, taken 2026-08-10** (`reference/RIPLIST.md` §4.6;
# `BALANCE.md` §6.3's ladder). Two sources disagree: metal 2.5 / sulfur
# 2.5 against metal 3.3 / sulfur 1.7. Rungs 1–2 do not separate them
# (nothing checkable, neither devblog-primary), rung 3 does — 2.5/2.5 is
# the reading two independent retellings share, where 3.3/1.7 looks like
# an inverted rate (1/0.3, 1/0.6) reported as a duration.
#
# **The shape is the real change and it is free: metal and sulfur smelt
# ALIKE there.** Ours had sulfur at half of metal, which is a difference a
# returning player feels every furnace load. Sulfur 1 → 2.
#
# The magnitude is where our schema stops: `seconds` is a `u32` baked as
# `seconds × TICK_HZ`, so **2.5 is not expressible** and both rows land on
# 2. That is a representation limit, not a preference — filed as its own
# row in `RIPLIST.md` §2 rather than written up here as a reason, because
# §6.2 is explicit that a cost dressed as a principle is how a deferral
# becomes permanent. The sim already runs in ticks; only the content field
# is integer-seconds.
#
# The mechanism half outranks the seconds and already matched: their
# furnace smelts **every slot in parallel**, so five furnaces cost the
# same wood as one and finish in a fifth of the time. `oven::sweep`
# advances every slot holding a cookable input, so ours does too.

[[recipe]]
id = "recipe.metal_frags"
output = "item.metal_frags"
count = 1
station = "furnace"
seconds = 2
inputs = [{ item = "item.metal_ore", count = 1 }]

[[recipe]]
id = "recipe.sulfur"
output = "item.sulfur"
count = 1
station = "furnace"
seconds = 2
inputs = [{ item = "item.sulfur_ore", count = 1 }]

[[recipe]]
id = "recipe.charcoal"
output = "item.charcoal"
count = 1
station = "furnace"
seconds = 1
inputs = [{ item = "item.wood", count = 1 }]

