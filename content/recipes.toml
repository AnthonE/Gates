# --- furnace runs -------------------------------------------------------
#
# **Researched 2026-08-10 and deliberately NOT moved** (`reference/
# RIPLIST.md` §4.6, §2 row 3). Their smelt seconds are APPROX and the two
# sources contradict each other on the *shape* as well as the magnitude:
# one reads metal 2.5 / sulfur 2.5 (the same), the other metal 3.3 /
# sulfur 1.7 (sulfur faster). Ours — metal 2, sulfur 1 — carries the
# second source's shape and sits inside the envelope of both, so there is
# no side to take that is not a coin toss. §0's rule is that a
# disagreement is recorded, never averaged; this is the record.
#
# What DID check out is the mechanism, which outranks the seconds: their
# furnace smelts **every slot in parallel**, so five furnaces cost the
# same wood as one and finish in a fifth of the time, and anyone modelling
# it as a sequential queue gets throughput wrong by the slot count.
# `oven::sweep` already advances every slot holding a cookable input, so
# ours matches without a change.

[[recipe]]
id = "recipe.metal_frags"
output = "item.metal_frags"
count = 1
station = "furnace"
seconds = 2
inputs = [{ item = "item.metal_ore", count = 1 }]

[[recipe]]
id = "recipe.sulfur"
output = "item.sulfur"
count = 1
station = "furnace"
seconds = 1
inputs = [{ item = "item.sulfur_ore", count = 1 }]

[[recipe]]
id = "recipe.charcoal"
output = "item.charcoal"
count = 1
station = "furnace"
seconds = 1
inputs = [{ item = "item.wood", count = 1 }]

