# Gates · content/recipes.toml — the craft ladder (CONTENT.md §1/§2).
# station: none | workbench1 | furnace. `count` is the output quantity per
# craft. Components (gears/rope/tarp) and fat have no recipe: barrel-only,
# priced for the balance math by balance.toml `component_minutes`.

