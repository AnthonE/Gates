# Gates · content/mobs.toml — the animal roster's species table
# (`sim-core/src/mob.rs`, `reference/ANIMALS.md`). Two species — prey and a
# predator — and the second one measured what the first one's file header
# had been promising: the BEHAVIOUR was free, the roster was not. Nothing
# in `crates/sim-core/src/mob.rs` branches on species. A wolf hunts because
# `brave_pct = 0` is courage with no floor to fall under, so the one
# rousing timer both animals share always points forward, and because its
# notice radius is wide enough to start one from across a meadow.
#
# Speeds are percentages of the PLAYER's, because that is the only speed an
# animal can have: it drives `movement::step` through the same `InputFrame`
# a player does, and that function scales by `move_z / 127` of `WALK_SPEED`
# (or of `SPRINT_SPEED` while the sprint bit is set). A m/s field would be a
# number the bake rounded to the nearest 1/127th without telling anyone.
#
# Distances are metres and times are seconds — the units a balance pass is
# argued in. The bake converts; nothing in the sim knows what a second is.
#
# Every number below is a **proposed default** registered in DECISIONS.md
# §open ("animals v0" / "mob attack v0"), not a spoken one. Where the
# reference game is the source, the reference is named — and since
# 2026-08-11 the pig IS their boar in the one way it wasn't: it charges
# when whole and runs when hurt.
#
# **2026-10-15, re-read against the live game** (operator: "make sure
# animals are all setup just like Rust survival does it"). The hp and bite
# figures below had been taken from a pre-2024 wiki and each carried a
# "re-verify if egress ever opens" caveat. Egress opened: the current
# datamines (rusthelp.com/world/<animal>, rustpedia.com/world/<animal>) and
# the Nov–Dec 2024 wolf rework devblogs ("Armed and Animated", "Polish and
# Progress") put the boar, the wolf and the stag at 150 hp each, the wolf's
# bite at 30, the boar's courage at 75%, packs at one to four wolves and
# stag herds at one to five. Theirs out-run a player (a wolf 9 m/s, a stag
# 8.3 against a 5.5 sprint). Since 2026-10-20 a run past 100 is allowed
# (`MobDef::run_pct`, up to 150): the body steps that much faster than a
# sprint (operator: "i can outrun the wolfs. pigs need to match my running
# speed").

[[mob]]
id = "mob.pig"
name = "Pig"

# **150 hp — the reference game's boar** (rusthelp/rustpedia, 2026-10-15),
# and the pig was 150 once before (operator, 2026-08-08: balance close to the
# reference so a player coming from it is not lost) until a stale wiki table
# talked it down to 80. Six swings of the kit's stone hatchet (25 dmg) at
# full strength; on wipe day the fel tier's 60% makes it 90, four swings.
hp = 150

# 50% of WALK_SPEED = 1.49 m/s, an amble a player outwalks without trying.
walk_pct = 50

# **100% of SPRINT_SPEED = 5.5 m/s: the player's own top speed** (operator,
# 2026-10-20: "pigs need to match my running speed"). It was 70 because a
# pig at 100 that fled on sight could never be caught. Since 2026-08-11 a
# whole pig CHARGES (`brave_pct` below), so the speed is mostly the speed it
# comes at you. A pig hurt under 75% still runs, and a sprint no longer closes
# on it: crouch up on it from behind (half the spook radius, and its blind
# cone), finish it at range, or wound it under 10% so it limps (`LIMP_PCT`).
flee_pct = 100
flee_seconds = 3

# **The bite.** Their boar bites 12 every 1.5 s and runs once hurt past a
# quarter of its health — fights whole, flees at 75%. That mechanism is
# `brave_pct = 75`: at or above it a roused pig charges, below it the same
# rousing is the flight it always was. The cadence here is whole seconds, so
# the bite is their 8 a second at ours: 15 every 2 s. 2 m reach.
attack = 15
attack_range_m = 2
attack_seconds = 2
brave_pct = 75
# Turned in the Verdigris (`sim_core::blight::TURN_ON`), a bite also puts 6%
# on the corruption meter, less what the bitten body's mask and suit ward.
fel_bite = 60

# The leash and the fright radius, and the pair is the whole behaviour.
# 60 m of roam keeps a pig findable near where the seed put it — the
# reference game's own fix for animals that "ended up at the coast of the
# island" (reference/ANIMALS.md §2). 8 m is their boar's sight: a rooting
# boar that only notices you once you are nearly on it.
roam_m = 60
spook_m = 8

# Night changes nothing for prey, and that is a statement rather than a
# placeholder. The reference game's rework was of its PREDATOR's senses and
# said nothing about its boar's, so a nocturnal pig would be a difference
# with no mechanism behind it — which `reference/BALANCE.md` §6.2 refuses in
# exactly those words. Equal, until something is measured.
night_spook_m = 8

# Five minutes. Long enough that clearing the pigs near your base is worth
# doing and short enough that it is not permanent. It comes back somewhere
# new, drawn from its habitat — the reference's refill (reference/SPAWN.md
# §3.5): clear a valley and it refills from the rest of the island.
respawn_seconds = 300

# The reference's population (operator, 2026-10-01: "lets make it just like
# rust"): `boar.population` defaults to 5 per km², and the island's pigs are
# that times their habitat-weighted land. Their boar spawns in the arid and
# temperate biomes and not the snow, so meadow and forest are whole, the
# desert nearly so, and the granite above the treeline is thin.
per_km2 = 5.0
# The Verdigris barely: a boar roots in ash only at its edge.
habitat = { meadow = 1.0, forest = 1.0, highland = 0.15, desert = 0.7, fel = 0.1 }
# The hit volume a swing's ray must enter (melee aim v1, 2026-09-05): a
# cylinder on the animal's feet, centimetres. Read off what the client draws
# — a pig is 1.5 m long and 0.78 m high (`render/mobs.rs`), so the radius
# covers the body's width and most of its length, and the height is the drawn
# one (`client/tests/mob_volume.rs` holds both against the mesh). Aim DOWN at it:
# a level swing from a 1.6 m eye passes clean over a pig.
body_r_cm = 55
body_h_cm = 78

# **The brain's senses** (`sim-core/src/brain.rs`, the reference's
# `AIBrainSenses`). A player walking or standing is heard across the whole
# spook radius from any bearing; a crouched one is seen only inside a
# 240° cone, at half the radius, and behind it not at all. That 120° blind
# spot is the reference's "sneak up from behind" (reference/ANIMALS.md
# §2): crouch in from the back and a pig is yours to swing at.
sight_deg = 240
# Solitary: a pig answers no pack-mate and fears no torch.
pack_m = 0
fire_fear_m = 0

# **The brain's numbers** (`sim-core/src/brain.rs`, `noise.rs`). Every
# species carries the lot, though only a design that asks spends each one:
# a pig never waits its turn, gives up, howls or circles, and a wolf never
# beds down. They are the numbers the brain had in code, the same on every
# row until a species earns its own.
#
# No more than two close in on one target at a time; the rest of a pack
# circles. Ours, not theirs: the reference's wolves visibly mix charging
# with circling and reposition between attacks, but no published rule caps
# the count. Two is the cap that makes the mix happen.
pack_biters = 2
# Failed routes to one target before it gives up and goes home.
give_up_tries = 3
# A minute out of combat (not struck, nobody remembered) and it heals,
# twenty seconds from a scratch to whole: the reference's reworked wolf
# regenerates "after a long time out of combat".
heal_after_seconds = 60
heal_seconds = 20
# A pack animal howls for its pack at most this often: one call per hunt,
# not one per sighting.
howl_seconds = 20
# The circle a waiting animal walks round its target.
orbit_m = 7
# At night, when an idle stand runs out, the draw to lie down for 20–40 s
# instead of roaming.
sleep_pct = 40
# How far each kind of noise carries to it. Ours: the reference publishes
# that its animals hear these, not how far. A gunshot at 100 m is the
# disclosure `reference/AUDIO.md` §9 already prices for players; a bow is
# quiet, the reason to hunt with one; a strike is a hatchet in a trunk, a
# pick on a node or a round landing; a blast is a satchel.
hear_m = { gun = 100, bow = 15, strike = 25, blast = 200 }

# What the corpse holds. The kill stands these rows up as a ground bag at
# the death position (`mob::strike` → `backpack::stand_up`) — the killer
# walks over and loots it with E like any bag, or cuts more out of it with a
# blade (`[butcher]` at the foot of this file); nothing is paid into an
# inventory by the blow itself.
#
# **Raw meat leads, and it is the reason the campfire has a job.** Meat was
# cut from the alpha food set because nothing dropped it and nothing could
# cook it; `sim-core/oven.rs` landed the same day this did with an empty
# cook table for the mirror-image reason, so the two halves closed each
# other (DECISIONS.md 2026-08-08). Raw meat is the one item in the set you
# cannot eat — `cooking.toml` turns it into `item.cooked_meat` on a fire,
# and that walk is the whole loop: kill it, carry it, light a fire, eat.
#
# The rest is their boar's harvest in its own proportions — 50 bone, 40
# fat, 20 leather, 10 cloth and 8 pork to a hatchet — at two thirds, since
# here a blade pays more than the hand (`[butcher]`): the boar is the fat
# animal.
drops = [
  { item = "item.raw_meat", count = 5 },
  { item = "item.fat", count = 27 },
  { item = "item.cloth", count = 7 },
  { item = "item.bone_frags", count = 33 },
  { item = "item.leather", count = 13 },
]

# ---------------------------------------------------------------------------

[[mob]]
id = "mob.wolf"
name = "Wolf"

# **The island's first predator** (predator v0, `DECISIONS.md` §open). Every
# number below that has a source names it; the rest are proposed defaults
# registered there, not spoken.
#
# What it is FOR: the map had one animal and it was prey, so outside a PvP
# encounter the only lethal pressure was a fall or the food bar, and night
# was darker and nothing else. This is the thing that makes going out at all
# a decision. It is not a harder pig — a pig answers being crowded and then
# thinks better of it; this one notices you at range and does not stop.

# **150 — the reference game's wolf** since its 2024 rework (rusthelp /
# rustpedia, 2026-10-15; the 100 here was the pre-rework wiki's). Six
# swings of the kit's stone hatchet, as the boar; 90 on wipe day.
hp = 150

# 55% of WALK_SPEED = 1.64 m/s: a patrol, marginally brisker than the pig's
# amble, so a wolf crossing a meadow reads as going somewhere.
walk_pct = 55

# **120% of SPRINT_SPEED = 6.6 m/s: a wolf outruns you**, as theirs does at
# 9 m/s (operator, 2026-10-20: "i can outrun the wolfs"). It was 85, which a
# sprinting player beat by 0.83 m/s. Now a wolf that has noticed you closes
# 1.1 m/s on open ground: running buys time to reach a door, a rock or water,
# and the chase ends at the edge of its range (`roam_m`), or in a fight.
flee_pct = 120

# Six seconds of commitment past the last moment you were inside the notice
# radius — twice the pig's, because breaking off after three would let a
# player who ran ten metres and turned around win every encounter for free.
flee_seconds = 6

# **The hunt, and it is two numbers.**
#
# `brave_pct = 0` is the whole predator: courage is a floor a wound has to
# drop under, and there is nothing under zero, so the rousing that makes a
# hurt pig run makes this charge at 1 hp. It is the only field that decides
# which way an animal points and the only place prey and hunter part.
#
# 30 m of notice against the pig's 8. Eight is a flinch — close enough
# that a player walking a treeline sends one running before they see it.
# Thirty is a sight line: it starts the encounter at a distance where the
# player still has every option, which is what makes choosing wrong cost
# something.
#
# 30 a bite is theirs (a lunge does 35), re-verified 2026-10-15 — the 20
# this was carried at was the figure its caveat named first. Four bites kill
# a fresh 100 hp spawn over ~8 s of contact; on wipe day the fel tier halves
# it to 15.
#
# The 2 s cadence is the pig's, unchanged: nothing about a wolf argues for
# a different one and differing without a mechanism is what
# `reference/BALANCE.md` §6.2 refuses.
attack = 30
attack_range_m = 2
attack_seconds = 2
brave_pct = 0
# Turned, a wolf's bite puts 8% on the corruption meter, before the ward.
fel_bite = 80

# A wider territory than the pig's 60, for the reason the animal exists:
# a predator you only ever meet in one clearing is a hazard sign, not a
# predator. Still comfortably over the notice radius, which the validator
# requires — a leash inside the radius that starts a charge is a treadmill.
roam_m = 90
spook_m = 30

# **It hunts worse at night, not better, and that is the reference's own
# direction rather than ours** (nocturnal senses, `DECISIONS.md` §open).
#
# The obvious design — a predator that ranges wider in the dark — is the one
# the reference game shipped and then removed. Its 2024 predator rework cut
# wolf sight at night on the stated grounds that the old animal "feels a bit
# like a landmine… that issue is of course amplified in the pitch black
# night": night danger in this genre is a problem of what the PLAYER can
# see, and sharpening the animal on top of that is not difficulty, it is an
# ambush the player was never given the information to avoid. No game in the
# survey publishes a day→night sense ratio above 1× for one creature. The
# one published 2× is a night-only *variant* — a different row in this file,
# not this field.
#
# **Half is ours and the §open row says so.** The direction is sourced; the
# ratio is not, because nobody publishes one. 0.5× is the best-supported
# number in the survey for the analogous "this creature senses less right
# now" case: two games independently use it for crouch (30 m sight → 15 m
# crouched). 30 → 15 borrows that rather than inventing a third figure.
#
# What it buys the player is the first decision the CLOCK makes: crossing
# open ground after dusk is a real tactic against the thing that hunts you,
# and the cost of taking it is that you cannot see either. Before this, the
# hour was a colour grade — nothing in the sim read it (`world::is_night`
# is the door, and this is what walked through it).
night_spook_m = 15

# The pig's five minutes, deliberately unchanged. Clearing the wolves near
# your base should be worth the same kind of doing, and no mechanism argues
# for a rarer respawn — only a wish for one.
respawn_seconds = 300

# `wolf.population` defaults to 2 per km² in the reference, and its wolves
# roam the arid, temperate and snow biomes, keeping to rocky ground and
# woods: forest and highland whole, open meadow and the desert thinner.
# 3, not 2: the reference counts its whole map square and we count only
# habitat-weighted land, so 2 left ~8 wolves roaming by day against 8 at the
# sites. Now ~12 roam (four packs) and only the pad keeps any
# (`mob::SITE_GUARDS`, on top of these).
per_km2 = 3.0
# The Verdigris is the wolves' own: packs run its ash.
habitat = { meadow = 0.4, forest = 1.0, highland = 1.0, desert = 0.4, fel = 0.8 }
# The night doubles them (`NOW.md` §0pr 3): the extra wolves hatch after dusk
# and leave at daybreak once nobody is near — a night out costs more than
# the cold. Ours, not the reference's (its wolves keep one population).
night_extra = 1.0
# 1.6 m long and 0.85 m high on the client (`render/mobs.rs` WOLF_LEN_M / WOLF_H_M).
body_r_cm = 60
body_h_cm = 85

# Their reworked wolf's 200° field of view: a wider blind spot than the
# pig's, the crouch-in-from-behind the rework was built to allow.
sight_deg = 200

# **A pack animal** (the reference's 2024 wolf). A wolf with nobody in its
# own senses answers a pack-mate on a target inside 40 m — its howl — so a
# pack arrives together. Free wolves den in packs of one to four, the
# rework's sizes (`mob::PACK_SIZES`), and the guards on one post are a pack
# already. No more than two close in on
# one player at a time (`pack_biters`); the rest circle at 7 m (`orbit_m`)
# and rush the gap.
pack_m = 40

# A lit torch inside 8 m holds a wolf off: it circles at the edge of the
# light instead of biting (the reference's wolves keep off fire). What it
# costs the player is the hand the torch is in.
fire_fear_m = 8

# The pig's brain numbers (its row says why each is what it is). This is
# the row that spends the first five: it waits its turn, gives up on a
# player it cannot reach, howls and circles. Between hunts the pack lies
# about its den and sleeps, as the reworked wolf does — `sleep_pct` at
# night and a third of it by day (`brain::WOLF`).
pack_biters = 2
give_up_tries = 3
heal_after_seconds = 60
heal_seconds = 20
howl_seconds = 20
orbit_m = 7
sleep_pct = 40
hear_m = { gun = 100, bow = 15, strike = 25, blast = 200 }

# **A bred brain, off until a playtest** (`brain::WOLF_NET`,
# `server/examples/zoo.rs`, 2026-10-21). 101 mutations, bred against the
# agent; on 200 held-out bouts it downs the agent 12% of the time to the
# rule table's 8% (fitness 0.276 to 0.211), mostly by fighting spears, bows
# and runners better, and a Pro with a bow still clears its pack 62% of the
# time either way. Uncomment to put it on the wolves from the medium fel
# tier (`genome_tier`, absent is 1): wipe day's wolves keep the rule table.
# genome = "gw1:j5nRPUmcHkO2eIJ7ZFkpbqXfxDmvvaeL1RY6HHS8JAoDsUXU8Jy5b1cT3dVgOvOPo1eT-NLhktcb4wXjcYCKvNRu3ymPogfI9dxjWCFnB2arBxbpOuoZlhgkT8z3HSiFX0RGx7zCw_A0ukq2tHzx5WpXUoPx4n7nzmTjt-Lh5t-KZE2zy7I_ga3wdGzSga2TueMJI2u8fifzCZPVD5YzGt6R1pV-LWP3oJ2dwtHdF2IY6XyxTY5lP_WA64O1DxrvW9Ac-dbzXDOkiHbTFXw"

# **The hide animal.** Their reworked wolf pays 75 leather, 40 bone, 35
# cloth, 10 fat and 5 meat to a hatchet (and a skull); this is that at two
# thirds, as the pig's row. You kill it for its pelt, or because it is
# already killing you — not for the meal.
drops = [
  { item = "item.raw_meat", count = 3 },
  { item = "item.fat", count = 7 },
  { item = "item.cloth", count = 23 },
  { item = "item.bone_frags", count = 27 },
  { item = "item.leather", count = 50 },
]

# ── The attack helicopter ──────────────────────────────────────────────────
# Rust's Patrol Heli, cut down to "just fly over and be a threat… just a
# strong gun" (operator, 2026-10-01). An AI gunship (`sim-core/src/heli.rs`):
# it comes in from the sea, patrols the island (every other leg goes looking
# for a player), and when it sees somebody outside the town it circles them
# and fires bursts. Cover works — it needs line of sight to pick you, circles
# where it last saw you, and gives up after `lose_seconds`. It cannot be hurt
# yet, nobody flies it, and it carries no rockets.
#
# Proposed defaults, tuned on three seeds against a player standing on the
# spawn beach: spotted, a two-second beat, then two to four bursts (3–8 s of
# fire) and an unarmoured player is down. Reaching cover in the gaps works.
#
# The schedule (operator, 2026-10-02): a five-minute patrol every thirty
# minutes, arrival to arrival, the first five minutes after boot.
[heli]
first_seconds = 300
every_seconds = 1800
patrol_seconds = 300
speed_mps = 22
engage_speed_mps = 10
cruise_m = 45
engage_m = 26
orbit_m = 32
detect_m = 130
lose_seconds = 8
range_m = 90
damage = 18
burst = 8
rate_ms = 100
burst_gap_ms = 1800
spread_cm_per_10m = 18

