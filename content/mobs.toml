[[mob]]
id = "mob.stag"
name = "Stag"

# **Prey that only runs** — Rust's deer: the leather and bone a naked spawn
# can go and get without being charged. `attack = 0` is the whole
# behaviour: a species with no bite has no courage to test, so every rousing
# is a flight (`brain.rs`). 150 hp, their stag's (rusthelp / rustpedia,
# 2026-10-15).
hp = 150
walk_pct = 50
# Faster than the pig's run: a sprinting player gains on it slowly, so it is
# a bow's animal more than a spear's.
flee_pct = 85
flee_seconds = 5
attack = 0
attack_range_m = 0
attack_seconds = 0
brave_pct = 0
# Skittish: it hears you further out than a pig does, day and night.
roam_m = 80
spook_m = 20
night_spook_m = 20
respawn_seconds = 300
# Rust's `stag.population` is 3 per km², in the temperate, snow and jungle
# biomes: meadow and woods, the high ground well, the desert hardly.
per_km2 = 3.0
habitat = { meadow = 1.0, forest = 1.0, highland = 0.6, desert = 0.05, fel = 0.05 }
# 1.6 m long, 1.3 m to the top of the head (`render/mobs.rs` STAG_*).
body_r_cm = 55
body_h_cm = 130
sight_deg = 240
# **A herd** of one to five, their deer's (`mob::HERD_SIZES`): herd-mates
# den round a leader and graze round it, and one stag bolting from somebody
# inside 25 m sends the rest of its herd bolting from them too
# (`brain::pack_call` — the wolf's howl, answered by running).
pack_m = 25
fire_fear_m = 0
# The pig's brain numbers: it hears, heals and beds down like one.
pack_biters = 2
give_up_tries = 3
heal_after_seconds = 60
heal_seconds = 20
howl_seconds = 20
orbit_m = 7
sleep_pct = 40
hear_m = { gun = 100, bow = 15, strike = 25, blast = 200 }
# Their stag's harvest (50 bone, 50 leather, 25 cloth, 10 fat, 4 meat) at
# two thirds, as the pig's row.
drops = [
  { item = "item.raw_meat", count = 3 },
  { item = "item.fat", count = 7 },
  { item = "item.cloth", count = 17 },
  { item = "item.bone_frags", count = 33 },
  { item = "item.leather", count = 33 },
]

# ---------------------------------------------------------------------------

# **Butchering** (`NOW.md` §0m item 1, `reference/ANIMALS.md` §9.5 item 2):
# a tool swung at a carcass cuts one stack out of it per hit, in the order
# the species' `drops` list them (meat first), and pays `yield_pct` percent
# of that stack. `E` still pulls the whole carcass apart by hand at 100, so
# every row here pays more than that: a blade is how you get the most out of
# a kill. A tool with no row is a blunt swing that cuts nothing.
#
# Our numbers, not the reference's: theirs pays more to a better tool (the
# bone knife best) and publishes no per-tool table we could take.
[butcher.yield_pct]
"item.hatchet_stone" = 125
"item.hatchet_metal" = 150
"item.spear_stone" = 115
"item.spear_metal" = 125

# Hundredths of condition per cut — `gatherables.toml`'s 0.3 a hit. Spears
# carry no condition, so they have no row.
[butcher.condition_loss]
"item.hatchet_stone" = 30
"item.hatchet_metal" = 30

# **A site guard's own tier** (`NOW.md` §0wc item 3). A guard is a wolf slot
# holding a site (`mob::guard_site_of`), and until this its carcass held a
# wolf's meat and hide and nothing else, so the reason to fight one was only
# the crates behind it. These stacks ride on top of the wolf's drops: a
# crate's guaranteed junk (`loot.toml`, the wooden crate's 5) and a crate's
# middling fragments, because killing the thing guarding a crate should pay
# about what the crate does.
[guard]
drops = [
  { item = "item.junk", count = 5 },
  { item = "item.metal_frags", count = 20 },
]

# ── Fel tiers (`ARC.md` §2, `sim-core/src/mob.rs` `FelTier`) ──────────────
# The island's animals are fel-touched, and the touch deepens with the wipe:
# tier A in act I, B once an act-II work opens, C once every act-II work has
# burned (`works::fel_tier_of`; the client draws the same tier,
# `render/beasts.rs`). Each row moves EVERY species, in per cent of its own
# numbers above, while the island is in that tier.
#
# Operator, 2026-10-13: "make animals weak early on. and maybe less
# agressive". So A is soft and wary: 60% of the hp, half the bite, half the
# notice radius (a wolf hunts from 15 m by day instead of 30, hears a shot at
# 50 m instead of 100), and a fighter breaks off below 35% hp — which is a
# wolf learning to run, since the boar's own floor is already 50. B is the
# rows as written. C is the island at its worst.
#
# An animal alive across a tier change keeps its hp and heals toward the new
# ceiling out of combat (`brain::heal`), so nothing jumps to full at dawn.
[[fel_tier]]
hp_pct = 60
attack_pct = 50
notice_pct = 50
brave_min_pct = 35

[[fel_tier]]
hp_pct = 100
attack_pct = 100
notice_pct = 100
brave_min_pct = 0

[[fel_tier]]
hp_pct = 150
attack_pct = 140
notice_pct = 125
brave_min_pct = 0
