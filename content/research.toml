# Gates · content/research.toml — the blueprint table (CONTENT.md §1,
# research). The sink JUNK exists for: you find the thing, you take it to a
# table with a fistful of coin, and from then on you can make it yourself —
# or you unlock it at a workbench's tree for the same coin per node.
# The sim's side is `sim-core/research.rs`; every number here is a knob with
# this file as its documented default (DECISIONS.md §open, "blueprint split
# v1").
#
# **What research is paid in, named here rather than assumed in code.**
# `sim-core` receives an item index and never learns it is currency —
# `DESIGN.md` §3.1's coin stays out of `crates/` the same way every other
# number does. And to be clear about which JUNK this is: the carried,
# item-stack kind, which is scrap (operator, 2026-08-10). Nothing in this
# file touches a wallet, a ledger or a chain.
[coin]
item = "item.junk"

# What a research table makes, and how long it takes (research table v1,
# operator 2026-09-22: *"Timed research table"*). The reference's table is
# a two-slot box: the item in one slot, scrap in the other, ten seconds,
# and out comes a blueprint — paper you can carry, trade or lose, and
# right-click to learn. The coin and the sample are taken when the research
# LANDS, so a table raided mid-research spills both whole.
[table]
blueprint = "item.blueprint"
seconds = 10

# --- what may be learned ------------------------------------------------
#
# `[[research]] item` is the thing you consume; the recipe it unlocks is
# the one that OUTPUTS that item, resolved at bake. The file never names a
# recipe id, so the two cannot drift, and a row for an item nothing crafts
# is a bake error rather than a coin sink that unlocks nothing
# (`bake_research`). A recipe marked `blueprint` with no row here is the
# same error from the other end and `validate::structural` refuses it:
# that combination is a recipe nobody could ever craft.
#
# **Which rows exist is the reference's own split** (operator, 2026-09-22:
# *"It needs to be just like Rust survival game"*, answered "Rust's split").
# Eleven of our recipes are learned there and nothing else is; every bench,
# the research table, gunpowder, metal arrows, the crossbow and the large
# box are KNOWN from the start there, and so here (`reference/BLUEPRINTS.md`
# §1, 42 item pages fetched whole). What the tree gates is the NEXT tool —
# the metal hatchet, the pickaxe — never the first one, so the circle this
# file once warned about (gate the hatchet you need to gather the wood to
# build the bench to research the hatchet) cannot close: stone tools are
# default and the metal ones are one bench and 30 junk away.
#
# **Every price is the item page's research price**, the Nov 2025 rarity
# ladder (15 / 30 / 60 / 120). **The tree charges the same number per node**
# — one column serves both verbs. Their devblog cut *"tech tree and research
# costs"* together and rusthelp/rustly print node = research price; the
# wiki's flat 125/250/500 per bench loses `reference/BALANCE.md` §6.3 and is
# on record in `DECISIONS.md` §open as the one-line flip. So the tree costs
# more only as the PATH: a revolver is 30 at a table with one in hand and 60
# through the tree (pistol ammunition first).
#
# **`requires` is the tree, one per bench and derived, not authored**
# (`reference/BLUEPRINTS.md` §9.3): a row's parent is its nearest ancestor in
# THEIR chain that we also ship AND that unlocks at the same bench of OURS;
# with none it is a root, hanging off the bench in the panel. Their trees are
# independent per bench and ours are too — `validate::structural` refuses a
# `requires` that crosses a tier. Which bench a row unlocks at is OUR station
# (`research::node_tier`): the spoken bench ladder keeps the revolver and
# pistol ammunition at workbench 2 and the satchel at 3 (theirs are all 1),
# because the satchel is the top of our raid ladder — `BLUEPRINTS.md` §9.2.
#
# Two roads read this table: the research TABLE takes a looted sample plus
# the cost and ignores `requires` entirely — research what you loot, into
# paper — and the tree at a workbench takes the cost alone, along these
# edges, at a bench of the recipe's tier, and teaches on the spot.

# --- workbench 1 --------------------------------------------------------

# Their chain: Salvaged Hammer → Hatchet. The hammer is not ours, so a root.
[[research]]
item = "item.hatchet_metal"
cost = 30

# Their chain: Salvaged Hammer → Engineering Workbench → Pickaxe — NOT behind
# the hatchet, which is what a guess made before the pages were read said.
[[research]]
item = "item.pickaxe_metal"
cost = 30

# Their large medkit (and the syringe before it); both learned at 30. Ours is
# a workbench 1 recipe, so it roots the first tree rather than the second.
[[research]]
item = "item.medkit"
cost = 30

# Their chain: … Hatchet → Wooden Ladder → Wooden Barricade → Barbed Wooden
# Barricade → Wooden Floor Spikes → Wood Shutters, so the nearest ancestor we
# ship is the hatchet. Hand-crafted, and still a node in the first tree —
# theirs sits in WB1's tree with no bench to craft it, like ours.
[[research]]
item = "item.window_shutters"
cost = 15
requires = "item.hatchet_metal"

[[research]]
item = "item.window_bars_metal"
cost = 30
requires = "item.window_shutters"

# --- workbench 2 --------------------------------------------------------

# Their pistol bullet descends from the pickaxe, which is our tier 1: a
# cross-tier link, so a root of the second tree.
[[research]]
item = "item.pistol_ammo"
cost = 30

[[research]]
item = "item.revolver"
cost = 30
requires = "item.pistol_ammo"

# Their chain: Hazmat Suit → Boots → Coffee Can Helmet → Road Sign Jacket;
# none of those is ours.
[[research]]
item = "item.armor_roadsign_body"
cost = 30

# Their chain: Longsword → Salvaged Axe → Salvaged Icepick → embrasures →
# Strengthened Glass Window; none ours.
[[research]]
item = "item.window_glass"
cost = 30

[[research]]
item = "item.garage_door"
cost = 30
requires = "item.window_glass"

# --- workbench 3 --------------------------------------------------------

# Their satchel sits behind the beancan and the revolver, both below our
# third rung, so it roots the third tree alone. 60: rare, the dearest row.
[[research]]
item = "item.satchel_charge"
cost = 60
