# Gates · content/research.toml — the blueprint table (CONTENT.md §1,
# research). The sink OBOL exists for: you find the thing, you take it to a
# table with a fistful of coin, and from then on you can make it yourself.
# The sim's side is `sim-core/research.rs`; every number here is a knob with
# this file as its documented default (DECISIONS.md §open, "research v0").
#
# **What research is paid in, named here rather than assumed in code.**
# `sim-core` receives an item index and never learns it is currency —
# `DESIGN.md` §3.1's coin stays out of `crates/` the same way every other
# number does. And to be clear about which OBOL this is: the carried,
# item-stack kind, which is scrap (operator, 2026-08-10). Nothing in this
# file touches a wallet, a ledger or a chain.
[coin]
item = "item.obol"

# --- what may be learned ------------------------------------------------
#
# `[[research]] item` is the thing you consume; the recipe it unlocks is
# the one that OUTPUTS that item, resolved at bake. The file never names a
# recipe id, so the two cannot drift, and a row for an item nothing crafts
# is a bake error rather than a coin sink that unlocks nothing
# (`bake_research`). A recipe marked `blueprint` with no row here is the
# same error from the other end and `validate::structural` refuses it:
# that combination is a recipe nobody could ever craft.
#
# **`requires` is the ladder, and it is a floor rather than a free hand**
# (2026-08-15). A row may name blueprints that must already be held; the
# ids resolve at bake into `Player::known`'s own bits. What may NOT happen
# is the tree disagreeing with the recipes: if a blueprint-gated recipe
# consumes another blueprint-gated item, that edge is already a fact of the
# data and `validate::structural` refuses a row that omits it. Authoring
# MORE edges than the recipes imply is a design call and stays legal — the
# revolver behind gunpowder is the obvious candidate and is deliberately
# NOT written here, because it is a knob nobody has spoken
# (`DECISIONS.md` §open, "research ladder v0").
#
# **Which rows are gated is the whole design decision, and it is small on
# purpose.** Only the powder era — the things a player would go raiding
# for — is behind research; the whole T0 and workbench ladder stays open,
# because gating the hatchet you need to gather the wood to build the bench
# to research the hatchet is the kind of circle a tech tree gets wrong
# once and never lives down. Everything here is reachable as loot before it
# is craftable (`content/loot.toml`: the crate table pays gunpowder, the
# medkit, pistol ammo and metal arrows), which is what makes the verb a
# reason to walk to the haven rather than a tax on crafting.
#
# **The prices are ours** (`reference/RIPLIST.md` §2 row 7 sourced theirs
# at page tier 2026-08-14: pre-Oct-2025 was 75/125/250/500, post-cut is
# 15/30/60/120 — both priced against a ~10-scrap barrel where ours pays
# ~0.85 obol, so neither lands raw). The anchor is the recycler: a
# component pays 1–2 obol, a barrel rolls 1–2 components, so 20 is a
# handful of barrels and 75 is a deliberate trip. The ladder is 20 / 40 /
# 75 — reachable, a session, a project — and it moves with the faucet
# counts or the ratio breaks (DECISIONS.md §open, "OBOL faucet v0").
#
# **`requires` is the tech tree** (tech tree v0 — spoken 2026-08-14, the
# pre-Oct-2025 era 2026-08-15). Two verbs read this table: the research
# TABLE takes a looted sample plus the cost and ignores `requires`
# entirely — research what you loot — and the tree verb at a workbench
# takes the cost alone, along these edges, at a bench of the recipe's
# tier. One cost column serves both, the reference's own pre-Oct-2025
# arrangement; the tree "costs more" only as the path total (a satchel
# via the tree is gunpowder's 40 + its own 75 = 115, against 75 with a
# sample in hand — and there IS no satchel sample, which is the point:
# the tree is how the two rows nothing drops became learnable at all).
# Three roots, two paths: powder (gunpowder → revolver / satchel) and
# field kit (medkit → roadsign plate); metal arrows stand alone.

# 20 — a handful of barrels. The first thing most players will research,
# and cheap because it is the one that teaches what the verb IS.
[[research]]
item = "item.medkit"
cost = 20

[[research]]
item = "item.arrow_metal"
cost = 20

# 40 — a session. The powder chain proper.
[[research]]
item = "item.gunpowder"
cost = 40

[[research]]
item = "item.armor_roadsign_body"
cost = 40
requires = "item.medkit"

# 75 — a project, and both of these are what a raid is made of. The
# revolver is also a rare barrel drop (`loot.toml`), so the fastest route
# to owning one is still luck; this is the route to owning several.
[[research]]
item = "item.revolver"
cost = 75
requires = "item.gunpowder"

[[research]]
item = "item.satchel_charge"
cost = 75
requires = "item.gunpowder"
