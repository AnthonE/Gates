# --- Roadside junk (Rust's roadside spawns: oil barrels, road signs, food
# boxes, junk piles; `terrain.rs` "Roadside junk"). ---------------------------

# Rust's red oil barrel: smashed, pays fuel. Theirs is 5–10 low grade and
# 15–20 crude, both certain; we have no crude, so its share is a second
# stack of low grade.
[[loot_table]]
id = "loot.oil_barrel"
container = "oil_barrel"
rolls_min = 1
rolls_max = 1
hits = 3
guaranteed = [{ item = "item.lowgrade", count_min = 5, count_max = 10 }]
entries = [
    { item = "item.lowgrade", weight = 1, count_min = 5, count_max = 10 },
]

# A road sign, smashed: theirs pays one Road Signs and one Metal Pipe, both
# at 100 %, and nothing else — 12 junk once recycled. The single weighted row
# is the second certain item (a table must draw at least once).
[[loot_table]]
id = "loot.roadsign"
container = "roadsign"
rolls_min = 1
rolls_max = 1
hits = 3
guaranteed = [{ item = "item.metal_pipe", count_min = 1, count_max = 1 }]
entries = [
    { item = "item.road_signs", weight = 1, count_min = 1, count_max = 1 },
]

# Rust's roadside food box: opened, pays food and nothing else — their corn
# and their tins (the cooked meat). Forage is not in it: berries and
# mushrooms are picked.
[[loot_table]]
id = "loot.food"
container = "food"
rolls_min = 2
rolls_max = 3
hits = 1
entries = [
    { item = "item.corn", weight = 10, count_min = 2, count_max = 4 },
    { item = "item.cooked_meat", weight = 8, count_min = 1, count_max = 3 },
]
