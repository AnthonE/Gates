# Gates · content/loot.toml — container archetype → weighted entries
# (CONTENT.md §5). Barrels are components-weighted (the coast-road reason).
# The revolver is a rare crate drop, theirs a brown crate's (it was a barrel
# drop per DECISIONS.md §open "revolver: barrel drop or craft-only" until
# 2026-10-17; their barrel carries no gun). Respawn timing is the §open
# node/barrel knob, not a content field.
#
# `hits` is how many swings open the container. It IS a content field —
# re-pricing the walk between barrels is a balance pass — and its value is
# the §open row "barrel smash hits", proposed, not yet spoken.
#
# The three tables are the three stops of a walk, and the ORDERING between
# them is structural rather than a balance call: `barrel` is what the coast
# road's shoulder pays, `cache` is what a waystation pays, `crate` is what the
# haven pad pays, and each has to be worth going further for than the one
# below it. `ci/haven_prize.mjs` gates that ordering — richer rolls, more
# expected items per container AND per site, and at least one item each tier
# reaches that the tier below does not — without pinning which items or how
# many. Rebalance freely inside it.
#
# `cache` exists because until 2026-08-05 a waystation placed the pad's own
# `Occupant::CrateSlot` and therefore drew `loot.crate`: per container the
# lesser tier paid exactly what the destination paid, and only geometry
# separated them. A container's KIND is the only thing a table is selected by
# (`bake.rs`: the name is content, the index is `loot::LOOT_*`), so the tier
# needed its own kind before it could have its own price.
#
# `crate` had no spawn site at all until the pad placed `Occupant::CrateSlot`
# (TERRAIN.md §1 stage 8): it was parsed, validated and content-hashed with
# nothing in the world able to produce its container. Both are **openable
# since world containers v0** (2026-08-14, `sim-core/worldcont.rs`), so these
# two tables are reachable loot and not merely reachable content.
#
# **Every table pays guaranteed junk** (loot guaranteed column v0, operator
# 2026-09-22: *"Crafting system should use Junk [as our] scrap. It needs to
# be just like Rust"*). The reference prices its whole container ladder in a
# certain scrap payout — barrel 2, basic crate 3, brown/tools crate 5,
# military crate 8, elite 25, every one at 100 % (`reference/RIPLIST.md`
# row 1i) — and junk is our scrap (operator, 2026-08-10). Our three tiers
# take the three of theirs a road walk passes: the road's barrel is their
# barrel, a waystation is their brown crate, the haven pad is their military
# crate.
#
# **And only what theirs carry** (operator, 2026-10-17: *"Fix loot table to
# be like Rust survival"*; rusthelp.com/world/<container> and
# wiki.facepunch.com, read 2026-10-17). Their containers pay scrap,
# components, and gear: **no raw materials** — no cloth, fat, metal
# fragments, sulfur or gunpowder (RIPLIST row 1i's "second finding"). Those
# come from hemp, animals, the furnace and the bench, as theirs do; low
# grade is the oil barrel's, and a tool crate's now and then. Each row is
# weighted so its chance per container is about theirs. A row's chance is
# `mean rolls × weight ÷ total weight`, and the tables below total 1,000.
#
# Their tables also carry clothing, deployables, HQM, blueprint fragments,
# targeting computers and a long tail of guns we do not have. The guns'
# share goes to the few we do (pistol rounds, arrows, the revolver, the
# road sign jacket, medkits); the rest is simply left out, and the roll
# counts are set so what remains still pays about what theirs does.
# Recycled, a barrel pays ~4.4 junk, a waystation ~26, the haven pad ~33.

[[loot_table]]
id = "loot.barrel"
container = "barrel"
rolls_min = 1
rolls_max = 1
hits = 3

# Their blue and yellow barrel: 2 scrap, certain, and one part. Weights are
# per-barrel chances in ‰: the metal parts, the blade and the propane tank
# at theirs; the textiles take the third of their table that is clothing,
# which their recycler turns into cloth as ours turns these.
guaranteed = [{ item = "item.junk", count_min = 2, count_max = 2 }]

entries = [
    { item = "item.rope", weight = 200, count_min = 1, count_max = 3 },
    { item = "item.tarp", weight = 170, count_min = 1, count_max = 2 },
    { item = "item.sewing_kit", weight = 170, count_min = 3, count_max = 5 },
    { item = "item.metal_blade", weight = 154, count_min = 1, count_max = 1 },
    { item = "item.propane_tank", weight = 80, count_min = 1, count_max = 1 },
    { item = "item.gears", weight = 14, count_min = 2, count_max = 3 },
    { item = "item.metal_spring", weight = 14, count_min = 1, count_max = 2 },
    { item = "item.sheet_metal", weight = 14, count_min = 1, count_max = 2 },
    { item = "item.metal_pipe", weight = 14, count_min = 1, count_max = 5 },
    { item = "item.road_signs", weight = 14, count_min = 2, count_max = 4 },
    { item = "item.semi_body", weight = 14, count_min = 1, count_max = 1 },
