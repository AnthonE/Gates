# Gates · content/gatherables.toml — node/tree archetypes → per-tool yield
# (CONTENT.md §1). Archetypes name sim-core scatter occupants (terrain.rs).
# `hand` is the bare-hand row — a naked spawn bootstraps by punching stone
# for a rock.
#
# **A node's whole payout is `hits × yield_per_hit[tool]`, and the two
# percentages below move WHEN it arrives, never how much** (operator,
# 2026-08-09; the reference's own model, reference/RIPLIST.md §4.3):
#
# - `weak_spot_bonus_pct` — the glint / the X (DESIGN.md §2). A marked
#   hit spends that much extra of the node's budget and is paid pro rata,
#   so skill buys SPEED. Facepunch: "you will not actually earn more
#   resources, but by using skill and good aim you can harvest the ore
#   faster." It used to pay 1.5× yield here, which made the skilled
#   player richer instead of quicker.
# - `finish_bonus_pct` — the share withheld from every swing and paid to
#   whoever lands the last one, so walking away from a half-struck node
#   costs you. Theirs: ~20% on an ore node's final strike, half a tree's
#   wood when it falls.
#
# The farm band (balance.toml, CONTENT §4 anchor 3): archetypes listed in
# `banded_nodes` must total 250–1000 units over 8–12 hits with a tier-1 tool.
#
# **The totals below are the reference game's, taken 2026-08-10**
# (`reference/RIPLIST.md` §2 row 1, the standing instruction in
# `reference/BALANCE.md` §6; operator, 2026-08-10). Two things about the
# shape of that take, because they decide every row:
#
# - **We take the TOTAL and keep our own hit count.** Their per-node total
#   is EXACT and published; their hit count is not, and cannot be — the
#   marker made hits-to-clear a function of aim, so modern sources publish
#   durations only (§4.1a). Our schema declares `hits × yield_per_hit`, so
#   a total is takeable on its own. `hits` stays 10 everywhere, inside the
#   band it has always been in, and `yield_per_hit` is `total ÷ 10`
#   rounded — which lands each total within ~1.3% of theirs.
# - **A worse tool takes LESS of the same node** (§4.2). The pool is fixed
#   per node *and tool*, not per node: their stone pickaxe draws ~0.8 of
#   what the best tool draws, measured twice on two different nodes and
#   agreeing to within 0.014. Ours already had that shape by another
#   route; what changes here is the scale and the ratio.
#
# `hand` has no reference row on any node — bare hands gather nothing
# there — so every hand row keeps our own relation to the rock (half of
# it on wood and stone, 0.6 on the ores) rather than inventing a source.

[[gatherable]]
id = "gather.tree"
archetype = "tree"
output = "item.wood"
hits = 10
weak_spot_bonus_pct = 50
# Half the tree's wood arrives when it falls (their Devblog 187 split the
# tree's payout exactly this way). reference/RIPLIST.md §4.3.
finish_bonus_pct = 50

# Their large-tree totals, per tool (RIPLIST §4.1a, EXACT per tool): rock
# 500, stone hatchet 810, metal hatchet 867. Wood is the one resource
# whose total is set by species and size rather than by tool alone — large
# beech/oak 1000 at the very best tool, smaller pine/palm ~¾, dead logs
# ~¼ (§4.1b) — and we have one `tree` archetype, so this row is their
# LARGE tree and the species spread is a terrain question we do not model.
# Note the wood ladder is much flatter than the ore ladder: 810 → 867 is
# 0.93, where a stone pickaxe draws 0.79 of a metal one.
[gatherable.yield_per_hit]
hand = 25
"item.rock" = 50
"item.hatchet_stone" = 81
"item.hatchet_metal" = 87

# The understory: mushrooms are the forest floor's food (CONTENT §2), and
# the schema has no forest-floor archetype to scatter them on — a node kind
# is a sim occupant (`terrain.rs`), which is code and not content. The
# honest reach is the tree's own `secondary`: the swing that fells the
# forest pays what grows under it, flat like the bush's berries because
# picking is not chopping. per_hit 1 is the floor a secondary can pay; a
# whole tree still totals 10 mushrooms, so a wood farmer eats — the
# standalone forest-floor pickup stays owed (NOW.md §5).
[gatherable.secondary]
output = "item.mushrooms"
per_hit = 1

[[gatherable]]
id = "gather.stone_node"
archetype = "stone_node"
output = "item.stone"
hits = 10
weak_spot_bonus_pct = 50
# The final strike pays a fifth of the node — their anti-cherry-picking
# rule (Devblog 166, ~20%). reference/RIPLIST.md §4.3.
finish_bonus_pct = 20

# Their stone node, per tool (RIPLIST §4.1a, EXACT): pickaxe 1000, stone
# pickaxe 794, rock 375. The 1000 is the largest single move in this file
# — 3.3× what this node used to pay — and it is the row that forced
# `node_yield`'s ceiling up. Read §0's friction frame before reading it as
# generosity: their 1000 is priced for a world where you are shot off the
# node, and ours is not.
[gatherable.yield_per_hit]
hand = 19
"item.rock" = 38
"item.pickaxe_stone" = 79
"item.pickaxe_metal" = 100

[[gatherable]]
id = "gather.metal_node"
archetype = "metal_node"
output = "item.metal_ore"
hits = 10
weak_spot_bonus_pct = 50
# The final strike pays a fifth of the node — their anti-cherry-picking
# rule (Devblog 166, ~20%). reference/RIPLIST.md §4.3.
finish_bonus_pct = 20

# Their metal node, per tool (RIPLIST §4.1a, EXACT): pickaxe 600, stone
# pickaxe 485, rock 250. Theirs also pays a flat **2 HQM**, available only
# on the finishing strike and only to a proper tool — we have no HQM tier
# to gate, so that half is not taken (§4.3b names it as the place HQM
# belongs if a tier ever lands).
[gatherable.yield_per_hit]
hand = 15
"item.rock" = 25
"item.pickaxe_stone" = 49
"item.pickaxe_metal" = 60

[[gatherable]]
id = "gather.sulfur_node"
archetype = "sulfur_node"
output = "item.sulfur_ore"
hits = 10
weak_spot_bonus_pct = 50
# The final strike pays a fifth of the node — their anti-cherry-picking
# rule (Devblog 166, ~20%). reference/RIPLIST.md §4.3.
finish_bonus_pct = 20

# Their sulfur node, per tool (RIPLIST §4.1a): pickaxe 300, stone pickaxe
# 257, rock 100. **The tier-1 row does not move — ours was already 300**,
# and that is the one node where we and the reference already agreed. The
# 300 was DISPUTED for two passes against a 200 camp and settled
# 2026-08-09 by scoring each source on cells we could already check: the
# page claiming 200 also calls stone 750 and metal 500, both wrong against
# EXACT figures. What changes here is only the ladder below the best tool.
[gatherable.yield_per_hit]
hand = 6
"item.rock" = 10
"item.pickaxe_stone" = 26
"item.pickaxe_metal" = 30

# Bush: an instant hand pickup, not a swung node — outside the node band.
# It is also the island's only food, which is why `validate::structural`
# refuses content whose survival clock has nothing that pays a consumable
# (DECISIONS.md §open, "food you can get"). The berries are a `secondary`:
# flat, no tool row and no weak-spot bonus, because picking is not chopping.

[[gatherable]]
id = "gather.bush"
archetype = "bush"
output = "item.cloth"
hits = 1
weak_spot_bonus_pct = 0

[gatherable.yield_per_hit]
hand = 10

[gatherable.secondary]
output = "item.berries"
per_hit = 5
