# --- the farm (farming v2, `sim-core/farm.rs`) ---------------------------
#
# One seed is one plant. A planter has six spots; a plant grows by daylight
# under open sky, ripens, stays ripe for `ripe_seconds`, then dies and
# withers after `dying_seconds`. Picking it pays the crop and kills it. Its
# pace is the worst of its water, its soil and the air (Rust's health).
#
# Water is in plant-seconds: one plant drinking for one second. A skin is
# `skin_water` of it and is poured into the planter's tank once a plant
# thirsts, so one skin waters a full bed of six for 600 s and a 900 s corn
# bed takes a skin and a half. `rain_water` is what full rain banks in an
# open planter each second: a full bed is self-sufficient in a downpour.
#
# `stage_pct` is each growing stage's share of the grow: seed, seedling,
# sapling, crossbreed, mature, fruiting (then ripe).
#
# Genes: six slots, each G (faster), Y (more yield), H (hardier against
# poor soil and cold), W (thirstier) or X (nothing). A blank seed rolls a
# good gene per slot `good_gene_pm` of the time, else a W `bad_w_pm` of
# the time, else an X. Entering crossbreed, a bed plant's slots take the
# heaviest letter of its touching neighbours of the same crop (W and X
# weigh 10, G, Y and H 6) when it outweighs its own. A clone (cut at
# sapling to mature) is the crop's seed carrying the plant's genes.
[farm]
water = "item.waterskin"
skin_water = 3600
planter_water = 7200
rain_water = 6
stage_pct = [5, 15, 20, 5, 25, 30]
ripe_seconds = 10800
dying_seconds = 1800
good_gene_pm = 500
bad_w_pm = 500
g_pct = 10
y_pct = 10
h_pct = 10
w_pct = 25
# A clone cut pays its crop's `clones`, and one more seed for every
# `clone_y_per` Y genes (Rust's two).
clone_y_per = 2
# The open ground (Rust's fallback to a planter): a ground plant holds
# `ground_water` plant-seconds of its own and banks `ground_rain` a second
# in full rain. Its pace at best is its biome's soil, per mille; a biome
# left out (beach, highland, desert, the Verdigris) takes no seed.
ground_water = 1800
ground_rain = 3
soil = { meadow = 550, forest = 450 }
# The water catcher: a barrel of `catcher_water` plant-seconds that banks
# `catcher_rain` a second in full rain, tops up a waterskin in its slot at
# `skin_water` the full skin, and every 5 s pours `catcher_flow` a second into
# each planter and growing ground plant within `catcher_reach_cm` of it.
catcher_water = 10800
catcher_rain = 20
catcher_flow = 12
catcher_reach_cm = 300

# A pick pays `count` of `yield` at full health, fewer for a plant that grew
# thirsty, cold or in poor soil (never none).
[[crop]]
id = "corn"
look = "corn"
seed = "item.corn_seed"
yield = "item.corn"
count = 4
seconds = 900
clones = 2

[[crop]]
id = "hemp"
look = "hemp"
seed = "item.hemp_seed"
yield = "item.cloth"
count = 10
seconds = 600
clones = 2

# The second wave. A potato is a low bush that grows a little faster than
# corn and pays more of something plainer; a pumpkin is the slow one, two
# big meals off a sprawling vine; a berry bush is the quick one, a handful
# of water-rich berries. Each one's seed comes back when its crop is eaten
# (`consumables.toml` `leaves`), the berry's only now and then.
[[crop]]
id = "potato"
look = "potato"
seed = "item.potato_seed"
yield = "item.potato"
count = 5
seconds = 750
clones = 2

[[crop]]
id = "pumpkin"
look = "pumpkin"
seed = "item.pumpkin_seed"
yield = "item.pumpkin"
count = 2
seconds = 1200
clones = 2

[[crop]]
id = "berry"
look = "berries"
seed = "item.berry_seed"
yield = "item.berries"
count = 6
seconds = 600
clones = 2
