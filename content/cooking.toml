# Gates · content/cooking.toml — what an oven does (CONTENT.md §1, oven).
# The campfire and the furnace are one thing in the sim (`sim-core/oven.rs`)
# for the reason they are one class in the reference — every cooking hook
# there hangs off `BaseOven` — so what separates them is which rows name
# which `station`. Every number here is a knob with this file as its
# documented default (DECISIONS.md §open, "oven v0").

# What burns, and what it leaves behind. One fuel for the whole game: the
# reference has an `ItemModBurnable` per item and we have wood, because a
# second burnable is a content row and not a code change when one exists.
#
# `seconds` is how long ONE unit burns. The reference's campfire eats about
# 20 wood a minute, which is this number exactly.
#
# `byproduct_pct` is hundredths of a unit banked per unit burned, paid whole
# when the bank passes 100. The reference rolls ~75% per wood; we bank 75
# and pay deterministically, so a hundred wood yields the reference's
# expectation with nothing random inside `state_hash` (wall 5).
[fuel]
item = "item.wood"
seconds = 3
byproduct = "item.charcoal"
byproduct_pct = 75

# --- cook rows ----------------------------------------------------------
#
# `[[cook]] input → output` at `station` (`fire` | `furnace`) over
# `seconds`.
#
# **This table shipped empty for one day.** The comment here read "there are
# none yet, and that is a fact about the island rather than about the oven"
# — cooking wanted a raw food and nothing in the world paid one. The animal
# roster (`content/mobs.toml`, the same day) pays one, and closing it was
# exactly what that comment predicted: **one row, no code.** That is the
# table shipping before its first row working as intended, and it is worth
# leaving on the record rather than tidying away.
#
# 15 seconds on a fire, Rust's (wiki.facepunch.com/rust/Item/campfire: every
# raw meat cooks in 15 s on a camp fire) — a real wait beside the fuel's 3 s
# a unit, and by the fire is where comfort mends you while you wait.
# A furnace deliberately does not cook meat: separating the two stations is
# the only job the `station` column has, and smelting is what a furnace is
# for.
[[cook]]
input = "item.raw_meat"
output = "item.cooked_meat"
station = "fire"
seconds = 15

# The burnt state, exactly as the oven's header predicted it: a cook row
# whose input is the cooked item, so overcooking is content and not a
# mechanic. Since the camp fire took Rust's slots (fuel / input / output,
# `sim-core/oven.rs`) only the grill cooks: a meal comes off into the output
# and stays cooked, and it burns only if it is put back on the grill, where
# another cook's worth of time leaves it barely food (`consumables.toml`).
# Same 15 s as the cook above.
[[cook]]
input = "item.cooked_meat"
output = "item.burnt_meat"
station = "fire"
seconds = 15

# Salt water boils fresh (the water pass): the reference's campfire water
# purifier, without its separate deployable — a vessel of sea water on the
# grill comes off drinkable. The time is the price, and the wood that burns
# while it boils: the reference purifies 4:1 over a few minutes, and a skin
# here is half a minute. A jug holds lake water only. The row pays its input
# back: a waterskin of sea water comes off fresh, in place, and a fresh or an
# empty one does not cook (`oven::step`).
[[cook]]
input = "item.waterskin"
output = "item.waterskin"
station = "fire"
seconds = 30


# --- the furnace ----------------------------------------------------------
#
# Rust's smelt: ore goes into the furnace with wood, you light it, and every
# slot holding ore smelts in parallel. 5 s a unit per slot, so a furnace with
# five or six ore stacks runs about one ore a second, roughly Rust's small
# furnace. The craft-menu rows in `recipes.toml` still work beside a furnace
# (the bots use them); this is the way a Rust player reaches for first.
[[cook]]
input = "item.metal_ore"
output = "item.metal_frags"
station = "furnace"
seconds = 5

[[cook]]
input = "item.sulfur_ore"
output = "item.sulfur"
station = "furnace"
seconds = 5

# --- the recycler -------------------------------------------------------
#
# `station = "recycler"` is the third converter (recycler v0). It burns
# nothing, so no fuel row applies to it, and it is the first thing on the
# island that pays you for something you did not farm: the coast road's
# barrels drop components, and until now a gear was a crafting reagent for
# two recipes and dead weight otherwise.
#
# **Several rows may share one input and they all fire together**, off one
# slot timer — which is how a gear pays a material AND a coin on one pass
# (the JUNK block below). The bake holds such a set to one `seconds` and
# refuses two rows paying the same output (`validate::structural`).
#
# **The yields are theirs as of 2026-08-18** (`reference/RIPLIST.md` §1f).
# This block used to open "the yields are ours, and that is a gap rather
# than a choice" — nobody had researched what their recycler pays. Someone
# has now, at page tier: `wiki.facepunch.com/rust/item/{gears,rope,tarp}`
# each carry a **Recycle** table, and every row below is that table's
# `Recycler` column read whole. EXACT, and the same pages score 4/4 on
# cells we already hold (the four stack sizes, taken off a different host
# in §1e-b) — `BALANCE.md` §6.3 rung 1 on a source we came to for
# something else.
#
# **Refused, and it is a missing tier rather than a preference**: each
# page also lists a *Safe Zone Recycler* column at two thirds (gears
# 10 + 8, rope 12, tarp 40). Ours is a craftable machine you own, which is
# their full-rate one; there is no safe zone here to hold the other rate.
#
# What the old derivation feared has not happened. It priced the gear off
# our own anchor — a component is 4 road-minutes (`balance.toml`
# `component_minutes`) against metal ore at 30/min, so full farm parity
# would be ~120 fragments — and refused parity because the road would beat
# the ore node. Theirs pays **15**, an eighth of parity, so the gradient
# the old number was protecting survives the take without being defended.
# The tarp is the one that moved far: 60 cloth is 3.0 farm-minutes at
# cloth's 20/min against its 4 road-minutes, so a tarp is now the richest
# of the three by that measure, and the rope the poorest.
#
# 5 s each: fast enough that a full hopper clears while you sort the rest
# of the run, slow enough that you put it down and do something else.
[[cook]]
input = "item.gears"
output = "item.metal_frags"
count = 15
station = "recycler"
seconds = 5

[[cook]]
input = "item.rope"
output = "item.cloth"
count = 18
station = "recycler"
seconds = 5

[[cook]]
input = "item.tarp"
output = "item.cloth"
count = 60
station = "recycler"
seconds = 5

# --- the JUNK faucet ------------------------------------------------------
#
# **JUNK is scrap** (operator, 2026-08-10: *"what the hell is obol turned off
# for its just like scrap"*). It is an item you carry, drop on death and
# spend at a research table — no wallet, no ledger, nothing redeemable. The
# thing `ALPHA.md` §2 stages is the CLAIM RAIL (a banked balance keyed to a
# wallet, and its merkle export), which is a different thing that shares a
# name; an item stack in a save file cannot be cashed out, so there was
# never a token risk here to gate against.
#
# This rides the SAME input as one of the three rows above, which is what
# multi-row conversion is for: a gear becomes 15 fragments AND 12 junk on
# one 5 s timer, rather than the player choosing which machine to feed. The
# `seconds` must match the row it shares an input with — the bake refuses
# otherwise.
#
# **Theirs too, and it is one row rather than three** (§1f). Their gears
# return **12 scrap**; their rope and tarp return cloth and no scrap at
# all, so the two coin rows that used to sit here are gone rather than
# zeroed — a row paying nothing is an inert row and `validate::structural`
# refuses one. Coin concentrating on the one component that was *crafted
# out of* coin is their design, not an accident of the table: the gears
# page prices a gear at 100 scrap and hands 12 of it back.
#
# **What this does to the faucet, derived off `loot.toml` rather than
# asserted.** A barrel is 1–2 rolls over 99 weight; the three components
# used to pay 0.848 junk a barrel between them and the gear alone now pays
# **2.727**, a 3.2× faucet. Theirs pays ~2.42 scrap a barrel (2 direct at
# 100 %, plus gears 2–3 at 1.4 % recycled) — so after this take **one junk
# buys about what one scrap buys**, within 13 %.
#
# **Which is why no price in `research.toml` or `recipes.toml` moves, and
# that is the surprising half.** Both files justify their own junk prices
# against "a ~10-scrap barrel where ours pays ~0.85" — the 0.85 was right
# and **the ~10 was never measured and is wrong**; the page says 2.42.
# Priced in barrels against the four researchable items we both have
# (their Research Table column, page-read the same day — HV arrow 15,
# revolver 30, satchel 60, gunpowder 120), our ladder cost **2.66× theirs
# before this take and 0.83× after it**. The faucet is what brought the
# research economy into their range at all, and it did it without moving
# a price. `DECISIONS.md` §open "JUNK faucet v0" carries the row; the
# ratio clause it states ("move these with the research prices or the
# ratio breaks") held, and this is what holding looks like.
#
# **What does NOT match is the shape, and it is the next question rather
# than this row's.** Their spread is 8× (15 → 120) and ours is 3.75×
# (20 → 75), and they disagree on which end gunpowder belongs at: it is
# their most expensive blueprint and our middle rung, while their revolver
# is cheap (30) against our 75. Ours is a compressed ladder over roughly
# the right total — a `research.toml` row for a later pass, not a fallout
# of this one.
[[cook]]
input = "item.gears"
output = "item.junk"
count = 12
station = "recycler"
seconds = 5

