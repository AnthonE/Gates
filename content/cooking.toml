# Gates · content/cooking.toml — what an oven does (CONTENT.md §1, oven).
# The campfire and the furnace are one thing in the sim (`sim-core/oven.rs`)
# for the reason they are one class in the reference — every cooking hook
# there hangs off `BaseOven` — so what separates them is which rows name
# which `station`. Every number here is a knob with this file as its
# documented default (DECISIONS.md §open, "oven v0").

# What burns, and what it leaves behind. One fuel for the whole game: the
# reference has an `ItemModBurnable` per item and we have wood, because a
# second burnable is a content row and not a code change when one exists.
#
# `seconds` is how long ONE unit burns. The reference's campfire eats about
# 20 wood a minute, which is this number exactly.
#
# `byproduct_pct` is hundredths of a unit banked per unit burned, paid whole
# when the bank passes 100. The reference rolls ~75% per wood; we bank 75
# and pay deterministically, so a hundred wood yields the reference's
# expectation with nothing random inside `state_hash` (wall 5).
[fuel]
item = "item.wood"
seconds = 3
byproduct = "item.charcoal"
byproduct_pct = 75

# --- cook rows ----------------------------------------------------------
#
# `[[cook]] input → output` at `station` (`fire` | `furnace`) over
# `seconds`.
#
# **This table shipped empty for one day.** The comment here read "there are
# none yet, and that is a fact about the island rather than about the oven"
# — cooking wanted a raw food and nothing in the world paid one. The animal
# roster (`content/mobs.toml`, the same day) pays one, and closing it was
# exactly what that comment predicted: **one row, no code.** That is the
# table shipping before its first row working as intended, and it is worth
# leaving on the record rather than tidying away.
#
# 20 seconds on a fire, which is a real wait beside the fuel's 3 s a unit —
# long enough that you sit down, short enough that it is not a chore, and
# the first thing on this island that makes standing still worth anything.
# A furnace deliberately does not cook meat: separating the two stations is
# the only job the `station` column has, and smelting is what a furnace is
# for.
[[cook]]
input = "item.raw_meat"
output = "item.cooked_meat"
station = "fire"
seconds = 20

# The burnt state, exactly as the oven's header predicted it: a cook row
# whose input is the cooked item, so overcooking is content and not a
# mechanic. Leave the meal on a lit fire for another cook's worth of time
# and it is barely food (`consumables.toml`); the fire does not babysit.
# Same 20 s as the cook above — one cadence, so "come back within one
# cook of done" is the whole rule a player has to learn.
[[cook]]
input = "item.cooked_meat"
output = "item.burnt_meat"
station = "fire"
seconds = 20

# --- the recycler -------------------------------------------------------
#
# `station = "recycler"` is the third converter (recycler v0). It burns
# nothing, so no fuel row applies to it, and it is the first thing on the
# island that pays you for something you did not farm: the coast road's
# barrels drop components, and until now a gear was a crafting reagent for
# two recipes and dead weight otherwise.
#
# **Several rows may share one input and they all fire together**, off one
# slot timer — which is the whole reason this table can arm the economy
# without a line of code moving (see the OBOL block below). The bake holds
# such a set to one `seconds` and refuses two rows paying the same output
# (`validate::structural`).
#
# **The yields are ours, not the reference's, and that is a gap rather
# than a choice.** `reference/RIPLIST.md` has no recycler row — nobody has
# researched what theirs pays — so these are derived from our own anchor
# instead: a component is 4 road-minutes (`balance.toml`
# `component_minutes`) and metal ore farms at 30/min, so full farm parity
# would be ~120 fragments a gear. That is refused deliberately: it would
# make the road strictly better than the ore node and inverts the gradient
# nodes exist to hold. These sit at ~15 seconds of mining instead — enough
# that salvage is worth the pocket space, not enough to replace a pickaxe.
# Knob, PROPOSED, `DECISIONS.md` §open "recycler v0".
#
# 5 s each: fast enough that a full hopper clears while you sort the rest
# of the run, slow enough that you put it down and do something else.
[[cook]]
input = "item.gears"
output = "item.metal_frags"
count = 8
station = "recycler"
seconds = 5

[[cook]]
input = "item.rope"
output = "item.cloth"
count = 5
station = "recycler"
seconds = 5

[[cook]]
input = "item.tarp"
output = "item.cloth"
count = 8
station = "recycler"
seconds = 5

# --- the OBOL faucet, and it is OFF ------------------------------------
#
# `ALPHA.md` §2 stages the economy: **A1 (now) is faucets off — salvage
# drops components only.** Arming A2 is an operator act (`CLAUDE.md` loop
# discipline: a loop proposes, never performs), so the rows below are
# written out and commented out rather than described somewhere else in
# prose. Uncommenting them is the entire code change, which is the
# property the recycler was built to have: `oven.rs` cannot tell the
# difference between paying metal and paying a coin.
#
# They ride the SAME inputs as the three rows above, which is what
# multi-row conversion is for — a gear becomes 8 fragments AND 2 obol on
# one 5 s timer, rather than the player choosing which machine to feed.
# The `seconds` must match the row above it (the bake refuses otherwise);
# the counts are a knob nobody has spoken, and `DECISIONS.md` §open
# "OBOL faucet v0" is where they get decided, not here.
#
# [[cook]]
# input = "item.gears"
# output = "item.obol"
# count = 2
# station = "recycler"
# seconds = 5
#
# [[cook]]
# input = "item.rope"
# output = "item.obol"
# count = 1
# station = "recycler"
# seconds = 5
#
# [[cook]]
# input = "item.tarp"
# output = "item.obol"
# count = 1
# station = "recycler"
# seconds = 5
