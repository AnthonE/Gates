# Gates · content/consumables.toml — health/food/water deltas over seconds
# (CONTENT.md §1). Hunger is a minimal timer-drain at alpha (DESIGN.md §2);
# food resets the timer, health deltas apply over `seconds`.

[[consumable]]
id = "item.bandage"
health = 20
food = 0
water = 0
seconds = 4
# Rust's bandage: held, a click wraps it on (their `healDurationSelf`, 4 s)
# and switching away cancels it; it stops 50 of the bleeding.
use_seconds = 4
bleed = -50

[[consumable]]
id = "item.medkit"
health = 60
food = 0
water = 0
seconds = 8
# reference/WOUNDED.md §2.5: paid only on a failed roll, from the belt.
belt_recovery = true
# Rust's medkit stops all the bleeding.
bleed = -100

# `revive`: used on a downed body in reach (`Command::Treat`), it stands the
# body up at once, as a won roll does, and heals it by `health` (the
# reference's syringe, `reference/WOUNDED.md` §1). On yourself it is an
# ordinary heal. The numbers are ours: a small fast heal, under the bandage.
[[consumable]]
id = "item.syringe"
health = 15
food = 0
water = 0
seconds = 2
revive = true

# The Charcoal Tonic: Rust's anti-rad pills, ours. Charcoal steeped with
# mushroom draws 40% of the Verdigris meter out at once. It heals nothing: a
# heal would fold a bandage's or a medkit's ramp into its own, slower one
# (`survival::start_heal`). The water is what the eat verb reads
# (`ItemRow::eats`), and it is drunk at full water while there is green in
# the blood to draw.
[[consumable]]
id = "item.charcoal_tonic"
health = 0
food = 0
water = 5
seconds = 0
fel = -400

# Hydrating and calorie-poor, which is the reference's own split: meat
# feeds and barely wets, forage wets and barely feeds, and a player who
# eats only one of them dies of the other.
#
# `leaves` is what eating one leaves in your hand, `leaves_pm` per mille of
# the time (Rust's seeds-from-eating): a berry's seed is spat out a quarter
# of the time, a cob, a potato and a pumpkin always leave theirs.
[[consumable]]
id = "item.berries"
health = 0
food = 10
water = 20
seconds = 2
leaves = "item.berry_seed"
leaves_pm = 250

[[consumable]]
id = "item.mushrooms"
health = 3
food = 15
water = 5
seconds = 2

# Theirs, whole: 5 calories, 20 water, 3 health over time
# (rusthelp.com/items/cactus-flesh). The desert's drink.
[[consumable]]
id = "item.cactus_flesh"
health = 3
food = 5
water = 20
seconds = 2

[[consumable]]
id = "item.corn"
health = 0
food = 40
water = 20
seconds = 3
leaves = "item.corn_seed"
leaves_pm = 1000

# The second wave's food (`cooking.toml`'s potato and pumpkin crops). A raw
# potato is a plain filler, corn's poorer cousin that grows a little faster;
# a pumpkin is two meals and a drink, the slow crop's reward.
[[consumable]]
id = "item.potato"
health = 0
food = 25
water = 5
seconds = 3
leaves = "item.potato_seed"
leaves_pm = 1000

[[consumable]]
id = "item.pumpkin"
health = 0
food = 80
water = 30
seconds = 4
leaves = "item.pumpkin_seed"
leaves_pm = 1000

# The best food on the island, and the only one that costs a walk: a kill, a
# carry, a fire and a wait (`cooking.toml`). It is the one consumable that
# heals as well as feeds — 10 hp over 5 s is under the bandage's 20 and is
# meant to be, because a bandage is a crafted answer to damage and this is a
# meal that happens to help. **`item.raw_meat` is absent on purpose**: the
# uncookable half of the pair is what gives the campfire a job, and there is
# no sickness verb to punish eating it with, so the honest punishment is
# that the verb simply does not accept it.
[[consumable]]
id = "item.cooked_meat"
health = 10
food = 50
water = 3
seconds = 5

# The overcooked half (`cooking.toml`'s burnt row). Edible, and the worst
# food in the set — the repo's reference notes name the burnt state's
# SHAPE (a cook row whose input is the cooked item) and say nothing about
# its numbers, so this is the conservative call: burnt sits between
# nothing and a meal, it never heals, and 4 food against the cooked 40 is
# the price of walking away from a lit fire (5 until cactus flesh took
# Rust's 5: burnt stays strictly the worst). Raw meat stays inedible —
# burnt is what the FIRE does to food, not what the eat verb refuses.
[[consumable]]
id = "item.burnt_meat"
health = 0
food = 4
water = 0
seconds = 2

# A full waterskin: four mouthfuls of lake water carried away from the
# lake. Drinking it hands the empty skin back (`[survival]` vessel).
[[consumable]]
id = "item.waterskin_full"
health = 0
food = 0
water = 100
seconds = 2

# A full jug: two skins at once, so a slower drink.
[[consumable]]
id = "item.water_jug_full"
health = 0
food = 0
water = 200
seconds = 4
