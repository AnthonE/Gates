# ARMS keeps its guns and rounds under the counter until THE CRUCIBLE burns
# (`content/arc.toml`): no gunpowder, no guns, for anyone (`ARC.md` §1.3).
[[vendor]]
name = "ARMS"
offer = [
    { pay = "item.junk", pay_n = 20, get = "item.bow", get_n = 1 },
    { pay = "item.junk", pay_n = 5, get = "item.arrow_wood", get_n = 10 },
    { pay = "item.junk", pay_n = 15, get = "item.arrow_metal", get_n = 10 },
    { pay = "item.junk", pay_n = 30, get = "item.pistol_ammo", get_n = 10, unlock = "unlock.gunpowder" },
    { pay = "item.junk", pay_n = 60, get = "item.armor_roadsign_body", get_n = 1 },
    { pay = "item.junk", pay_n = 200, get = "item.revolver", get_n = 1, unlock = "unlock.gunpowder" },
]

# THE GATE's sentry guns (`sim-core/src/sentry.rs`): Rust's Outpost turrets,
# one on each watchtower roof. They shoot any hostile player standing in the
# safe zone — anyone who hurt, or tried to hurt, a player in the last five
# minutes (`combat::HOSTILE_TICKS`) — after a lock-on beep, and they cannot
# be hurt. Lethal on purpose: the zone is safe because breaking its rules
# inside it is a death.
[sentry]
range_m = 80
damage = 35
burst = 5
rate_ms = 110
burst_gap_ms = 900
lock_ms = 1500
lose_ms = 3000
spread_cm_per_10m = 12
