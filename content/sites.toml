# The town's vendors — THE GATE's kiosks (`sim-core/src/town.rs` KIOSKS,
# `sim-core/src/vend.rs`). Vendor k trades at kiosk k, in file order; there
# are six kiosks, three either side of the market street.
#
# Rust's Outpost is the shape (research 2026-09-30): category stalls for
# food, building, tools, components and a resource exchange, unlimited
# stock, and **no keycards for sale** — Facepunch pulled the blue card from
# Outpost because buying it skipped the monument ladder.
#
# Every price is junk on exactly one side, and the loader refuses a table
# that can be arbitraged: buying anything and selling it back — directly, or
# after running it through a recycler — must lose junk.

[[vendor]]
name = "RATIONS"
offer = [
    { pay = "item.junk", pay_n = 3, get = "item.corn", get_n = 4 },
    { pay = "item.junk", pay_n = 4, get = "item.cooked_meat", get_n = 2 },
    { pay = "item.junk", pay_n = 3, get = "item.berries", get_n = 10 },
    { pay = "item.junk", pay_n = 3, get = "item.bandage", get_n = 1 },
    { pay = "item.junk", pay_n = 25, get = "item.medkit", get_n = 1, unlock = "unlock.medicine" },
    { pay = "item.junk", pay_n = 2, get = "item.torch", get_n = 1 },
]

