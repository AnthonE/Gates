# The working coin (DESIGN.md §3.1) — **scrap's job in this game**, and an
# ordinary item stack on purpose: it is dropped on death, raidable in your
# base, and lost on a wipe, which is what makes the walk home worth
# anything. The recycler pays it (`cooking.toml`) and the research table
# burns it (`research.toml`); it is live, and it always should have been.
#
# **This row is not the redeemable thing** (operator, 2026-08-10: *"this
# isnt the same as the crypto coin u can cash out as"*). Two states share
# the name and only the other one is a token: *banked* JUNK is a ledger
# balance keyed to a wallet, with a merkle export and an on-chain claim,
# and THAT is what `ALPHA.md` §2 arms in stages. An item stack in a save
# file cannot be cashed out, so there was never anything here to gate —
# reading A1's "faucets off" as covering this row shipped an inert
# currency for a few hours on 2026-08-10, which is what the paragraph
# above now exists to prevent.
#
# Stack 1000 like the raw materials rather than 50 like the components:
# a hoard is the point, and a coin that filled your pockets at 50 would
# make the tense walk home a matter of inventory management instead of
# nerve. Confirmed 2026-08-11: their scrap stacks 1000 too (RIPLIST §1e),
# so the hoard call and the reference agree.
[[item]]
id = "item.junk"
name = "Junk"
description = "The island's coin. Vendors sell for it and research tables burn it."
stack = 1000
tier = 0
rarity = "rare"
slot = "none"
class = "resources"

# The blueprint (research table v1, 2026-09-23) — the paper a research
