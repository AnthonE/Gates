# The working coin (DESIGN.md §3.1) — **scrap's job in this game**, and an
# ordinary item stack on purpose: it is dropped on death, raidable in your
# base, and lost on a wipe, which is what makes the walk home worth
# anything. The recycler pays it (`cooking.toml`) and the research table
# burns it (`research.toml`); it is live, and it always should have been.
#
# **This row is not the redeemable thing** (operator, 2026-08-10: *"this
# isnt the same as the crypto coin u can cash out as"*). Two states share
# the name and only the other one is a token: *banked* JUNK is a ledger
# balance keyed to a wallet, with a merkle export and an on-chain claim,
# and THAT is what `ALPHA.md` §2 arms in stages. An item stack in a save
# file cannot be cashed out, so there was never anything here to gate —
# reading A1's "faucets off" as covering this row shipped an inert
# currency for a few hours on 2026-08-10, which is what the paragraph
# above now exists to prevent.
#
# Stack 1000 like the raw materials rather than 50 like the components:
# a hoard is the point, and a coin that filled your pockets at 50 would
# make the tense walk home a matter of inventory management instead of
# nerve. Confirmed 2026-08-11: their scrap stacks 1000 too (RIPLIST §1e),
# so the hoard call and the reference agree.
[[item]]
id = "item.junk"
name = "Junk"
stack = 1000
tier = 0
rarity = "rare"
slot = "none"
class = "resources"
description = "Scrap. Trade it at a kiosk, or spend it on benches and research."

# The blueprint (research table v1, 2026-09-23) — the paper a research
# table makes. ONE item for every recipe: which recipe a sheet teaches is
# carried by the stack itself (sim-core/research.rs), the reference's own
# shape. So it is a stack of one with no condition, and nothing but the
# table may make one (validate refuses it anywhere else). Rare, for the
# despawn clock: it is a sample and a pile of junk turned into paper.
[[item]]
id = "item.blueprint"
name = "Blueprint"
stack = 1
tier = 1
rarity = "rare"
slot = "none"
class = "other"
description = "Read it to learn a recipe for good."
cond_carries = "target"

# --- T0, the naked era -------------------------------------------------

# Condition (item durability v0, DECISIONS.md 2026-08-15): condition_max is
# hundredths of a point, TAKEN from the reference's item definitions — rock
# 100 pts, torch 50, stone tools 100, metal tools 400 — per item, never one
# constant (the 4x stone->metal step IS the tool ladder). Absent means 0
# means never wears and can never be repaired; a nonzero value requires
# stack = 1 (validate V7). The bat DOES wear and is unrepairable: worn out,
# it is re-crafted for 10 wood, which is the reference's own bootstrap
# shape. No repair verb exists in v0 -- re-craft is the repair (Q3).
#
# The bat is the old rock re-skinned (operator, 2026-10-06: Triple T's bat,
# "keep the rock stats"): every number the rock had, a wooden bat in hand.
[[item]]
id = "item.bat"
name = "Bat"
stack = 1
tier = 0
rarity = "common"
slot = "hand"
class = "weapons"
condition_max = 10000
description = "Triple T's bat. Tung tung tung. Better than fists, not by much."

[[item]]
id = "item.torch"
name = "Torch"
stack = 1
tier = 0
rarity = "common"
slot = "hand"
class = "tools"
description = "Light in the dark. F lights or snuffs it; it burns down as it goes."
# 50 pts, the reference's ceiling. No node pays a torch, so no
# gatherable condition_loss row names it (V3 forbids an unreachable one);
# what spends this is the flame itself and the blows it lands
# (weapons.toml's condition_loss, 7 pts a hit).
condition_max = 5000
# Hundredths of condition per minute while lit (torch fuel v0). The
# reference burns 1/6 of a point per second, which is 1000 hundredths a
# minute exactly, so a full torch is 5000/1000 = 5.00 minutes of light and
# then it is a stick. Nonzero here is also what makes this item a light at
# all -- see the schema field, and V16.
light_burn = 1000

