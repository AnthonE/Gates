# Gates · content/items.toml — the alpha item set (CONTENT.md §2, ~45 rows).
# Every number here is a knob with this file as its documented default
# (DECISIONS.md §open "content opening values"). Ids are permanent strings;
# renames are new ids. Rarity drives the despawn multiplier (§open row).
#
# Stack sizes are the reference's where a row has an equivalent and a
# source was obtainable (RIPLIST §1e, 2026-08-11, tier 3 — search
# summaries; every page fetch is egress-blocked). Rows §1e names as OPEN
# keep ours until somebody with a browser reads the page.
#
# tier: 0 naked era · 1 workbench era · 2 powder era
# slot: hand | head | body | none
# class: the craft rail's bucket (sim-core craft::CLASS_*) — construction | items |
#   resources | clothing | tools | medical | weapons | ammo | food | other
# description: one plain line the craft panel prints under the name, printable
#   ASCII, at most 72 bytes (validate; it rides the wire as `SUB_ITEM_DESCS`)

