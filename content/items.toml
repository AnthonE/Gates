# shape. So it is a stack of one with no condition, and nothing but the
# table may make one (validate refuses it anywhere else). Rare, for the
# despawn clock: it is a sample and a pile of junk turned into paper.
[[item]]
id = "item.blueprint"
name = "Blueprint"
description = "Made at a research table. Read it to learn the recipe it names."
stack = 1
tier = 1
rarity = "rare"
slot = "none"
class = "other"

# --- T0, the naked era -------------------------------------------------

# Condition (item durability v0, DECISIONS.md 2026-08-15): condition_max is
# hundredths of a point, TAKEN from the reference's item definitions — rock
# 100 pts, torch 50, stone tools 100, metal tools 400 — per item, never one
# constant (the 4x stone->metal step IS the tool ladder). Absent means 0
# means never wears and can never be repaired; a nonzero value requires
# stack = 1 (validate V7). The bat DOES wear and is unrepairable: worn out,
# it is re-crafted for 10 wood, which is the reference's own bootstrap
# shape. No repair verb exists in v0 -- re-craft is the repair (Q3).
#
# The bat is the old rock re-skinned (operator, 2026-10-06: Triple T's bat,
# "keep the rock stats"): every number the rock had, a wooden bat in hand.
[[item]]
id = "item.bat"
name = "Bat"
description = "A wooden club. Hits bodies and knocks wood, stone and ore loose."
stack = 1
tier = 0
rarity = "common"
slot = "hand"
class = "weapons"
condition_max = 10000

[[item]]
id = "item.torch"
name = "Torch"
description = "Held up lit, it lights the dark around you. It burns down while lit."
stack = 1
tier = 0
rarity = "common"
slot = "hand"
class = "tools"
# 50 pts, the reference's ceiling. No node pays a torch, so no
# gatherable condition_loss row names it (V3 forbids an unreachable one);
# what spends this is the flame itself and the blows it lands
# (weapons.toml's condition_loss, 7 pts a hit).
condition_max = 5000
# Hundredths of condition per minute while lit (torch fuel v0). The
# reference burns 1/6 of a point per second, which is 1000 hundredths a
# minute exactly, so a full torch is 5000/1000 = 5.00 minutes of light and
# then it is a stick. Nonzero here is also what makes this item a light at
# all -- see the schema field, and V16.
light_burn = 1000

